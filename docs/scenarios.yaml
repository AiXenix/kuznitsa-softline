    q: Средство антивирусной защиты конечных точек, наличие в ЕРРП, сертификат ФСТЭК, поддержка ОС Astra Linux, 100 узлов
    profile: guest
  detection: Длинный канцелярский запрос (10+ слов) без имени вендора, но с высокой плотностью технических атрибутов (класс ПО + ЕРРП + ФСТЭК/ФСБ + ОС + метрика).
  behaviour: Извлечь структурированный чек-лист требований из текста ТЗ (показать его пользователю в виде галочек «Распознанные требования ТЗ») и вывести только продукты, закрывающие максимум требований, с колонкой соответствия по каждому пункту.
  data_needed:
  - attribute_extractors
  - compliance
  - families.certs
  - families.compat_ru_os
  - families.formats
  priority: P0
  wow: Закупщик копирует абзац из ЕИС (zakupki.gov.ru) — система сама разбирает его на 5 фильтров и показывает матрицу соответствия.
  source: neon2
- id: migration_checklist_answer
  group: non_list_answers
  group_title: 'Длинный запрос и вопрос: фрагмент ТЗ, переход с другого продукта'
  title: Информационный ответ о порядке миграции и требованиях перехода (crossgrade / импортозамещение)
  user_goal: Понять, какие шаги, лицензии и подтверждающие документы нужны для перехода с зарубежного или конкурирующего продукта.
  intent: question
  surface: search
  examples:
  - как перейти с eset на касперский со скидкой
  demo:
    q: как перейти с eset на касперский со скидкой
    profile: guest
  detection: Вопросительные конструкции («как перейти», «какие документы нужны», «что нужно для перехода», «условия перехода») + маркер миграции/crossgrade.
  behaviour: Показать краткий структурированный ответ `answer` из `kb/faq.yaml` (чек-лист шагов и документов) + блок `analogs` / `products` с целевыми лицензиями crossgrade и услугами миграции.
  data_needed:
  - faq
  - analogs
  - sku.license_action:crossgrade
  - categories:tech_support
  priority: P1
  wow: Закрывает главный барьер перед миграцией — страх «а как мы это перенесём и оформим».
  source: neon2
- id: prefix_autocomplete_high_intent
  group: suggest_and_assistance
  group_title: Подсказки и допродажа
  title: Умное префиксное автодополнение по 2–4 символам с учётом профиля
  user_goal: Выбрать нужный запрос или продукт из выпадающего списка после ввода 2–4 букв, не допечатывая длинное название.
  intent: product
  surface: suggest
  examples:
  - кас
  - аст
  - крип
  demo:
    q: кас
    profile: guest
  detection: Запрос в endpoint `/api/suggest` длиной 2–6 символов.
  behaviour: 'Вернуть за < 50 мс структурированный саджест: 1) персональные подсказки (например, истекающая лицензия клиента, если совпадает префикс), 2) популярные завершённые запросы, 3) прямые переходы в семейства/вендоров/категории.'
  data_needed:
  - suggest_index
  - client_profile.owned
  - query_popularity
  priority: P0
  wow: В профиле `smb_trade` ввод «кас» на первой строке саджеста сразу предлагает «Продлить Kaspersky Small Office Security (15 устр., истекает через 21 дн.)».
  source: neon2
- id: suggest_layout_and_typo_live_fix
  group: suggest_and_assistance
  group_title: Подсказки и допродажа
  title: Живое исправление раскладки и опечатки прямо в выпадающем саджесте
  user_goal: Увидеть правильные подсказки, даже если забыл переключить раскладку или ошибся в первых буквах, ещё до нажатия Enter.
  intent: product
  surface: suggest
  examples:
  - rfcg
  - fcnh
  - rhbg
  demo:
    q: rfcg
    profile: guest
  detection: В `/api/suggest` нет прямых префиксных совпадений, но после конвертации раскладки QWERTY↔ЙЦУКЕН или фаззи-матча находятся высокочастотные сущности.
  behaviour: 'Показать подсказки уже по исправленному префиксу с аккуратной пометкой «раскладка: касп…» или «исправлено: каспер…», чтобы пользователь сразу кликнул правильный вариант.'
  data_needed:
  - layout_converter
  - suggest_index
  - kb_vocabulary
  priority: P0
  wow: 'Эффект «поиск читает мысли»: набираешь «fcnh», а саджест мгновенно выводит «Astra Linux Special Edition».'
  source: neon2
- id: suggest_instant_entity_jump
  group: suggest_and_assistance
  group_title: Подсказки и допродажа
  title: 'Подсказки по вендору: товары, разделы и допродажа в выпадающем списке'
  user_goal: Набрать имя вендора и сразу выбрать товар или раздел из подсказки, не открывая выдачу.
  intent: sku
  surface: suggest
  examples:
  - Positive
  - касперский
  demo:
    q: Positive
    profile: guest
  detection: В `/api/suggest` найдено точное совпадение с артикулом SKU, вендором, семейством или листовой категорией.
  behaviour: Отобразить в саджесте мини-карточку сущности с типом бейджа («Артикул», «Вендор», «Продукт», «Категория») и ориентиром цены/числа товаров.
  data_needed:
  - suggest_index
  - sku.vendor_code
  - vendors
  - categories
  priority: P1
  wow: Закупщик вставляет префикс артикула `KL4867` и видит мини-карточку с ценой ещё до загрузки страницы выдачи.
  source: neon2
- id: related_and_next_step_suggestions
  group: suggest_and_assistance
  group_title: Подсказки и допродажа
  title: 'Допродажа к найденному товару: «Часто покупают вместе», акция и альтернатива'
  user_goal: 'Найти Astra Linux и сразу увидеть, что берут вместе с ней: защиту, резервное копирование, офис — с причиной у каждой рекомендации.'
  intent: product
  surface: search
  examples:
  - astra linux
  - криптопро csp 5.0
  - windows server 2022 standard
  demo:
    q: astra linux
    profile: guest
  detection: Успешный поиск по якорному продукту, у которого в KB заданы связанные слоты/компаньоны (СКЗИ → USB-токены; Серверная ОС → CAL; Astra → ALD Pro / Р7 / антивирус; 1С → ИТС / ЭДО).
  behaviour: Под основным товаром — блок «Часто покупают вместе» с причиной; в выдаче — «Вам может пригодиться» не больше 3 мест из 8; метка «Акция −N %», если действует скидка.
  data_needed:
  - cross_sell_rules
  - roles
  - client_profile.owned
  priority: P1
  wow: 'Увеличивает глубину чека (items per order) органично и полезно: при покупке Windows Server сразу напоминает про CAL.'
  source: neon2
- id: did_you_mean_soft_correction
  group: suggest_and_assistance
  group_title: Подсказки и допродажа
  title: Мягкая коррекция при сомнительной опечатке (без поломки редких брендов и кодов)
  user_goal: Найти редкий вендор, аббревиатуру или версию ПО, не пострадав от агрессивной автозамены на популярное слово.
  intent: product
  surface: search
  examples:
  - алт
  demo:
    q: алт
    profile: guest
  detection: Короткий токен совпадает с редким/нишевым продуктом или вендором из KB (`KUMA`, `Брест`, `Альт`, `РОСА`, `Renga`, `Tantor`, `Аврора`, `Соболь`, `Гарда`, `ТЕЗИС`), но также близок по Левенштейну к бытовому или более частотному слову.
  behaviour: 'Никогда не заменять валидный термин из KB! Если же токен действительно неизвестен, но уверенность исправления средняя — показать результаты по лучшему варианту и кликабельную ссылку «Искать точно как введено: …» (или наоборот), логируя `correction_accept` / `correction_reject`.'
  data_needed:
  - kb_protected_vocabulary
  - typo_corrector
  - analytics.events:correction_reject
  priority: P1
  wow: «кума» находит Kaspersky KUMA (SIEM), «брест» — виртуализацию ПК СВ Брест, «соболь» — ПАК Соболь, а не исправляется ошибочно.
  source: neon2
- id: signal_margin_safe_merchandising
  group: business_analytics_signals
  group_title: Сигналы для бизнеса
  title: Коммерческое управление выдачей (маржа и фокусные вендоры) без ущерба релевантности
  user_goal: Руководитель e-com и категорийный менеджер хотят поднимать высокомаржинальные и приоритетные лицензии, сохраняя доверие покупателя и качество поиска.
  intent: null
  surface: admin
  examples:
  - российский антивирус для бизнеса
  - отечественный офисный пакет
  - система резервного копирования из реестра
  - удаленный доступ российский
  - корпоративная вкс из реестра
  - российская операционная система
  - защита от утечек dlp
  - российский аналог teamviewer
  demo:
    admin_tab: manager
  detection: Категорийный или аналоговый запрос, по которому в релевантной полосе Tier 1 присутствует >= 3 равноценных по соответствию требованиям продукта с разной маржинальностью.
  behaviour: Ранжирование строго соблюдает барьер полос (Tier 0 > Tier 1 > Tier 2 > Tier 3 — 0 инверсий полос), а вес `margin` и правила мерчандайзинга (`merch_rule`) переупорядочивают только равнорелевантные товары внутри одной полосы. В дашборде руководителя отображается симулятор «Маржа vs NDCG@5».
  data_needed:
  - sku.margin_pct
  - ranking.bands
  - merch_rules
  - agent.insight:merch_rule,weights_advice
  priority: P0
  wow: На живом слайдере руководитель увеличивает вес маржи и видит рост маржинальной выручки при неизменных NDCG@5 и 0 нарушениях релевантности.
  source: neon2
- id: audience_from_slang
  group: language_errors
  group_title: 'Язык: раскладка, опечатки, сленг'
  title: Аудитория по жаргону
  user_goal: Найти подходящее назначение продукта, описав покупателя своими словами.
  intent: product
  surface: search
  examples:
  - каспер для хоума
  - касперский для домика
  demo:
    q: каспер для хоума
