  source: neon2
- id: signal_catalog_gap_monetization
  group: business_analytics_signals
  group_title: Сигналы для бизнеса
  title: Выявление пробелов каталога с консервативной оценкой упущенной выручки
  user_goal: Контент-менеджер и категорийный менеджер хотят получить приоритизированный список продуктов, которых нет в каталоге, но которые системно
    ищут покупатели.
  intent: null
  surface: admin
  examples:
  - yonote корпоративный
  - kaiten лицензия для юрлиц
  - holst доски корпоративный тариф
  - angie pro лицензия
  - passwork корпоративный
  - compass мессенджер on-premise
  - pix bi лицензия
  - weeek для команды
  demo:
    admin_tab: content
  detection: Регулярные запросы (`>= 10` уникальных сессий за 30 дней) с причиной `not_in_catalog_known` по доступному на рынке РФ (российскому
    или дружественному) ПО — отдельно от ушедших брендов (`vendor_left`) и мусора (`off_topic`).
  behaviour: Агент создаёт инсайт `add_product` с числом сессий, профилями клиентов, оценкой потенциальной выручки (консервативной, с прозрачной
    формулой) и предлагаемыми текущими аналогами-мостами, пока товар не заведён.
  data_needed:
  - query_log
  - families.catalog:no
  - vendors.market_status
  - agent.insight:add_product
  priority: P0
  wow: Отделяет реальный коммерческий пробел («Passwork / Yonote / Angie Pro не заведены в прайс — теряем заказы») от ушедших вендоров и спама.
  source: neon2
- id: signal_vocabulary_gap_synonym_discovery
  group: business_analytics_signals
  group_title: Сигналы для бизнеса
  title: Автообнаружение пробелов словаря и новых синонимов из лога поиска
  user_goal: Контент-менеджер хочет одним кликом закрывать жаргонизмы, сокращения и новые названия, из-за которых поиск даёт 0 или слабую выдачу.
  intent: null
  surface: admin
  examples:
  - адешка для линукса
  - эцпшка буху
  - файрволл фстэк
  - бэкапилка для виртуалок
  - кесб продленка
  - савз на сервер
  - почтовик в контур
  - терминальник 2022
  demo:
    admin_tab: agent
  detection: Запрос даёт `zero_result` или низкий CTR (< 5%) при >= 5 сессиях, и в >= 30% этих сессий пользователь успешно переформулирует запрос
    в существующую сущность каталога.
  behaviour: Агент формирует инсайт `add_synonym` с парой `термин -> целевая категория/семейство`, примерами сессий и прогнозом спасённых запросов.
    Кнопка «Применить» добавляет синоним в live-индекс, а через 7 дней (или на replay) система проверяет рост CTR и падение zero-rate.
  data_needed:
  - query_log
  - analytics.events:reformulate
  - slang
  - agent.insight:add_synonym
  priority: P0
  wow: На демо контент-менеджер нажимает «Применить синоним» в инсайте агента — и проблемный запрос тут же начинает давать точную выдачу!
  source: neon2
- id: signal_card_content_gap_high_bounce
  group: business_analytics_signals
  group_title: Сигналы для бизнеса
  title: Обнаружение дефектных карточек товара с высоким спросом и низкой конверсией
  user_goal: Контент-менеджер хочет знать, какие именно карточки теряют продажи из-за пустых атрибутов (не указана совместимость с Astra Linux,
    нет статуса ЕРРП, нет цены, неверная метрика).
  intent: null
  surface: admin
  examples:
  - антивирус под астра линукс
  - офис без ндс
  - бэкап для postgres
  - удаленный доступ с фстэк
  - сапр сетевая лицензия
  - мессенджер on-premise
  - вкс на 100 участников
  - субд из реестра
  demo:
    admin_tab: content
  detection: Товар часто показывается или отсеивается фильтрами из-за `null`-атрибутов, либо имеет высокий CTR (> 20%) при аномально низкой конверсии
    в корзину (< 1%) и быстрых возвратах в выдачу (pogo-sticking).
  behaviour: Агент создаёт инсайт `fix_card` со списком конкретных SKU, указанием недостающих полей (`compat_ru_os`, `registry`, `certs`, `license_action`,
    `price`) и ожидаемым ростом охвата по популярным фильтрам.
  data_needed:
  - catalog.sku
  - query_log.filters
  - analytics.events:click,cart,exit
  - agent.insight:fix_card
  priority: P0
  wow: Показывает контент-менеджеру не абстрактную «полноту каталога 82%», а конкретные 12 карточек, заполнение которых даст максимальный эффект
    в рублях.
  source: neon2
- id: signal_proactive_renewal_wave
  group: business_analytics_signals
  group_title: Сигналы для бизнеса
  title: Сигнал риска оттока при поиске конкурентов клиентом с истекающей лицензией
  user_goal: Менеджер e-com хочет вовремя узнать, что действующий клиент с истекающей через 30 дней лицензией ищет аналоги или цены конкурентов.
  intent: null
  surface: admin
  examples:
  - антивирус не касперский
  - dr web вместо касперского
  - мой офис или р7 офис что дешевле
  - замена битрикс24
  - аналог кибер бэкап
  - сравнение ассистент и rudesktop
  - переход с dr web на pro32
  - контур экстерн или сбис что выгоднее
  demo:
    admin_tab: manager
  detection: Авторизованный клиент с `owned.expires_in_days <= 45` делает запросы на конкурирующие продукты, исключение своего текущего вендора
    (`exclude_vendor`) или сравнение цен.
  behaviour: В поиске для клиента — честная релевантная выдача + мягкое напоминание о выгодной цене продления текущей лицензии (обычно дешевле
    новой покупки конкурента). В аналитике менеджера e-com — инсайт `renewal_campaign` / риск оттока с объёмом контракта под угрозой.
  data_needed:
  - client_profile.owned
  - query_log
  - agent.insight:renewal_campaign
  priority: P1
  wow: Превращает поисковый лог в систему раннего предупреждения оттока (churn alert) для B2B-аккаунт-менеджеров.
  source: neon2
- id: signal_margin_safe_merchandising
  group: business_analytics_signals
  group_title: Сигналы для бизнеса
  title: Коммерческое управление выдачей (маржа и фокусные вендоры) без ущерба релевантности
  user_goal: Руководитель e-com и категорийный менеджер хотят поднимать высокомаржинальные и приоритетные лицензии, сохраняя доверие покупателя
    и качество поиска.
  intent: null
  surface: admin
  examples:
  - российский антивирус для бизнеса
  - отечественный офисный пакет
  - система резервного копирования из реестра
  - удаленный доступ российский
  - корпоративная вкс из реестра
  - российская операционная система
  - защита от утечек dlp
  - российский аналог teamviewer
  demo:
    admin_tab: manager
  detection: Категорийный или аналоговый запрос, по которому в релевантной полосе Tier 1 присутствует >= 3 равноценных по соответствию требованиям
    продукта с разной маржинальностью.
  behaviour: Ранжирование строго соблюдает барьер полос (Tier 0 > Tier 1 > Tier 2 > Tier 3 — 0 инверсий полос), а вес `margin` и правила мерчандайзинга
    (`merch_rule`) переупорядочивают только равнорелевантные товары внутри одной полосы. В дашборде руководителя отображается симулятор «Маржа
    vs NDCG@5».
  data_needed:
  - sku.margin_pct
  - ranking.bands
  - merch_rules
  - agent.insight:merch_rule,weights_advice
  priority: P0
  wow: На живом слайдере руководитель увеличивает вес маржи и видит рост маржинальной выручки при неизменных NDCG@5 и 0 нарушениях релевантности.
  source: neon2
