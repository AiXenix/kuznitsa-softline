  title: Навигационные запросы к своим лицензиям, заказам и документам в строке поиска
  user_goal: Из главной строки поиска мгновенно увидеть свои действующие лицензии, сроки продления и статус счетов.
  intent: account
  surface: search
  examples:
  - мои лицензии
  - что у нас скоро истекает
  - когда кончается касперский
  - продлить мои подписки
  - история заказов
  - скачать закрывающие документы
  - мои счета на оплату
  - список купленного по
  - активные ключи компании
  demo:
    q: что у нас скоро истекает
    profile: smb_trade
  detection: 'Интент `account`: притяжательные местоимения («мои», «наши», «у нас») + сущности ЛК («лицензии», «подписки», «заказы», «счета»,
    «ключи», «истекает», «закрывающие»).'
  behaviour: Для авторизованного клиента вывести интерактивный блок `my_licenses` со списком его лицензий, отсортированным по `expires_in_days`,
    и кнопками «Продлить» / «Докупить». Для гостя — предложить войти в профиль (или выбрать демо-профиль).
  data_needed:
  - client_profile.owned
  - client_profile.orders
  - intent:account
  priority: P1
  wow: 'Строка поиска превращается в единую точку входа для постоянного B2B-клиента: вбил «что скоро истекает» — увидел все горящие продления
    компании.'
  source: neon2
- id: repeat_order_from_history
  group: context_personalization
  group_title: Контекст клиента
  title: Повтор прошлой закупки с изменением масштаба или срока
  user_goal: Повторить заказ прошлого года («то же самое, что брали, но на 2 года / на 40 ПК»), не вспоминая точное название редакции.
  intent: account
  surface: search
  examples:
  - повторить прошлый заказ антивируса
  - продлить как в прошлом году на 2 года
  - докупить еще 10 таких же лицензий офиса
  - такой же бэкап еще на 5 серверов
  - повторная закупка криптопро
  - продлить всё что брали год назад
  - та же версия нанокад еще 5 мест
  - продление нашего комплекта
  demo:
    q: повторить прошлый заказ антивируса
    profile: smb_trade
  detection: Слова повтора («повторить», «как в прошлом году», «такой же», «наш комплект», «что брали») + наличие истории `client_profile.orders`.
  behaviour: Найти соответствующий прошлый заказ/позицию в `orders`/`owned`, подставить новую метрику/количество/срок из текущего запроса и сформировать
    готовый предзаказ с пересчётом цены.
  data_needed:
  - client_profile.orders
  - client_profile.owned
  - sku.bands
  priority: P2
  wow: 'Максимально сокращает путь повторной B2B-сделки: один запрос вместо переписки с менеджером «пришлите счёт как в прошлом октябре».'
  source: neon2
- id: chain_qty_recalculation
  group: session_refinement_chains
  group_title: Цепочки уточнений в сессии
  title: Уточнение количества в следующем запросе сессии («а на 50?», «100 пк»)
  user_goal: Прикинуть бюджет на разные варианты штата (30, 50, 100 мест), не перепечатывая длинный запрос целиком.
  intent: renewal
  surface: chain
  examples:
  - а на 50?
  - на 100 пк
  - посчитай на 25 человек
  - а если 200 узлов
  - 15 мест
  - на 5 серверов
  - а на 500 рабочих мест сколько выйдет
  - для 12 сотрудников
  demo:
    chain:
    - каспер продление на 30 компов
    - а на 50?
    profile: smb_trade
  detection: Короткий эллиптический запрос содержит только число/метрику (и маркер продолжения «а», «если», «на») при активном контексте предыдущего
    запроса в сессии (`session.last_query`).
  behaviour: 'Унаследовать продукт/категорию и фильтры из `session.last_query`, заменить `qty` и `metric`, переподобрать ценовой диапазон (band)
    и мгновенно пересчитать итоговую стоимость с бейджем контекста «Пересчитано для: <предыдущий запрос> · 50 ПК».'
  data_needed:
  - session_context.last_state
  - sku.bands
  - qty_extractor
  priority: P0
  wow: Пользователь ищет «касперский продление 30 пк», затем просто пишет «а на 50?» — поиск сам переключает band с 25–49 на 50–99 и показывает
    более выгодную цену за узел.
  source: neon2
- id: chain_cheaper_or_budget_pivot
  group: session_refinement_chains
  group_title: Цепочки уточнений в сессии
  title: Уточнение в сессии по цене («подешевле», «в пределах 100 тыс», «есть аналоги дешевле?»)
  user_goal: После просмотра первых цен быстро найти более доступную редакцию или бюджетного вендора в том же классе задач.
  intent: category
  surface: chain
  examples:
  - подешевле
  - есть что-то дешевле?
  - бюджетный вариант
  - а до 50000 рублей
  - слишком дорого, что попроще
  - более дешевый аналог
  - уложиться в 30 тыс
  - эконом версия
  demo:
    chain:
    - антивирус на 50 пк
    - подешевле
    profile: guest
  detection: Сравнительные/ценовые маркеры («подешевле», «дешевле», «дорого», «попроще», «до N руб») без указания категории при наличии `session.last_state`.
  behaviour: Сохранить категорию и ограничения (ОС, реестр, сертификаты) из прошлого шага, пересортировать внутри релевантной полосы по цене вверх
    (или применить `price_max`), показать младшие редакции и бюджетных конкурентов, не нарушая обязательных требований.
  data_needed:
  - session_context.last_state
  - sku.price
  - families.editions
  priority: P0
  wow: 'Живой диалоговый паттерн без навязчивого чат-окна: в той же строке поиска «подешевле» сразу перестраивает витрину под бюджет.'
  source: neon2
- id: chain_os_or_compliance_pivot
  group: session_refinement_chains
  group_title: Цепочки уточнений в сессии
  title: Добавление платформенного или регуляторного ограничения на втором шаге («а под астру?», «из реестра»)
  user_goal: Сузить уже найденную подборку ПО до совместимости с российской ОС или наличия сертификатов.
  intent: category
  surface: chain
  examples:
  - а под астру?
  - только из реестра
  - с сертификатом фстэк
  - на ред ос работает?
  - под макос
  - чтобы без ндс
  - для 44-фз
  - на линукс
  - в закрытый контур без облака
  demo:
    chain:
    - антивирус на 50 пк
    - а под астру?
    - с сертификатом фстэк
    profile: guest
  detection: Фрагмент-модификатор ОС/комплаенса/развёртывания без указания категории/продукта при непустом `session.last_state`.
  behaviour: Наложить новый фильтр поверх `session.last_state`, отобразить накопленные чипы фильтров и объяснить, какие позиции остались, а какие
    отсеялись (если отсеялись все — предложить ближайшие совместимые альтернативы).
  data_needed:
  - session_context.last_state
  - families.compat_ru_os
  - families.registry
  - families.certs
  priority: P0
  wow: 'Наглядная демонстрация памяти сессии: «резервное копирование» → «под астру» → «с фстэк» за 3 коротких ввода.'
  source: neon2
- id: chain_term_or_model_pivot
  group: session_refinement_chains
  group_title: Цепочки уточнений в сессии
  title: Смена срока или модели лицензирования в цепочке («а на 3 года?», «а бессрочную?»)
  user_goal: Сравнить стоимость годовой подписки, 2–3-летнего контракта и бессрочной лицензии для выбранного продукта.
  intent: product
  surface: chain
  examples:
  - а на 2 года?
  - на 3 года сколько
  - а бессрочная есть?
  - а по подписке
  - а сетевая плавающая
  - в коробке а не электронная
  - с расширенной поддержкой
  - а на 36 месяцев
  demo:
    chain:
    - р7 офис 50 лицензий на год
    - а на 2 года?
    - а бессрочная есть?
    profile: guest
  detection: Указание срока, модели, метрики или способа поставки без названия продукта при активном `session.last_state`.
  behaviour: Переключить SKU-варианты текущего продукта/подборки на новый срок/модель и показать сравнение выгоды (например, «На 3 года выгоднее
    годового продления»). Если бессрочной модели у продукта не существует — честно объяснить это.
  data_needed:
  - session_context.last_state
  - sku.term_months
  - sku.license_model
  - sku.metric
  priority: P1
  wow: Позволяет закупщику в 2 секунды сравнить CAPEX (бессрочная) vs OPEX (подписка на 1/2/3 года) прямо из поиска.
  source: neon2
- id: chain_reformulation_after_failure
  group: session_refinement_chains
  group_title: Цепочки уточнений в сессии
  title: Переформулировка после нулевой или нерелевантной выдачи
  user_goal: Найти нужный продукт со второй попытки другими словами, если первая формулировка (жаргон, редкий бренд, узкий термин) не сработала.
  intent: category
  surface: chain
  examples:
  - файрвол -> межсетевой экран
  - защита от шифровальщиков -> антивирус edr
  - программа для схем -> редактор диаграмм
  - терминалка -> удаленный рабочий стол
  - аудит пк -> инвентаризация по itam
  - облачный диск корпоративный -> файловое хранилище корпоративное
  - софт для кс2 -> сметная программа
  - контроль сотрудников -> учет рабочего времени
  demo:
    chain:
    - файрвол
    - межсетевой экран
    profile: guest
  detection: Два запроса в одной сессии с интервалом <= 120 секунд, где первый дал `zero_result` или `exit_without_click`, а второй привёл к `click`
    / `cart`.
  behaviour: Для пользователя — не переносить сломанные фильтры от первого неудачного запроса; для аналитики — связать пару `(q1 -> q2)` событием
    `reformulate` и автоматически выдвинуть кандидата на синоним/use_case для контент-менеджера.
  data_needed:
  - session_context.history
  - analytics.events:reformulate
  - agent.insight:add_synonym
  priority: P0
  wow: 'Главный механизм самообучения «Кузницы Softline»: неудачные переформулировки превращаются в готовые предложения синонимов для контент-менеджера.'
  source: neon2
- id: chain_competitor_alternative_pivot
  group: session_refinement_chains
  group_title: Цепочки уточнений в сессии
  title: Переход к альтернативному вендору в сессии («что вместо этого?», «другой вендор»)
  user_goal: После просмотра карточки продукта оценить 2–3 прямых конкурентов того же класса и уровня комплаенса.
  intent: analog
  surface: chain
  examples:
  - что вместо этого
  - аналоги подешевле
  - другой производитель
  - не касперский
  - а конкуренты какие есть
  - альтернативы из реестра
  - кто еще делает такое по
  - сравнить с конкурентами
  demo:
    chain:
    - касперский на 50 пк
    - что вместо этого
    profile: guest
  detection: Запрос-переход на альтернативы без названия исходного продукта при наличии просмотренного/найденного семейства в `session.last_state`.
  behaviour: Исключить текущего вендора из топа, подобрать прямых конкурентов из той же листовой категории и блока `analogs` с сохранением ограничений
    (ОС, реестр, сертификаты) и предложить быструю таблицу сравнения.
