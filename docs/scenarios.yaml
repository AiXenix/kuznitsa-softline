- id: spec_list_messy_email_paste
  group: non_list_answers
  group_title: 'Ответ не списком: смета, ТЗ, расчёт, заявка'
  title: Вставка «грязной» заявки из письма, Excel или 1С с лишними колонками и шумом
  user_goal: Скопировать фрагмент письма от ИТ-отдела или таблицы закупки как есть (с нумерацией, ценами, «срочно!», «шт.», комментариями) и получить
