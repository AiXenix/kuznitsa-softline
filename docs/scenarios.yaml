# Галерея сценариев «Кузницы Softline» под задачу «Умный поиск на сайте» (store.softline.ru).
# Оставлены только сценарии, проверенные на настоящем каталоге 27.11.2026: в каждом — примеры, на которые стенд отвечает верно.
# Прежняя галерея из 120 сценариев демо-каталога — design/archive/scenarios-120-demo-catalog.yaml.
- id: exact_product_family
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Прямой поиск по названию семейства ПО
  user_goal: Найти конкретный известный продукт и перейти к выбору нужной лицензии.
  intent: category
  surface: search
  examples:
  - kaspersky endpoint security
  - р7 офис
  - мойофис стандартный
  demo:
    q: kaspersky endpoint security
    profile: guest
  detection: Точное или нечёткое совпадение с каноническим названием или алиасом семейства ПО без сложных дополнительных ограничений.
  behaviour: Показать карточку семейства на первом месте с предвыбранным популярным B2B-вариантом, сгруппировать SKU внутри карточки, вывести быстрые переключатели срока/редакции/типа лицензии.
  data_needed:
  - families.name
  - families.aliases
  - sku_grouping
  - popularity
  priority: P0
  wow: Мгновенная склейка 40+ прайсовых SKU в одну чистую карточку с интерактивным конфигуратором прямо в выдаче.
  source: neon
- id: vendor_catalog_browse
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск по имени вендора (бренду)
  user_goal: Посмотреть всю линейку доступных продуктов конкретного производителя.
  intent: product
  surface: search
  examples:
  - лаборатория касперского
  - базальт спо
  - positive technologies
  demo:
    q: лаборатория касперского
    profile: guest
  detection: Запрос целиком состоит из названия или алиаса вендора (возможно со словами «продукты», «линейка», «по», «лицензии»).
  behaviour: 'Показать витрину вендора: краткую справку (страна, статус в РФ, наличие в реестре), фасет по категориям вендора и топ-продукты, отсортированные по популярности и маржинальности.'
  data_needed:
  - vendors.name
  - vendors.aliases
  - vendors.market_status
  - vendors.categories
  - margin
  - popularity
  priority: P0
  wow: Для активного вендора — карточка экосистемы; для ушедшего — автоматический баннер с российскими аналогами.
  source: neon
- id: product_with_edition
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск продукта с конкретной редакцией или комплектацией
  user_goal: Найти именно нужную редакцию (Standard/Advanced/Enterprise/ПРОФ/КОРП/Смоленск/Воронеж), не тратя время на остальные.
  intent: product
  surface: search
  examples:
  - kes расширенный
  - ред ос сервер
  demo:
    q: kes расширенный
    profile: guest
  detection: 'Обнаружены сущность семейства и токен редакции из families.editions (или кросс-вендорные слова: стандарт, проф, корп, сервер, базовый, расширенный).'
  behaviour: Отфильтровать или жёстко поднять SKU нужной редакции; в карточке предвыбрать эту редакцию; показать бейдж отличия от соседней редакции.
  data_needed:
  - families.editions
  - sku.edition
  - edition_comparison_notes
  priority: P0
  wow: Показ короткой подсказки «Чем Расширенный отличается от Стандартного» прямо под заголовком.
  source: neon
- id: product_with_version
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск конкретной версии или ветки продукта
  user_goal: Купить совместимую с текущей инфраструктурой версию ПО (например, 1С 8.3, КриптоПро 5.0, Astra 1.7/1.8, LTSC).
  intent: product
  surface: search
  examples:
  - криптопро csp 5.0
  - астра линукс 1.8
  demo:
    q: криптопро csp 5.0
    profile: guest
  detection: Семейство + числовой/буквенно-числовой маркер версии (1.7, 1.8, 5.0, 8.3, 2021, 2022, v23, ltsc).
  behaviour: Предпочесть SKU с точным совпадением версии; если запрошена устаревшая версия (например, КриптоПро 4.0 или Astra 1.6), показать актуальную с примечанием о праве даунгрейда или окончании поддержки.
  data_needed:
  - families.versions
  - sku.version
  - downgrade_rights_notes
  priority: P1
  wow: Предупреждение при поиске снятой с продаж версии и автоматический показ актуальной версии с правом downgrade.
  source: neon
- id: direct_category_search
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск по названию класса ПО (категории)
  user_goal: Увидеть все подходящие решения определённого класса для сравнения и выбора.
  intent: category
  surface: search
  examples:
  - антивирус для организации
  - межсетевой экран ngfw
  - система резервного копирования
  demo:
    q: антивирус для организации
    profile: guest
  detection: Запрос соответствует канонической категории, её синонимам или сленгу без указания конкретного вендора.
  behaviour: Открыть выдачу по целевой листовой категории, включить релевантные фасеты (реестр, ФСТЭК, платформа, модель лицензирования), ранжировать с учётом сегмента клиента, популярности и маржи.
  data_needed:
  - categories.synonyms
  - categories.slang
  - categories.parent
  - client_segment
  - popularity
  - margin
  priority: P0
  wow: Разный порядок выдачи для малого бизнеса и госзаказчика на один и тот же запрос «почтовый сервер».
  source: neon
- id: exact_vendor_sku
  group: sku_codes
  group_title: Артикулы и коды
  title: Поиск по точному артикулу (партномеру) вендора
  user_goal: Моментально найти позицию из счёта, КП или прошлогодней спецификации.
  intent: sku
  surface: search
  examples:
  - KL4867RAQFR
  - FQC-10572
  - KL4863RAKFR
  demo:
    q: KL4867RAQFR
    profile: guest
  detection: Буквенно-цифровой код с характерным паттерном партномера (дефисы, префиксы вендоров KL/FQC/P73/R7/4601546..., отсутствие обычных слов).
  behaviour: Прямой приоритетный поиск по sku/mpn (с нормализацией дефисов, пробелов и регистра). При точном совпадении — вывести карточку SKU крупно первым блоком с ценой и кнопкой в корзину.
  data_needed:
  - sku.vendor_code
  - sku.softline_id
  - sku.ean_barcode
  priority: P0
  wow: Мгновенное распознавание артикула даже с пропущенным дефисом или кириллической буквой «С/А/К» вместо латиницы.
  source: neon
- id: mixed_cyrillic_latin_sku
  group: sku_codes
  group_title: Артикулы и коды
  title: Артикул со смешанной кириллицей и латиницей (скопирован из PDF/Word)
  user_goal: Найти товар по коду, скопированному из кривого КП, где визуально похожие буквы (А, В, Е, К, М, Н, О, Р, С, Т, Х) набраны кириллицей.
  intent: sku
  surface: search
  examples:
  - КL4867RАQFR
  - FQС-10572
  - Р7-ОFFIСЕ
  demo:
    q: КL4867RАQFR
    profile: guest
  detection: Токен похож на артикул и содержит смесь латинских и кириллических гомоглифов.
  behaviour: Нормализовать гомоглифы в латиницу (А→A, С→C, К→K, О→O, Р→P, Т→T, Х→X, Е→E, Н→H, М→M, В→B), выполнить точный поиск по SKU и показать уведомление об исправлении.
  data_needed:
  - normalizer.homoglyphs
  - sku.vendor_code
  priority: P0
  wow: 'Демонстрация реальной боли закупщиков: копипаста артикула из PDF-счёта с русскими буквами находится без осечки.'
  source: neon
- id: renewal_by_quantity
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Продление лицензии на N устройств/пользователей
  user_goal: Быстро найти позицию именно продления (а не новой покупки) в нужном ценовом диапазоне узлов (tier/band).
  intent: renewal
  surface: search
  examples:
  - каспер продление на 30 компов
  - kes renewal 50
  demo:
    q: каспер продление на 30 компов
    profile: guest
  detection: Наличие маркера действия renewal («продление», «продлёнка», «продлить», «пролонгация», «renewal», «renew») + число + единица метрики («компов», «пк», «узлов», «мест», «юзеров», «серверов»).
  behaviour: 'Отфильтровать SKU по license_action=renewal, подобрать правильный ценовой диапазон (band: для 30 → 25-49), показать цену за 1 узел и расчётную сумму за N узлов (30 × цена).'
  data_needed:
  - sku.license_action
  - sku.min_qty
  - sku.max_qty
  - sku.metric
  - slang.licensing
  priority: P0
  wow: 'Калькулятор прямо в карточке выдачи: «Подобран диапазон 25–49 узлов: 2 857 ₽ × 30 ПК = 85 710 ₽ (без НДС)».'
  source: neon
- id: new_license_by_quantity_and_term
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Покупка новой лицензии с указанием количества и срока
  user_goal: Подобрать базовую (новую) лицензию на конкретное число рабочих мест и срок (1, 2, 3 года или бессрочно).
  intent: category
  surface: search
  examples:
  - антивирус на 100 компьютеров на 2 года
  - р7 офис 50 лицензий на год
  - астра линукс 200 рабочих мест
  demo:
    q: антивирус на 100 компьютеров на 2 года
    profile: guest
  detection: Продукт/категория + количество (N) + срок (1/2/3 года, 12/24/36 мес, бессрочно) + опционально маркер new («новая», «базовая», «первичная»).
  behaviour: Выбрать license_action=new, срок и ценовой band под N; посчитать итоговую сумму и подсказать экономию при выборе 2–3 лет (если есть SKU).
  data_needed:
  - sku.license_action
  - sku.term_months
  - sku.model
  - sku.min_qty
  - sku.max_qty
  priority: P0
  wow: Подсказка «На 2 года дешевле на 18% в пересчёте на год» прямо в карточке.
  source: neon
- id: perpetual_vs_subscription
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: 'Выбор модели лицензирования: бессрочная или подписка'
  user_goal: Купить именно бессрочную (постоянную, неисключительную без срока) лицензию или наоборот годовую подписку под OPEX.
  intent: product
  surface: search
  examples:
  - бессрочная лицензия офиса
  - р7 офис бессрочный
  demo:
    q: бессрочная лицензия офиса
    profile: guest
  detection: 'Маркеры модели: «бессрочная», «постоянная», «навсегда», «без подписки», «perpetual» vs «подписка», «годовая», «помесячно», «subscription», «аренда».'
  behaviour: Жёстко фильтровать по license.model (perpetual / subscription). Если продукт продаётся только по подписке (например, антивирус), честно объяснить это и не выдавать пустую страницу.
  data_needed:
  - sku.license_model
  - families.license.models
  priority: P0
  wow: Честное пояснение «Корпоративные антивирусы лицензируются только по подписке (1–3 года) из-за обновлений баз» вместо нуля результатов.
  source: neon
- id: license_addon_expansion
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Докупка (долицензирование) узлов к действующей лицензии
  user_goal: Увеличить количество рабочих мест в уже купленной лицензии, не переплачивая за отдельный ключ.
  intent: product
  surface: search
  examples:
  - докупка лицензий касперский 10 узлов
  - долицензирование kesb на 15 пк
  demo:
    q: докупка лицензий касперский 10 узлов
    profile: guest
  detection: Слова «докупка», «докупить», «долицензирование», «расширение», «добавить мест/пользователей», «addon», «доп лицензии».
  behaviour: Приоритизировать SKU с license_action=addon или пакеты клиентских лицензий (как у 1С); подсказать, что срок докупки обычно выравнивается до даты окончания основной лицензии.
  data_needed:
  - sku.license_action
  - families.license.actions
  - faq.addon_rules
  priority: P1
  wow: Карточка с пояснением про ко-терминг (выравнивание срока докупки) и кнопкой «Запросить расчёт на остаток срока».
  source: neon
- id: license_upgrade_and_crossgrade
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Апгрейд редакции и конкурентный переход (миграция со скидкой)
  user_goal: Перейти на старшую редакцию или мигрировать с конкурирующего продукта со скидкой (crossgrade).
  intent: product
  surface: search
  examples:
  - апгрейд касперский стандартный на расширенный
  - миграция с dr web на kes со скидкой
  demo:
    q: апгрейд касперский стандартный на расширенный
    profile: guest
  detection: Слова «апгрейд», «upgrade», «переход с … на …», «миграция с», «crossgrade», «конкурентный переход», «трейд-ин».
  behaviour: Если «с редакции А на Б одного вендора» → license_action=upgrade. Если «с вендора Х на вендора Y» → license_action=crossgrade, показать спецпозиции миграции и пояснить, какие документы нужны (действующая лицензия конкурента).
  data_needed:
  - sku.license_action
  - analogs
  - faq.crossgrade
  priority: P1
  wow: Автоматическое определение, что переход с ESET на Kaspersky даёт скидку по программе миграции (Crossgrade).
  source: neon
- id: server_and_infrastructure_metrics
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Лицензирование по инфраструктурным метрикам (ядра, CPU, сокеты, ВМ, серверы, ТБ)
  user_goal: Купить серверное ПО, СУБД, виртуализацию или бэкап с правильной единицей лицензирования.
  intent: product
  surface: search
  examples:
  - windows server 16 ядер
  - sql server на 4 ядра
  - виртуализация на 2 сокета
  demo:
    q: windows server 16 ядер
    profile: guest
  detection: 'Упоминание серверных/инфраструктурных метрик: «ядра», «core», «cpu», «сокет», «процессор», «вм», «виртуальных машин», «хост», «сервер», «тб», «терабайт».'
  behaviour: Фильтровать по license.metrics (core/cpu/vm/server/storage); для Windows Server / SQL Server автоматически напомнить про минимальный порог лицензирования (например, кратность пакетам ядер).
  data_needed:
  - sku.metric
  - families.license.metrics
  - faq.core_licensing
  priority: P1
  wow: Подсказка «SQL Server лицензируется пакетами по 2 ядра (минимум 4 ядра на сервер) — подобрано 2 пакета».
  source: neon
- id: cal_and_rds_client_access
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Клиентские лицензии доступа (CAL, RDS CAL, терминальные лицензии)
  user_goal: Легализовать подключение пользователей или устройств к Windows Server, SQL Server, Exchange или терминальному серверу.
  intent: product
  surface: search
  examples:
  - windows server cal user 25
  demo:
    q: windows server cal user 25
    profile: guest
  detection: Токены «cal», «rds», «кал», «терминальные лицензии», «клиентские лицензии доступа», «user cal», «device cal».
  behaviour: Вывести именно клиентские лицензии доступа, а не сами серверные ОС; разделить варианты «на пользователя» (User CAL) и «на устройство» (Device CAL) с краткой подсказкой выбора.
  data_needed:
  - categories:server_os
  - families.editions
  - slang.cal
  - faq.what_is_cal
  priority: P0
  wow: 'Карточка-подсказка: «User CAL выгоднее при нескольких гаджетах у сотрудника, Device CAL — при посменной работе за одним ПК».'
  source: neon
- id: explicit_analog_query
  group: import_substitution
  group_title: Импортозамещение и аналоги
  title: Явный запрос российского аналога зарубежного ПО
  user_goal: Найти отечественную замену конкретному привычному зарубежному продукту.
  intent: category
  surface: search
  examples:
  - российский аналог microsoft office
  - замена autocad из реестра
  - аналог vmware vsphere российский
  - аналог винды
  - аналог teamviewer
  - замена zoom
  demo:
    q: российский аналог microsoft office
    profile: guest
  detection: Слова «аналог», «замена», «чем заменить», «вместо», «импортозамещение» + название зарубежного продукта/вендора.
  behaviour: 'Обратиться к kb/analogs.yaml: показать структурированный блок «Российские аналоги для X» с кратким пояснением по совместимости (форматы, протоколы, миграция) для каждого аналога, фильтр registry=yes по умолчанию.'
  data_needed:
  - analogs
  - families.replaces
  - families.registry
  - families.formats
  priority: P0
  wow: Карточка сравнения «Что замещаем → Чем замещаем → Что сохранится при миграции (например, макросы VBA, формат DWG, протокол MAPI)».
  source: neon
- id: restricted_vendor_query
  group: import_substitution
  group_title: Импортозамещение и аналоги
  title: Поиск ПО с ограниченными поставками (параллельный импорт / остатки / спецзаказ)
  user_goal: Понять, можно ли ещё легально купить Microsoft/JetBrains/Corel или лучше сразу смотреть альтернативу.
  intent: product
  surface: search
  examples:
  - microsoft windows 11 pro
  - microsoft office 2021 для юрлиц
  - ms project купить
  demo:
    q: microsoft windows 11 pro
    profile: guest
  detection: Вендор/продукт со статусом market_status=restricted, часть SKU есть в каталоге.
  behaviour: Показать доступные в каталоге позиции (например, ESD-ключи Windows 11 Pro), а рядом аккуратный блок «Отечественные альтернативы из реестра» для сравнения цены и рисков.
  data_needed:
  - vendors.market_status
  - families.catalog
  - analogs
  priority: P0
  wow: 'Сбалансированная выдача: если товар есть в каталоге — даём купить, и тут же показываем безрисковую замену из ЕРРП.'
  source: neon
- id: stack_migration_complex
  group: import_substitution
  group_title: Импортозамещение и аналоги
  title: Комплексное импортозамещение целого стека инфраструктуры
