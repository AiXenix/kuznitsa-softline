    - астра линукс 50 шт
    - офис к ней
    profile: guest
  detection: Второй запрос в сессии ссылается местоимением («к ней», «к нему», «для неё», «совместимый») или ищет смежную категорию сразу после
    добавления/просмотра якорного продукта.
  behaviour: Извлечь якорный продукт из сессии/корзины, автоматически отфильтровать вторую выдачу по совместимости с якорным продуктом (ОС, БД,
    интеграция) и подсветить «Совместимо с выбранным ранее <Продукт>».
