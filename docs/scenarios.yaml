  - криптопро -> токен к нему
  - windows server 2022 -> клиентские лицензии
  - 1с бухгалтерия -> сдача отчетности
  - нанокад -> модуль спдс
  - ред ос -> антивирус совместимый
  - postgres pro -> бэкап для нее
  - битрикс24 -> телефония
  demo:
