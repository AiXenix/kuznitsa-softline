# Сводная карта сценариев поиска. Файл собран design/tools/merge_scenarios.py — руками не править.
- id: exact_product_family
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Прямой поиск по названию семейства ПО
  user_goal: Найти конкретный известный продукт и перейти к выбору нужной лицензии.
  intent: product
  surface: search
  examples:
  - kaspersky endpoint security
  - р7 офис
  - мойофис стандартный
  - astra linux special edition
  - криптопро csp
  - 1с бухгалтерия
  - nanocad
  - dr web enterprise
  - контур диадок
  - кибер бэкап
  demo:
    q: kaspersky endpoint security
    profile: guest
  detection: Точное или нечёткое совпадение с каноническим названием или алиасом семейства ПО без сложных дополнительных ограничений.
  behaviour: Показать карточку семейства на первом месте с предвыбранным популярным B2B-вариантом, сгруппировать SKU внутри карточки, вывести
    быстрые переключатели срока/редакции/типа лицензии.
  data_needed:
  - families.name
  - families.aliases
  - sku_grouping
  - popularity
  priority: P0
  wow: Мгновенная склейка 40+ прайсовых SKU в одну чистую карточку с интерактивным конфигуратором прямо в выдаче.
  source: neon
- id: vendor_catalog_browse
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск по имени вендора (бренду)
  user_goal: Посмотреть всю линейку доступных продуктов конкретного производителя.
  intent: vendor
  surface: search
  examples:
  - лаборатория касперского
  - базальт спо
  - positive technologies
  - аскон
  - ред софт
  - usergate
  - киберпротект
  - код безопасности
  - инфотекс
  - мойофис
  demo:
    q: лаборатория касперского
    profile: guest
  detection: Запрос целиком состоит из названия или алиаса вендора (возможно со словами «продукты», «линейка», «по», «лицензии»).
  behaviour: 'Показать витрину вендора: краткую справку (страна, статус в РФ, наличие в реестре), фасет по категориям вендора и топ-продукты,
    отсортированные по популярности и маржинальности.'
  data_needed:
  - vendors.name
  - vendors.aliases
  - vendors.market_status
  - vendors.categories
  - margin
  - popularity
  priority: P0
  wow: Для активного вендора — карточка экосистемы; для ушедшего — автоматический баннер с российскими аналогами.
  source: neon
- id: product_with_edition
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск продукта с конкретной редакцией или комплектацией
  user_goal: Найти именно нужную редакцию (Standard/Advanced/Enterprise/ПРОФ/КОРП/Смоленск/Воронеж), не тратя время на остальные.
  intent: product
  surface: search
  examples:
  - kes расширенный
  - astra linux смоленск
  - ред ос сервер
  - 1с зуп корп
  - мойофис профессиональный 2
  - windows 11 pro
  - sql server enterprise
  - nanocad spds
  - alt workstation k
  - secret net studio c
  demo:
    q: kes расширенный
    profile: guest
  detection: 'Обнаружены сущность семейства и токен редакции из families.editions (или кросс-вендорные слова: стандарт, проф, корп, сервер, базовый,
    расширенный).'
  behaviour: Отфильтровать или жёстко поднять SKU нужной редакции; в карточке предвыбрать эту редакцию; показать бейдж отличия от соседней редакции.
  data_needed:
  - families.editions
  - sku.edition
  - edition_comparison_notes
  priority: P0
  wow: Показ короткой подсказки «Чем Расширенный отличается от Стандартного» прямо под заголовком.
  source: neon
- id: product_with_version
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск конкретной версии или ветки продукта
  user_goal: Купить совместимую с текущей инфраструктурой версию ПО (например, 1С 8.3, КриптоПро 5.0, Astra 1.7/1.8, LTSC).
  intent: product
  surface: search
  examples:
  - криптопро csp 5.0
  - астра линукс 1.8
  - астра 1.7 воронеж
  - ред ос 8
  - windows server 2022
  - office 2021 ltsc
  - 1с предприятие 8.3
  - компас 3d v23
  - postgres pro 16
  - vmware vsphere 8
  demo:
    q: криптопро csp 5.0
    profile: guest
  detection: Семейство + числовой/буквенно-числовой маркер версии (1.7, 1.8, 5.0, 8.3, 2021, 2022, v23, ltsc).
  behaviour: Предпочесть SKU с точным совпадением версии; если запрошена устаревшая версия (например, КриптоПро 4.0 или Astra 1.6), показать актуальную
    с примечанием о праве даунгрейда или окончании поддержки.
  data_needed:
  - families.versions
  - sku.version
  - downgrade_rights_notes
  priority: P1
  wow: Предупреждение при поиске снятой с продаж версии и автоматический показ актуальной версии с правом downgrade.
  source: neon
- id: direct_category_search
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск по названию класса ПО (категории)
  user_goal: Увидеть все подходящие решения определённого класса для сравнения и выбора.
  intent: category
  surface: search
  examples:
  - антивирус для организации
  - межсетевой экран ngfw
  - система резервного копирования
  - корпоративный мессенджер
  - российские ос
  - системы виртуализации
  - dlp система
  - siem решения
  - почтовый сервер
  - вкс для офиса
  demo:
    q: антивирус для организации
    profile: guest
  detection: Запрос соответствует канонической категории, её синонимам или сленгу без указания конкретного вендора.
  behaviour: Открыть выдачу по целевой листовой категории, включить релевантные фасеты (реестр, ФСТЭК, платформа, модель лицензирования), ранжировать
    с учётом сегмента клиента, популярности и маржи.
  data_needed:
  - categories.synonyms
  - categories.slang
  - categories.parent
  - client_segment
  - popularity
  - margin
  priority: P0
  wow: Разный порядок выдачи для малого бизнеса и госзаказчика на один и тот же запрос «почтовый сервер».
  source: neon
- id: module_or_plugin_search
  group: direct_product
  group_title: 'Прямой поиск: продукт, вендор, категория'
  title: Поиск отдельного модуля, плагина или дополнения к базовой платформе
  user_goal: Докупить конкретный модуль к уже установленной системе (например, модуль САПР, агент бэкапа, коннектор 1С).
  intent: product
  surface: search
  examples:
  - nanocad модуль спдс
  - кибер бэкап агент для 1с
  - dr web агент для почтовых серверов
  - kaspersky security for mail server
  - ассистент модуль серверный
  - битрикс24 маркет плюс
  - 1с отчетность
  - контур экстерн модуль мчд
  - usergate log analyzer
  - компас оборудование трубопроводы
  demo:
    q: nanocad модуль спдс
    profile: guest
  detection: Упомянут базовый продукт/вендор + слова «модуль», «агент», «плагин», «коннектор», «расширение», «подсистема» или специфическое имя
    аддона.
  behaviour: Показать именно модули/аддоны с явным указанием, какая базовая лицензия требуется для их работы.
  data_needed:
  - families.editions
  - license.actions:addon
  - parent_product_dependency
  priority: P1
  wow: Бейдж «Требует базовую платформу X» + кнопка «Добавить вместе с базой».
  source: neon
- id: exact_vendor_sku
  group: sku_codes
  group_title: Артикулы и коды
  title: Поиск по точному артикулу (партномеру) вендора
  user_goal: Моментально найти позицию из счёта, КП или прошлогодней спецификации.
  intent: sku
  surface: search
  examples:
  - KL4867RAQFR
  - FQC-10572
  - KL4863RAKFR
  - '4601546148735'
  - AL-17-SE-VRN
  - R7-PRO-DESK-1Y
  - CP-CSP-50-PRO
  - UG-N100-LIC-1Y
  - DW-ESS-50-1Y
  - FQC10572
  demo:
    q: KL4867RAQFR
    profile: guest
  detection: Буквенно-цифровой код с характерным паттерном партномера (дефисы, префиксы вендоров KL/FQC/P73/R7/4601546..., отсутствие обычных
    слов).
  behaviour: Прямой приоритетный поиск по sku/mpn (с нормализацией дефисов, пробелов и регистра). При точном совпадении — вывести карточку SKU
    крупно первым блоком с ценой и кнопкой в корзину.
  data_needed:
  - sku.vendor_code
  - sku.softline_id
  - sku.ean_barcode
  priority: P0
  wow: Мгновенное распознавание артикула даже с пропущенным дефисом или кириллической буквой «С/А/К» вместо латиницы.
  source: neon
- id: partial_or_obsolete_sku
  group: sku_codes
  group_title: Артикулы и коды
  title: Поиск по неполному, устаревшему или заменённому артикулу
  user_goal: Найти замену старому партномеру из прошлогодней закупки, если вендор сменил прайс-лист.
  intent: sku
  surface: search
  examples:
  - KL4867
  - FQC-08909
  - старый артикул kesb
  - KL4863RAQFR
  - замена артикула 4601546092618
  - артикул касперский 4867
  - партномер виндовс 10 про
  - KL4867R
  demo:
    q: KL4867
    profile: guest
  detection: Префикс/подстрока артикула или артикул из таблицы замен/архивных SKU.
  behaviour: 'Показать все SKU с совпадающим префиксом; если артикул архивный — прямо сообщить «Артикул снят с продаж, актуальная замена: …» и
    вывести заменяющий SKU.'
  data_needed:
  - sku.vendor_code
  - sku.replaced_by
  - sku.prefix_index
  priority: P1
  wow: 'Показ цепочки замены: старый артикул Windows 10 Pro → актуальный FQC-10572 (Windows 11 Pro).'
  source: neon
- id: registry_number_lookup
  group: sku_codes
  group_title: Артикулы и коды
  title: Поиск по номеру записи в Едином реестре российского ПО
  user_goal: Проверить и купить ровно тот продукт, который указан в тендерной документации или приказе Минцифры.
  intent: sku
  surface: search
  examples:
  - реестр по № 369
  - запись в реестре 1234
  - номер реестра минцифры 4481
  - реестровый номер 637
  - по из реестра номер 10542
  - реестр 369 астра
  - № 5617 реестр по
  - еррп 211
  demo:
    q: реестр по № 369
    profile: guest
  detection: Упоминание «реестр», «еррп», «номер записи», «№» рядом с 2–5-значным числом.
  behaviour: Искать по полю реестрового номера (если заполнено в каталоге); если точного номера нет в данных — честно предупредить и предложить
    проверить актуальный номер на reestr.digital.gov.ru, показав совпадающее ПО из реестра.
  data_needed:
  - sku.registry_id
  - families.registry
  priority: P1
  wow: Для госзаказчика мгновенная сверка «номер реестра → точное семейство → готовые к закупке SKU без НДС».
  source: neon
- id: okpd2_ktru_code_search
  group: sku_codes
  group_title: Артикулы и коды
  title: Поиск по коду ОКПД2 или КТРУ из закупочной документации
  user_goal: Подобрать ПО, проходящее под конкретный код ОКПД2/КТРУ в плане-графике 44-ФЗ.
  intent: sku
  surface: search
  examples:
  - окпд2 58.29.11
  - окпд 58.29.29
  - 58.29.32.000
  - ктру 58.29.11.000-00000001
  - окпд2 офисное по
  - код окпд антивирус
  - 58.29.21
  - окпд2 58.29.12 операционные системы
  demo:
    q: окпд2 58.29.11
    profile: guest
  detection: Паттерн ОКПД2 (58.29.xx, 62.01.xx, 63.11.xx) или ключевые слова «окпд», «окпд2», «ктру».
  behaviour: Сопоставить код ОКПД2/КТРУ с классом ПО (категорией каталога), применить фильтр реестра Минцифры (по умолчанию для госзакупок) и
    вывести подходящие продукты.
  data_needed:
  - compliance.okpd2_map
  - categories.id
  - families.registry
  priority: P1
  wow: По вводу «58.29.11» поиск понимает «системное ПО / ОС» и сразу предлагает российские ОС из реестра.
  source: neon
- id: mixed_cyrillic_latin_sku
  group: sku_codes
  group_title: Артикулы и коды
  title: Артикул со смешанной кириллицей и латиницей (скопирован из PDF/Word)
  user_goal: Найти товар по коду, скопированному из кривого КП, где визуально похожие буквы (А, В, Е, К, М, Н, О, Р, С, Т, Х) набраны кириллицей.
  intent: sku
  surface: search
  examples:
  - КL4867RАQFR
  - FQС-10572
  - Р7-ОFFIСЕ
  - КL4867RАКFR
  - СSР-50
  - АL-17-SЕ
  - МS-ОFFIСЕ
  - КL4867
  demo:
    q: КL4867RАQFR
    profile: guest
  detection: Токен похож на артикул и содержит смесь латинских и кириллических гомоглифов.
  behaviour: Нормализовать гомоглифы в латиницу (А→A, С→C, К→K, О→O, Р→P, Т→T, Х→X, Е→E, Н→H, М→M, В→B), выполнить точный поиск по SKU и показать
    уведомление об исправлении.
  data_needed:
  - normalizer.homoglyphs
  - sku.vendor_code
  priority: P0
  wow: 'Демонстрация реальной боли закупщиков: копипаста артикула из PDF-счёта с русскими буквами находится без осечки.'
  source: neon
- id: renewal_by_quantity
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Продление лицензии на N устройств/пользователей
  user_goal: Быстро найти позицию именно продления (а не новой покупки) в нужном ценовом диапазоне узлов (tier/band).
  intent: renewal
  surface: search
  examples:
  - каспер продление на 30 компов
  - kes renewal 50
  - продлёнка др веб 100 пк
  - продлить р7 офис на 25 пользователей
  - продление лицензии мой офис 40 мест
  - пролонгация кибер бэкап 5 серверов
  - usergate продление подписки 1 год
  - kaspersky renew 15-19
  - продлить 1с итс проф на год
  - контур экстерн продление
  demo:
    q: каспер продление на 30 компов
    profile: guest
  detection: Наличие маркера действия renewal («продление», «продлёнка», «продлить», «пролонгация», «renewal», «renew») + число + единица метрики
    («компов», «пк», «узлов», «мест», «юзеров», «серверов»).
  behaviour: 'Отфильтровать SKU по license_action=renewal, подобрать правильный ценовой диапазон (band: для 30 → 25-49), показать цену за 1 узел
    и расчётную сумму за N узлов (30 × цена).'
  data_needed:
  - sku.license_action
  - sku.min_qty
  - sku.max_qty
  - sku.metric
  - slang.licensing
  priority: P0
  wow: 'Калькулятор прямо в карточке выдачи: «Подобран диапазон 25–49 узлов: 2 857 ₽ × 30 ПК = 85 710 ₽ (без НДС)».'
  source: neon
- id: new_license_by_quantity_and_term
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: Покупка новой лицензии с указанием количества и срока
  user_goal: Подобрать базовую (новую) лицензию на конкретное число рабочих мест и срок (1, 2, 3 года или бессрочно).
  intent: product
  surface: search
  examples:
  - антивирус на 100 компьютеров на 2 года
  - р7 офис 50 лицензий на год
  - астра линукс 200 рабочих мест
  - доктор веб на 15 пк новая лицензия 3 года
  - мойофис стандартный 30 мест бессрочно
  - контур толк на 10 организаторов год
  - ассистент удаленный доступ 10 подключений
  - криптопро 5 на 5 рабочих мест бессрочная
  - windows 11 pro 10 шт
  - нанокад 3 рабочих места годовая
  demo:
    q: антивирус на 100 компьютеров на 2 года
    profile: guest
  detection: Продукт/категория + количество (N) + срок (1/2/3 года, 12/24/36 мес, бессрочно) + опционально маркер new («новая», «базовая», «первичная»).
  behaviour: Выбрать license_action=new, срок и ценовой band под N; посчитать итоговую сумму и подсказать экономию при выборе 2–3 лет (если есть
    SKU).
  data_needed:
  - sku.license_action
  - sku.term_months
  - sku.model
  - sku.min_qty
  - sku.max_qty
  priority: P0
  wow: Подсказка «На 2 года дешевле на 18% в пересчёте на год» прямо в карточке.
  source: neon
- id: perpetual_vs_subscription
  group: licensing
  group_title: 'Лицензии: количество, срок, тип'
  title: 'Выбор модели лицензирования: бессрочная или подписка'
  user_goal: Купить именно бессрочную (постоянную, неисключительную без срока) лицензию или наоборот годовую подписку под OPEX.
  intent: license_ops
  surface: search
  examples:
  - бессрочная лицензия офиса
  - офис без подписки купить навсегда
  - р7 офис бессрочный
  - криптопро годовая лицензия
  - нанокад постоянная лицензия
  - компас бессрочная
  - подписка на антивирус помесячно
  - perpetual license sql server
  - бессрочная ос астра
  - купить 1с навсегда не облако
  demo:
    q: бессрочная лицензия офиса
    profile: guest
  detection: 'Маркеры модели: «бессрочная», «постоянная», «навсегда», «без подписки», «perpetual» vs «подписка», «годовая», «помесячно», «subscription»,
    «аренда».'
  behaviour: Жёстко фильтровать по license.model (perpetual / subscription). Если продукт продаётся только по подписке (например, антивирус),
    честно объяснить это и не выдавать пустую страницу.
  data_needed:
  - sku.license_model
  - families.license.models
  priority: P0
