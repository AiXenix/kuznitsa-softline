<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кузница · Поиск программного обеспечения</title><link rel="stylesheet" href="/web/css/store.css"></head>
<body><header><a class="brand" href="/"><b aria-hidden="true">К</b> Кузница</a><span>AiXenix</span></header>
<main><section class="intro"><h1>Поиск программного<br>обеспечения</h1><div id="stats"></div></section>
<form id="search"><div class="bar"><span aria-hidden="true">⌕</span><input id="query" aria-label="Поисковый запрос" autocomplete="off" placeholder="Название программы, задача или артикул" required maxlength="1500"><button>Найти</button><div id="suggestions" hidden></div></div>
<div class="settings"><label>Профиль клиента<select id="profile"></select></label><label>Категория<select id="category"><option value="">Все категории</option></select></label><label>Режим<select id="mode"><option value="fast">Быстрый</option><option value="smart">Умный</option></select></label></div></form><div id="profileInfo"></div>
<div class="workspace"><section id="results" aria-live="polite"></section><aside><h2>Как работал поиск</h2><div id="trace">Шаги появятся после поиска.</div></aside></div></main>
<footer>Демонстрационный проект AiXenix для хакатона. Не является сайтом Softline. Каталог, цены, клиенты и журналы — вымышленные (mock).</footer><script src="/web/js/store.js" defer></script></body></html>
