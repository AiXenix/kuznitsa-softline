  behaviour: "Развести ВКС/вебинары (Контур.Толк, МТС Линк, TrueConf, IVA MCU), удалённый доступ (Ассистент, RuDesktop, RMS), VPN и IP-телефонию; учесть числа (например, 100 участников)."
  data_needed: ["use_cases", "categories", "families.use_cases"]
  priority: P0
  wow: "На «видеосовещания на 100 человек» поиск подбирает тарифы ВКС именно от 100 участников."

