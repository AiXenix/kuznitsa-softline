- id: registry_mincifry_filter
  group: compliance_regulatory
  title: "Обязательное наличие в Едином реестре российского ПО"
  user_goal: "Подобрать софт, который гарантированно пройдёт проверку по ПП №1236, 44-ФЗ/223-ФЗ и директивам Минцифры."
  examples:
    - "антивирус из реестра минцифры"
    - "офисный пакет реестр российского по"
    - "субд из реестра по"
    - "вкс в реестре отечественного по"
    - "удаленный доступ из реестра"
    - "erp реестр минцифры"
    - "сапр еррп"
    - "бэкап включенный в реестр"
  detection: "Упоминание «реестр», «реестр минцифры», «реестр российского по», «реестр отечественного по», «еррп», «пп 1236»."
  behaviour: "Жёстко фильтровать по registry=yes (или partial с явной пометкой, какие именно редакции в реестре); показать бейдж «В реестре Минцифры»."
  data_needed: ["compliance.registry_ru", "families.registry"]
  priority: P0
  wow: "Прозрачный чип фильтра «Реестр Минцифры: да» и предупреждение, если у семейства в реестре только часть редакций."

- id: fstec_certified_search
  group: compliance_regulatory
  title: "Поиск ПО с сертификатом ФСТЭК России (и уровнем доверия)"
  user_goal: "Купить сертифицированное средство защиты информации (СЗИ) или ОС для ГИС, ИСПДн, КИИ или гостайны."
  examples:
    - "астра линукс с сертификатом фстэк"
    - "антивирус сертифицированный фстэк"
    - "межсетевой экран фстэк 4 класс"
