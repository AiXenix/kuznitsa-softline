  wow: "Точное разделение «черчение зданий» (BIM/AEC: Renga, nanoCAD BIM) и «3D детали машин» (MCAD: КОМПАС-3D, T-FLEX CAD)."

# ============================================================================
# 8. ROLES_BUNDLES — Роли, профессии, рабочие места, отрасли, списки из заявки
# ============================================================================

- id: role_workplace_bundle
  group: roles_bundles
  title: "Комплект ПО для роли или рабочего места «под ключ»"
  user_goal: "Быстро собрать стандартный набор лицензий для нового сотрудника конкретной профессии."
  examples:
    - "комплект по для бухгалтера"
    - "рабочее место офисного сотрудника под ключ"
    - "что нужно из софта для конструктора"
    - "набор программ для сисадмина"
    - "по для нового менеджера по продажам"
    - "рабочее место дизайнера"
    - "комплект для юриста"
    - "софт для hr специалиста"
    - "арм врача"
    - "рабочее место госслужащего из реестра"
  detection: "Упоминание роли/профессии (бухгалтер, конструктор, сисадмин, дизайнер, юрист, HR, менеджер, врач, разработчик, офисный сотрудник) + опционально «комплект», «набор», «рабочее место», «под ключ», «арм»."
  behaviour: "Отобразить структурированный комплект по слотам из kb/roles.yaml (обязательные и опциональные слоты: ОС + Офис + Антивирус + профильное ПО), с суммарной стоимостью и кнопкой «Добавить комплект в корзину»."
  data_needed: ["roles", "families", "categories"]
  priority: P0
  wow: "Эффектный режим «Конструктор АРМ»: по запросу «рабочее место бухгалтера из реестра» собирается готовый пакет (Astra Linux + Р7-Офис + Kaspersky + 1С:Бухгалтерия + КриптоПро) с заменой любой позиции в 1 клик."

- id: office_size_starter_pack
  group: roles_bundles
  title: "Оснащение офиса или новой компании на N человек"
  user_goal: "Директор или ИТ-менеджер открывает офис/филиал на 10–50 человек и хочет базовый лицензионный пакет."
  examples:
    - "базовый набор по для офиса на 20 человек"
    - "софт для открытия нового филиала 15 пк"
    - "что купить для старта компании 10 сотрудников"
    - "комплект лицензий для малого офиса"
    - "полный набор по на 50 рабочих мест"
    - "импортозамещение офиса на 30 человек"
    - "минимальный набор по для юрлица"
    - "пакет программ для нового офиса"
  detection: "Слова «для офиса», «для филиала», «для компании», «открытие», «на N человек/сотрудников» в сочетании с «набор», «комплект», «пакет», «что купить»."
  behaviour: "Собрать универсальный офисный пакет (ОС + Офис + Антивирус + Почта/ВКС + 1С) с автоматическим подбором ценового диапазона под указанное количество N и расчётом общего бюджета."
  data_needed: ["roles.office_worker", "sku.bands", "bundles"]
  priority: P1
  wow: "Мгновенная смета офиса на 20 человек с разбивкой по категориям и итоговой суммой."

- id: industry_solution_bundle
  group: roles_bundles
  title: "Отраслевая подборка ПО (строительство, производство, медицина, ритейл, банки, образование)"
  user_goal: "Посмотреть типовой стек ПО для своей отрасли с учётом отраслевых стандартов и регуляторики."
  examples:
    - "по для строительной компании"
    - "софт для медицинской клиники"
    - "программы для производственного предприятия"
    - "по для розничного магазина и склада"
    - "софт для школы и колледжа"
    - "по для банка и финансовой организации"
    - "решения для логистической компании"
    - "софт для проектного института"
    - "по для агропромышленного комплекса"
    - "решения для нефтегазовой отрасли"
  detection: "Упоминание отрасли из kb/industries.yaml без указания конкретного продукта."
  behaviour: "Показать отраслевую карту слотов (профильное ПО + учёт + ИБ/регуляторика, например 152-ФЗ для клиник, BIM+сметы для стройки, КИИ+АСУ ТП для промышленности)."
  data_needed: ["industries", "compliance", "families"]
  priority: P1
  wow: "Для «медицинской клиники» поиск автоматически учитывает 152-ФЗ (СЗИ ФСТЭК) + МИС/учёт + ЭЦП."

- id: multi_item_spec_paste
  group: roles_bundles
  title: "Многопозиционный запрос — вставка списка ПО из заявки, письма или тендера"
  user_goal: "Закупщик копирует сразу 3–10 строк из письма сисадмина или Excel-заявки в строку поиска, чтобы не искать по одному."
  examples:
    - "астра линукс 20 шт, р7 офис 20 шт, касперский 20 узлов"
    - "1. криптопро 5.0 - 5 шт; 2. рутокен эцп - 5 шт; 3. контур диадок"
    - "нужно продлить каспер на 50 пк и докупить 1с бухгалтерию"
    - "windows 11 pro 10 шт + офис 10 шт + антивирус 10 пк"
    - "ред ос 30 мест, мой офис 30, ассистент 5 подключений"
    - "nanocad 3 шт, компас 3d 2 шт, кибер бэкап 1 сервер"
    - "kesb 40 renewal; r7 office 40 new; astra 40"
    - "куплю антивирус и почтовый сервер на 100 пользователей"
  detection: "Разделители (запятые, точки с запятой, переносы строк, нумерация «1. … 2. …», «+», «и») между 2+ независимыми продуктами/категориями."
  behaviour: "Разбить запрос на отдельные позиции (парсер спецификации), найти лучший SKU и цену для каждой строки с учётом её количества, показать сводную таблицу-смету с общим итогом и кнопкой «Всё в корзину / Скачать КП»."
  data_needed: ["query_splitter", "sku_matcher", "bundle_calculator"]
  priority: P0
  wow: "Главный B2B вау-эффект для жюри: закупщик вставляет сырую заявку из 4 позиций — за секунду получает разобранную смету с подобранными диапазонами и итогом."

- id: accessory_and_token_bundle
  group: roles_bundles
  title: "Поиск смежного оборудования и комплектов (USB-токены, смарт-карты, ЭЦП)"
  user_goal: "Купить вместе с КриптоПро или СЗИ сертифицированный ключевой носитель (Рутокен, JaCarta, ESMART)."
  examples:
    - "рутокен эцп 3.0"
    - "jacarta 2 гост"
    - "usb токен для эцп"
    - "криптопро с рутокеном комплект"
    - "смарт карта для двухфакторной аутентификации"
    - "ключевой носитель фстэк фсб"
    - "токен для егаис"
    - "рутокен лайт 10 штук"
  detection: "Упоминание токенов, смарт-карт, ключевых носителей (Рутокен, JaCarta, ESMART, Алмаз, ключ ЭЦП)."
  behaviour: "Показать категорию ключевых носителей (tokens_pki) и предложить в связке СКЗИ (КриптоПро CSP / ViPNet CSP) и средства 2FA."
  data_needed: ["categories:tokens_pki", "families", "cross_sell_rules"]
  priority: P1
  wow: "При поиске КриптоПро — аккуратный кросс-селл «Нужен сертифицированный носитель? Рутокен ЭЦП 3.0»."

- id: training_and_support_services
  group: roles_bundles
  title: "Техподдержка вендора, внедрение, миграция и обучение сотрудников"
  user_goal: "Купить пакет расширенной техподдержки, ИТС, консалтинг по миграции на Linux или курсы для админов."
  examples:
    - "техподдержка астра линукс премиум"
    - "1с итс проф на 12 месяцев"
    - "курсы администрирования ред ос"
    - "обучение пользователей р7 офис"
    - "услуги миграции с windows на linux"
    - "расширенная поддержка касперский msa"
    - "подписка на обновления нанокад"
    - "обучение по информационной безопасности для сотрудников"
  detection: "Слова «техподдержка», «поддержка», «итс», «сопровождение», «обучение», «курсы», «внедрение», «миграция услуга», «консалтинг»."
  behaviour: "Направить в категории tech_support / training_courses / security_awareness (Kaspersky ASAP и др.), а при привязке к продукту — показать именно сервисные SKU этого вендора."
  data_needed: ["categories:tech_support", "categories:training", "sku.license_action:support"]
  priority: P1
  wow: "Различение «обучение сотрудников кибергигиене» (Security Awareness платформа) и «курсы для ИТ-специалистов»."

# ============================================================================
# 9. COMMERCIAL_FILTERS — Цена, бюджет, доставка, срочность, маржа, исключения
# ============================================================================

- id: price_budget_filter
  group: commercial_filters
  title: "Поиск с ограничением по цене или бюджету («до N руб», «дешевый», «недорогой»)"
  user_goal: "Уложиться в выделенный бюджет закупки или найти наиболее экономичный вариант в классе."
  examples:
    - "антивирус до 1500 рублей за пк"
    - "недорогой российский офис"
    - "дешевая сэд для малого бизнеса"
    - "сапр до 50000 рублей"
    - "вкс бюджетный вариант"
    - "офисный пакет от 3000 до 8000"
    - "самый дешевый антивирус для юрлиц"
    - "бэкап до 30 тыс руб"
  detection: "Числовые ценовые ограничения («до X», «от X до Y», «меньше X», «в пределах X») или качественные маркеры («дешевый», «недорогой», «бюджетный», «эконом»)."
  behaviour: "Применить фильтр цены (учитывая цену за 1 единицу или итоговую при указанном количестве N); при качественном маркере — сортировать по цене вверх внутри релевантной полосы, не теряя релевантность."
  data_needed: ["sku.price", "sku.price_on_request", "price_parser"]
  priority: P0
  wow: "Умное понимание масштаба: «антивирус до 1500» — за 1 ПК, а «антивирус на 50 пк до 100 тысяч» — за весь заказ (≤ 2000 ₽/ПК)."

- id: delivery_format_and_urgency
  group: commercial_filters
  title: "Фильтр по способу доставки и срочности (ESD, коробка, бумажный сертификат, срочно сегодня)"
  user_goal: "Получить электронный ключ сегодня на почту либо наоборот бумажный сертификат/диск с формуляром для бухгалтерии или ФСТЭК."
  examples:
    - "windows 11 pro электронный ключ"
    - "касперский esd доставка сегодня"
    - "астра линукс коробочная версия с диском"
    - "криптопро с бумажным формуляром"
    - "офис электронная лицензия быстро"
    - "1с бухгалтерия коробка"
    - "нужен ключ сегодня срочно антивирус"
    - "лицензия на бумажном носителе с печатью"
  detection: "Токены «esd», «электронный», «электронная», «ключ на почту», «срочно», «сегодня», «мгновенно» vs «коробка», «box», «диск», «носитель», «бумажный», «формуляр», «сертификат бумажный»."
  behaviour: "Фильтровать по delivery (esd / box / paper / media); при «срочно/сегодня» поднимать позиции с минимальным delivery_days и esd."
  data_needed: ["sku.delivery", "sku.delivery_days"]
  priority: P1
  wow: "Бейдж «Электронная доставка (ESD) · 1 день» vs «Поставка с формуляром ФСТЭК»."

- id: negation_and_exclusions
  group: commercial_filters
  title: "Запросы с исключениями («без …», «не …», «кроме …»)"
  user_goal: "Отсечь нежелательного вендора, модель лицензирования, облако или лишние модули."
  examples:
    - "антивирус не касперский"
    - "офис без подписки"
    - "российская ос кроме астра линукс"
    - "вкс не облако"
    - "бэкап без агентов"
    - "мессенджер без привязки к телефону"
    - "сапр не автокад"
    - "crm не битрикс"
  detection: "Отрицательные частицы и предлоги «не», «без», «кроме», «исключая», «вместо» перед вендором, платформой, моделью или функцией."
  behaviour: "Исключить указанный вендор/семейство/атрибут из выдачи (НЕ искать по слову после «не»!) и отобразить активный чип исключения «Кроме: Kaspersky»."
  data_needed: ["negation_parser", "vendors", "families", "attributes"]
  priority: P0
  wow: "Классический тест умного поиска: обычный поиск на «антивирус не касперский» выдаёт именно Касперского, а наш честно убирает его и показывает Dr.Web, PRO32, UserGate."

- id: price_on_request_enterprise
  group: commercial_filters
  title: "Запросы на enterprise-системы с ценой по запросу (проектное лицензирование)"
  user_goal: "Оценить и запросить КП на сложную корпоративную систему (SIEM, DLP, ERP, NGFW), где нет фиксированного розничного прайса."
  examples:
    - "maxpatrol siem цена"
    - "infowatch traffic monitor стоимость"
    - "pt application firewall купить"
    - "directum rx стоимость лицензий"
    - "usergate d500 цена"
    - "сколько стоит галактика erp"
    - "kaspersky kata цена на 500 узлов"
    - "брест виртуализация прайс"
  detection: "Enterprise-семейства с price_on_request=true, часто со словами «цена», «стоимость», «прайс», «сколько стоит»."
  behaviour: "Показать карточку продукта с ориентировочной моделью лицензирования (по узлам/EPS/ядрам), статусом «Цена по запросу (проектный расчёт)» и быстрой формой запроса КП с уже подставленным количеством из запроса."
  data_needed: ["sku.price_on_request", "families.license.metrics"]
  priority: P1
  wow: "Вместо пустой цены — понятная модель тарификации («лицензируется по числу активов/EPS») и предзаполненный запрос КП."

- id: promo_and_free_trial_intent
  group: commercial_filters
  title: "Поиск акций, скидок, пилота и тестовых (триальных) лицензий"
  user_goal: "Попробовать ПО в пилоте перед закупкой или воспользоваться акцией (например, миграция со скидкой, спецпредложение)."
  examples:
    - "пилот астра линукс бесплатно"
    - "тестовая лицензия р7 офис"
    - "триал касперский для бизнеса"
    - "скидки на антивирусы для юрлиц"
    - "акции на 1с"
    - "демо версия нанокад"
    - "пробный период мойофис"
    - "спецпредложение импортозамещение"
  detection: "Токены «пилот», «тест», «тестовая», «триал», «trial», «демо», «пробный», «скидка», «акция», «спецпредложение»."
  behaviour: "Показать целевой продукт с кнопкой «Запросить пилотную лицензию (30–60 дней)» или фильтром позиций со скидкой (discount > 0)."
  data_needed: ["sku.discount", "families.pilot_available"]
  priority: P2
  wow: "В B2B пилот — главный шаг к крупной сделке: поиск переводит «триал» в заявку на пилот вместо отказа."

# ============================================================================
# 10. LANGUAGE_ERRORS — Опечатки, раскладка, транслит, сленг, омонимы
# ============================================================================

- id: keyboard_layout_error
  group: language_errors
  title: "Запрос в неверной раскладке клавиатуры (EN↔RU)"
  user_goal: "Быстро найти нужный софт, не перепечатывая запрос, набранный на английской/русской раскладке."
  examples:
    - "rfсgthcrbq"
    - "rfcgthcrbq"
    - "fynbdibhec"
    - "fcnhf kbyerc"
    - "vjq jabс"
    - "rhbgnjghj"
    - "1c ,e[ufknthbz"
    - "офис цштвщцы"
    - "дштгч"
    - "лфызкуылно"
  detection: "Низкая словарность токенов в текущей раскладке и высокое совпадение со словарём каталога/KB после перекодировки QWERTY↔ЙЦУКЕН."
  behaviour: "Автоматически перевести раскладку, выполнить поиск по исправленному запросу и показать плашку «Показаны результаты для: касперский (исправлена раскладка)»."
  data_needed: ["layout_converter", "kb_vocabulary"]
  priority: P0
  wow: "Работает даже на смешанных запросах вроде «1с ,e[ufknthbz» или «fcnhf kbyerc 50 gr»."

- id: phonetic_translit_and_mixed_script
  group: language_errors
  title: "Русский транслит латинских названий и обратный транслит"
  user_goal: "Закупщик пишет иностранные и гибридные бренды на слух кириллицей (или русские — латиницей)."
  examples:
    - "майкрософт офис"
    - "виндовс сервер"
    - "эксчейндж"
    - "вмваре всфера"
    - "постгрес про"
    - "юзергейт"
    - "позитив технолоджис"
    - "доктор веб"
    - "випнет клиент"
    - "тимвьювер"
    - "нанокад"
    - "moyofis"
    - "kiber bekup"
    - "kriptopro"
  detection: "Совпадение через aliases вендоров/семейств, словарь транслита или фонетическую нормализацию."
  behaviour: "Бесшовно сопоставить с каноническим продуктом/вендором и выдать точные результаты без лишнего шума."
  data_needed: ["vendors.aliases", "families.aliases", "slang.translit"]
  priority: P0
  wow: "Полное покрытие всех вариантов написания на слух: «вмваре / вмварь / vmware», «эксчендж / эксчейндж / exchange»."

- id: typos_and_merged_tokens
  group: language_errors
  title: "Опечатки, пропуски букв, слитное и раздельное написание"
  user_goal: "Найти товар несмотря на спешку и ошибки набора («виндоус11», «касперки», «астролинукс», «мой офис»)."
  examples:
    - "касперки ендпоинт"
    - "астролинукс"
    - "виндоус 11 про"
    - "office2021"
    - "win11pro"
    - "антивирусс на 50пк"
    - "криптапро 5"
    - "битрикс 24"
    - "р 7 офис"
    - "ред-ос"
    - "1cбухгалтерия"
    - "майкрасофт"
  detection: "Нормализация слитных чисел/букв (office2021 → office 2021, 50пк → 50 пк, 1сбухгалтерия → 1с бухгалтерия), дефисов и фаззи-поиск (RapidFuzz / n-граммы) по словарю KB и каталога."
  behaviour: "Исправить опечатку с показом плашки «Исправлено: …», сплитить склеенные токены и выполнить полноценный разбор сущностей."
  data_needed: ["normalizer.split_tokens", "typo_corrector", "kb_vocabulary"]
  priority: P0
  wow: "Запрос «1cбухгалтерия 10юзеров» раскладывается на продукт «1С:Бухгалтерия» + количество 10 пользователей."

- id: professional_it_slang_and_abbr
  group: language_errors
  title: "ИТ-сленг, жаргон сисадминов и профессиональные аббревиатуры"
  user_goal: "Сисадмин или безопасник печатает привычными короткими терминами («кес», «мэ», «скзи», «сзд», «нгфв», «винда», «терминальник», «адешка»)."
  examples:
    - "кес 50 узлов продлёнка"
    - "мэ фстэк"
    - "нгфв из реестра"
    - "адешка на линуксе"
    - "винда серверная 2022"
    - "терминальник на 30 юзеров"
    - "сзи от нсд"
    - "савз для сервера"
    - "эцпшка для буха"
    - "бэкапилка для гипервизора"
    - "почтовик на линукс"
    - "арм сзи"
  detection: "Токены из kb/slang.yaml (slang, abbr) с длиннейшим совпадением (longest match)."
  behaviour: "Расшифровать каждый термин в трассе «Понято так» (например: «адешка на линуксе» → «контроллер домена (аналог Active Directory) · Linux» → ALD Pro, РЕД АДМ, Альт Домен)."
  data_needed: ["slang", "categories.slang", "families.aliases"]
  priority: P0
  wow: "Живой перевод с админского на язык каталога прямо в строке «Понято так»: «адешка на линуксе» → ALD Pro, РЕД АДМ, Альт Домен."

- id: obsolete_and_rebranded_names
  group: language_errors
  title: "Устаревшие и переименованные названия продуктов и вендоров"
  user_goal: "Найти продукт по старому названию, которое до сих пор кочует в заявках (Акронис → Кибер Бэкап, Webinar → МТС Линк, ABBYY → Content AI, MyOffice → МойОфис, ESET → PRO32)."
  examples:
    - "акронис бэкап"
    - "acronis cyber backup"
    - "webinar ru"
    - "abbyy finereader"
    - "abbyy flexicapture"
    - "vmware vcenter"
    - "kaspersky security center"
    - "сбис экстерн"
    - "яндекс телемост бизнес"
    - "мой склад"
    - "vk workmail"
    - "r7 office"
  detection: "Словарь устаревших/переименованных названий (slang type=obsolete, families.aliases, analogs)."
  behaviour: "Найти актуального правопреемника или российский ребрендинг с пояснением «Acronis в РФ развивается как Кибер Бэкап (Киберпротект)», «Webinar.ru переименован в МТС Линк», «ABBYY FineReader в РФ → ContentReader PDF (Content AI)»."
  data_needed: ["slang.obsolete", "analogs", "families.aliases"]
  priority: P0
  wow: "На «акронис» покупатель сразу получает Кибер Бэкап с пояснением преемственности — ноль потерянных заказов!"

- id: ambiguous_homonyms_disambiguation
  group: language_errors
  title: "Двусмысленные термины и омонимы мира ПО"
  user_goal: "Понять, что именно ищет пользователь, когда слово имеет 2+ значения («ключ», «контур», «астра», «офис», «облако», «сертификат», «1с», «защита», «почта»)."
  examples:
    - "ключ"
    - "сертификат"
    - "контур"
    - "астра"
    - "облако"
    - "терминал"
    - "агент"
    - "защита"
    - "лицензия"
    - "портал"
  detection: "Короткий запрос (1 слово), совпадающий с несколькими несвязанными сущностями (например, «сертификат» → SSL-сертификат vs сертификат ФСТЭК vs сертификат ЭЦП; «ключ» → электронный ключ ESD vs USB-токен Рутокен; «контур» → СКБ Контур vs закрытый контур)."
  behaviour: "Показать топ-результаты с учётом контекста пользователя (категория/сегмент) и вывести быстрые чипы уточнения («Уточните, что вы ищете: SSL-сертификаты · Электронная подпись (ЭЦП) · ПО с сертификатом ФСТЭК»)."
  data_needed: ["ambiguity_rules", "categories", "client_context"]
  priority: P1
  wow: "Умное снятие неоднозначности без навязчивого чат-бота — 1 клик по чипу уточнения."

# ============================================================================
# 11. ADVISORY_QA — Вопросы о лицензировании, сравнение, выбор
# ============================================================================

- id: licensing_faq_question
  group: advisory_qa
  title: "Вопросы по правилам лицензирования и закупки"
  user_goal: "Быстро разобраться в сложном лицензионном термине или правиле перед оформлением счёта."
  examples:
    - "что такое cal лицензия"
    - "чем отличается oem от box и esd"
    - "нужна ли лицензия фсб чтобы купить криптопро"
    - "как лицензируется windows server по ядрам"
    - "можно ли продлить просроченную лицензию касперского"
    - "почему по из реестра без ндс"
    - "в чем разница между именной и конкурентной лицензией"
    - "как посчитать лицензии 1с для 20 человек"
    - "чем отличается астра орел воронеж смоленск"
    - "нужны ли клиентские лицензии для postgres"
  detection: "Вопросительные конструкции («что такое», «как лицензируется», «можно ли», «нужна ли», «почему», «в чем разница», «?»)."
  behaviour: "Вывести компактную карточку-ответ из kb/faq.yaml (2–4 понятных предложения без воды) + сразу ниже релевантные товары из каталога."
  data_needed: ["faq", "categories", "families"]
  priority: P0
  wow: "Поиск работает как опытный пресейл-менеджер: отвечает на вопрос про CAL или редакции Astra и тут же даёт нужные SKU."

- id: product_vs_product_comparison
  group: advisory_qa
  title: "Сравнение двух продуктов или редакций («X vs Y», «что лучше»)"
  user_goal: "Выбрать между двумя конкретными кандидатами (Р7-Офис vs МойОфис, Astra vs РЕД ОС, KES Стандартный vs Расширенный)."
  examples:
    - "р7 офис или мой офис что лучше"
    - "astra linux vs ред ос"
    - "касперский стандартный или расширенный"
    - "dr web против касперского"
    - "нанокад или компас 3d"
    - "контур толк или мтс линк"
    - "ассистент или rudesktop"
    - "битрикс24 или amocrm"
    - "postgres pro standard vs enterprise"
    - "usergate или континент"
  detection: "2 сущности (семейства или редакции) со связками «или», «vs», «против», «сравнить», «что лучше», «отличие», «разница между»."
  behaviour: "Показать компактную сравнительную таблицу по фактам из KB (реестр, ФСТЭК/ФСБ, платформы, модель лицензирования, ценовой ориентир, ключевые сценарии) и карточки обоих продуктов рядом."
  data_needed: ["families.*", "comparison_renderer"]
  priority: P0
  wow: "На «р7 офис vs мой офис» — честная таблица сравнения прямо над выдачей (без выдуманных фактов, строго по полям KB)."

- id: compatibility_check_question
  group: advisory_qa
  title: "Вопрос о совместимости двух продуктов («работает ли X на Y?»)"
  user_goal: "Убедиться перед покупкой, что программа встанет на текущую ОС или заработает в связке."
  examples:
    - "работает ли 1с на астра линукс"
    - "встанет ли криптопро на ред ос"
    - "совместим ли касперский с альт линукс"
    - "работает ли р7 офис на macos"
    - "поддерживает ли кибер бэкап postgres pro"
    - "можно ли поставить компас 3d на linux"
    - "работает ли диадок с 1с 8.3"
    - "пойдет ли нанокад на windows 11"
  detection: "Вопросительный паттерн («работает ли», «совместим ли», «встанет ли», «поддерживает ли», «пойдет ли») + продукт + платформа/ОС/другой продукт."
  behaviour: "Проверить по полям platforms и compat_ru_os в KB; дать ясный ответ (Да / С ограничениями / Требует уточнения) и вывести именно совместимый SKU."
  data_needed: ["families.platforms", "families.compat_ru_os", "families.notes"]
  priority: P1
  wow: "Экономит звонок в пресейл: сразу подтверждает совместимость и предлагает нужную сборку под Linux."

- id: legal_and_audit_readiness
  group: advisory_qa
  title: "Вопросы легализации, аудита лицензий и закрывающих документов для юрлиц"
  user_goal: "Убедиться, что покупка пройдёт проверку бухгалтерии, налоговой или аудита (УПД, договор, передача прав, ЭДО)."
  examples:
    - "купить по безналу с договором для ооо"
    - "легализация windows в офисе"
    - "какие документы при покупке электронной лицензии"
    - "отгрузка по эдо диадок сбис"
    - "лицензионный договор передача неисключительных прав"
    - "покупка софта для юрлица с актом"
    - "легализация 1с на предприятии"
    - "как подтвердить лицензионность по"
  detection: "Токены «легализация», «безнал», «упд», «договор», «закрывающие документы», «эдо», «неисключительные права», «проверка лицензий»."
  behaviour: "Показать краткий блок ответа из FAQ по B2B-документообороту (счёт, договор, УПД/акт через ЭДО Диадок/СБИС) + релевантные категории ПО (если указан продукт)."
  data_needed: ["faq", "families"]
  priority: P2
  wow: "Снимает главный страх закупщика перед онлайн-заказом на сайте («а закроется ли бухгалтерия?»)."

# ============================================================================
# 12. EDGE_CASES_OOB — Не по теме, железо, слишком общие, пиратка, пробелы каталога
# ============================================================================

- id: too_broad_generic_query
  group: edge_cases_oob
  title: "Слишком общий запрос («программа», «софт», «лицензия», «для бизнеса»)"
  user_goal: "Пользователь только начинает поиск и не сформулировал конкретную потребность."
  examples:
    - "программы для бизнеса"
    - "софт"
    - "купить лицензию"
    - "программное обеспечение"
    - "российское по"
    - "программы для компьютера"
    - "по для офиса"
    - "нужны программы"
  detection: "Запрос состоит исключительно из стоп-слов/общих терминов без категории, вендора, задачи или роли."
  behaviour: "Не валить случайный список SKU! Показать навигационную витрину топ-категорий B2B (ИБ, ОС, Офис, 1С, ВКС, Виртуализация, САПР, Бэкап) + быстрые сценарии («Импортозамещение», «Комплект на рабочее место», «Продлить лицензию»)."
  data_needed: ["categories.top_level", "popular_scenarios"]
  priority: P0
  wow: "Превращает бесполезный запрос «российское по» в структурированную навигацию по всем направлениям импортозамещения."

- id: catalog_gap_known_software
  group: edge_cases_oob
  title: "Реальное ПО, которого нет в каталоге магазина (пробел ассортимента)"
  user_goal: "Покупатель ищет существующий реальный софт (например, Figma, Notion, Miro, Linear, 1Password, ChatGPT Enterprise), которого нет в прайсе магазина."
  examples:
    - "figma для команды"
    - "miro enterprise"
    - "notion business"
    - "chatgpt для компании"
    - "cursor ide лицензия"
    - "1password teams"
    - "canva pro для юрлиц"
    - "datagrip лицензия"
    - "postman enterprise"
    - "snowflake"
  detection: "Продукт распознан в независимой базе знаний (kb/families, catalog: no), но отсутствует среди активных SKU магазина."
  behaviour: "Честно сказать «X сейчас не представлен в каталоге», предложить ближайшие аналоги из каталога (например, Miro → МТС Линк Доски / Holst; Notion → Yonote / Kaiten / Weeek; ChatGPT → GigaChat / YandexGPT API), а в аналитику контент-менеджера записать «Товар вне каталога: спрос N раз»."
  data_needed: ["families.catalog", "analogs", "analytics.catalog_gaps"]
  priority: P0
  wow: "Прямо бьёт в требование организаторов: «контент-менеджер видит, каких товаров не хватает в каталоге» — и без пустой выдачи для клиента!"

- id: hardware_vs_software_boundary
  group: edge_cases_oob
  title: "Поиск «железа» (оборудования) в магазине ПО"
  user_goal: "Пользователь ищет сервер, ноутбук, монитор или ПАК (программно-аппаратный комплекс), путая софт и оборудование."
  examples:
    - "купить ноутбук для офиса"
    - "сервер hp proliant"
    - "ip видеокамера hikvision"
    - "принтер лазерный"
    - "коммутатор cisco"
    - "монитор 27 дюймов"
    - "аппаратный межсетевой экран usergate"
    - "пак континент 4"
  detection: "Обнаружены чисто аппаратные категории (ноутбук, принтер, монитор, мышь) vs программно-аппаратные комплексы (ПАК NGFW, USB-токен)."
  behaviour: "Для ПАК и токенов (UserGate, Континент, Рутокен) — показать лицензии/ПАК из каталога ИБ. Для чистого офисного железа (принтеры, ноутбуки) — вежливо сообщить, что это магазин ПО, предложить смежное ПО (ОС, антивирус, драйверы/утилиты) и зафиксировать запрос в аналитике."
  data_needed: ["oob_hardware_lexicon", "categories:ngfw_vpn", "categories:tokens_pki"]
  priority: P1
  wow: "Точно отличает «ноутбук» (не по профилю) от «ПАК UserGate» и «Рутокен» (профильные товары ИБ)."

- id: piracy_crack_free_query
  group: edge_cases_oob
  title: "Запросы пиратского ПО, «кряков», активаторов и «бесплатных ключей»"
  user_goal: "Пользователь по привычке ищет бесплатную скачку или активатор в магазине лицензионного ПО."
  examples:
    - "скачать windows 11 бесплатно с ключом"
    - "активатор kms office"
    - "кряк для автокада"
    - "ключ касперский бесплатно на год"
    - "взломанный фотошоп"
    - "торрент 1с бухгалтерия"
    - "бесплатный ключ windows 10 pro"
    - "серийник для винрар"
  detection: "Токены «кряк», «crack», «активатор», «kms», «взломанный», «торрент», «ключ бесплатно», «серийник», «пиратка»."
  behaviour: "Вежливо пояснить, что магазин поставляет только официальные лицензии для юрлиц; предложить легальные бюджетные альтернативы, тестовые/пилотные лицензии (30 дней бесплатно) или официальные недорогие российские аналоги."
  data_needed: ["oob_piracy_lexicon", "families.pilot_available", "analogs"]
  priority: P1
  wow: "Корректная B2B-отработка: вместо странного совпадения по слову «ключ» — предложение легального пилота и доступных лицензий."

- id: completely_offtopic_or_gibberish
  group: edge_cases_oob
  title: "Запросы полностью не по теме или бессмысленный набор символов"
  user_goal: "Случайный ввод, тест поиска жюри, нецелевой бытовой запрос."
  examples:
    - "asdfghjkl"
    - "123456"
    - "купить спецодежду и каску"
    - "доставка пиццы москва"
    - "погода на завтра"
    - "привет как дела"
    - "!!!"
    - "зимняя резина r16"
  detection: "Отсутствие совпадений с любыми сущностями KB/каталога даже после ремонта раскладки и опечаток, низкий семантический скор эмбеддингов."
  behaviour: "НЕ выдумывать релевантность и не показывать случайные товары! Чётко сказать «По запросу ничего не найдено», показать популярные разделы каталога ПО и логировать в аналитику как off-topic (отдельно от реальных пробелов каталога, чтобы не засорять отчёт контент-менеджеру!)."
  data_needed: ["min_score_threshold", "analytics.zero_result_classifier"]
  priority: P0
  wow: "В аналитике чётко разделены «реальный пробел каталога (Figma, Miro)» и «мусор/не по теме (пицца, asdf)» — контент-менеджер не тонет в шуме."
