# Глобальная карта сценариев поиска для B2B-магазина программного обеспечения (РФ, 2026)
# Автор: Gemini 4 Neon (команда AiXenix)
# Группы (12): direct_product, sku_codes, licensing, import_substitution, compliance_regulatory,
#              compatibility_platform, tasks_use_cases, roles_bundles, commercial_filters,
#              language_errors, advisory_qa, edge_cases_oob

# ============================================================================
# 1. DIRECT_PRODUCT — Прямой поиск продукта, вендора, редакции и версии
# ============================================================================

- id: exact_product_family
  group: direct_product
  title: "Прямой поиск по названию семейства ПО"
  user_goal: "Найти конкретный известный продукт и перейти к выбору нужной лицензии."
  examples:
    - "kaspersky endpoint security"
    - "р7 офис"
    - "мойофис стандартный"
    - "astra linux special edition"
    - "криптопро csp"
    - "1с бухгалтерия"
    - "nanocad"
    - "dr web enterprise"
    - "контур диадок"
    - "кибер бэкап"
  detection: "Точное или нечёткое совпадение с каноническим названием или алиасом семейства ПО без сложных дополнительных ограничений."
  behaviour: "Показать карточку семейства на первом месте с предвыбранным популярным B2B-вариантом, сгруппировать SKU внутри карточки, вывести быстрые переключатели срока/редакции/типа лицензии."
  data_needed: ["families.name", "families.aliases", "sku_grouping", "popularity"]
  priority: P0
  wow: "Мгновенная склейка 40+ прайсовых SKU в одну чистую карточку с интерактивным конфигуратором прямо в выдаче."

- id: vendor_catalog_browse
  group: direct_product
  title: "Поиск по имени вендора (бренду)"
  user_goal: "Посмотреть всю линейку доступных продуктов конкретного производителя."
  examples:
    - "лаборатория касперского"
    - "базальт спо"
    - "positive technologies"
    - "аскон"
    - "ред софт"
    - "usergate"
    - "киберпротект"
    - "код безопасности"
    - "инфотекс"
    - "мойофис"
  detection: "Запрос целиком состоит из названия или алиаса вендора (возможно со словами «продукты», «линейка», «по», «лицензии»)."
  behaviour: "Показать витрину вендора: краткую справку (страна, статус в РФ, наличие в реестре), фасет по категориям вендора и топ-продукты, отсортированные по популярности и маржинальности."
  data_needed: ["vendors.name", "vendors.aliases", "vendors.market_status", "vendors.categories", "margin", "popularity"]
  priority: P0
  wow: "Для активного вендора — карточка экосистемы; для ушедшего — автоматический баннер с российскими аналогами."

- id: product_with_edition
  group: direct_product
  title: "Поиск продукта с конкретной редакцией или комплектацией"
  user_goal: "Найти именно нужную редакцию (Standard/Advanced/Enterprise/ПРОФ/КОРП/Смоленск/Воронеж), не тратя время на остальные."
  examples:
    - "kes расширенный"
    - "astra linux смоленск"
    - "ред ос сервер"
    - "1с зуп корп"
    - "мойофис профессиональный 2"
    - "windows 11 pro"
    - "sql server enterprise"
    - "nanocad spds"
    - "alt workstation k"
    - "secret net studio c"
  detection: "Обнаружены сущность семейства и токен редакции из families.editions (или кросс-вендорные слова: стандарт, проф, корп, сервер, базовый, расширенный)."
  behaviour: "Отфильтровать или жёстко поднять SKU нужной редакции; в карточке предвыбрать эту редакцию; показать бейдж отличия от соседней редакции."
  data_needed: ["families.editions", "sku.edition", "edition_comparison_notes"]
  priority: P0
  wow: "Показ короткой подсказки «Чем Расширенный отличается от Стандартного» прямо под заголовком."

- id: product_with_version
  group: direct_product
  title: "Поиск конкретной версии или ветки продукта"
  user_goal: "Купить совместимую с текущей инфраструктурой версию ПО (например, 1С 8.3, КриптоПро 5.0, Astra 1.7/1.8, LTSC)."
  examples:
    - "криптопро csp 5.0"
    - "астра линукс 1.8"
    - "астра 1.7 воронеж"
    - "ред ос 8"
    - "windows server 2022"
    - "office 2021 ltsc"
    - "1с предприятие 8.3"
    - "компас 3d v23"
    - "postgres pro 16"
    - "vmware vsphere 8"
  detection: "Семейство + числовой/буквенно-числовой маркер версии (1.7, 1.8, 5.0, 8.3, 2021, 2022, v23, ltsc)."
  behaviour: "Предпочесть SKU с точным совпадением версии; если запрошена устаревшая версия (например, КриптоПро 4.0 или Astra 1.6), показать актуальную с примечанием о праве даунгрейда или окончании поддержки."
  data_needed: ["families.versions", "sku.version", "downgrade_rights_notes"]
  priority: P1
  wow: "Предупреждение при поиске снятой с продаж версии и автоматический показ актуальной версии с правом downgrade."

- id: direct_category_search
  group: direct_product
  title: "Поиск по названию класса ПО (категории)"
  user_goal: "Увидеть все подходящие решения определённого класса для сравнения и выбора."
  examples:
    - "антивирус для организации"
    - "межсетевой экран ngfw"
    - "система резервного копирования"
    - "корпоративный мессенджер"
    - "российские ос"
    - "системы виртуализации"
    - "dlp система"
    - "siem решения"
    - "почтовый сервер"
    - "вкс для офиса"
  detection: "Запрос соответствует канонической категории, её синонимам или сленгу без указания конкретного вендора."
  behaviour: "Открыть выдачу по целевой листовой категории, включить релевантные фасеты (реестр, ФСТЭК, платформа, модель лицензирования), ранжировать с учётом сегмента клиента, популярности и маржи."
  data_needed: ["categories.synonyms", "categories.slang", "categories.parent", "client_segment", "popularity", "margin"]
  priority: P0
  wow: "Разный порядок выдачи для малого бизнеса и госзаказчика на один и тот же запрос «почтовый сервер»."

- id: module_or_plugin_search
  group: direct_product
  title: "Поиск отдельного модуля, плагина или дополнения к базовой платформе"
  user_goal: "Докупить конкретный модуль к уже установленной системе (например, модуль САПР, агент бэкапа, коннектор 1С)."
  examples:
    - "nanocad модуль спдс"
    - "кибер бэкап агент для 1с"
    - "dr web агент для почтовых серверов"
    - "kaspersky security for mail server"
    - "ассистент модуль серверный"
    - "битрикс24 маркет плюс"
    - "1с отчетность"
    - "контур экстерн модуль мчд"
    - "usergate log analyzer"
    - "компас оборудование трубопроводы"
  detection: "Упомянут базовый продукт/вендор + слова «модуль», «агент», «плагин», «коннектор», «расширение», «подсистема» или специфическое имя аддона."
  behaviour: "Показать именно модули/аддоны с явным указанием, какая базовая лицензия требуется для их работы."
  data_needed: ["families.editions", "license.actions:addon", "parent_product_dependency"]
  priority: P1
  wow: "Бейдж «Требует базовую платформу X» + кнопка «Добавить вместе с базой»."

# ============================================================================
# 2. SKU_CODES — Артикулы, партномера, реестровые номера и коды тендеров
# ============================================================================

- id: exact_vendor_sku
  group: sku_codes
  title: "Поиск по точному артикулу (партномеру) вендора"
  user_goal: "Моментально найти позицию из счёта, КП или прошлогодней спецификации."
  examples:
    - "KL4867RAQFR"
    - "FQC-10572"
    - "KL4863RAKFR"
    - "4601546148735"
    - "AL-17-SE-VRN"
    - "R7-PRO-DESK-1Y"
    - "CP-CSP-50-PRO"
    - "UG-N100-LIC-1Y"
    - "DW-ESS-50-1Y"
    - "FQC10572"
  detection: "Буквенно-цифровой код с характерным паттерном партномера (дефисы, префиксы вендоров KL/FQC/P73/R7/4601546..., отсутствие обычных слов)."
  behaviour: "Прямой приоритетный поиск по sku/mpn (с нормализацией дефисов, пробелов и регистра). При точном совпадении — вывести карточку SKU крупно первым блоком с ценой и кнопкой в корзину."
  data_needed: ["sku.vendor_code", "sku.softline_id", "sku.ean_barcode"]
  priority: P0
  wow: "Мгновенное распознавание артикула даже с пропущенным дефисом или кириллической буквой «С/А/К» вместо латиницы."

- id: partial_or_obsolete_sku
  group: sku_codes
  title: "Поиск по неполному, устаревшему или заменённому артикулу"
  user_goal: "Найти замену старому партномеру из прошлогодней закупки, если вендор сменил прайс-лист."
  examples:
    - "KL4867"
    - "FQC-08909"
    - "старый артикул kesb"
    - "KL4863RAQFR"
    - "замена артикула 4601546092618"
    - "артикул касперский 4867"
    - "партномер виндовс 10 про"
    - "KL4867R"
  detection: "Префикс/подстрока артикула или артикул из таблицы замен/архивных SKU."
  behaviour: "Показать все SKU с совпадающим префиксом; если артикул архивный — прямо сообщить «Артикул снят с продаж, актуальная замена: …» и вывести заменяющий SKU."
  data_needed: ["sku.vendor_code", "sku.replaced_by", "sku.prefix_index"]
  priority: P1
  wow: "Показ цепочки замены: старый артикул Windows 10 Pro → актуальный FQC-10572 (Windows 11 Pro)."

- id: registry_number_lookup
  group: sku_codes
  title: "Поиск по номеру записи в Едином реестре российского ПО"
  user_goal: "Проверить и купить ровно тот продукт, который указан в тендерной документации или приказе Минцифры."
  examples:
    - "реестр по № 369"
    - "запись в реестре 1234"
    - "номер реестра минцифры 4481"
    - "реестровый номер 637"
    - "по из реестра номер 10542"
    - "реестр 369 астра"
    - "№ 5617 реестр по"
    - "еррп 211"
  detection: "Упоминание «реестр», «еррп», «номер записи», «№» рядом с 2–5-значным числом."
  behaviour: "Искать по полю реестрового номера (если заполнено в каталоге); если точного номера нет в данных — честно предупредить и предложить проверить актуальный номер на reestr.digital.gov.ru, показав совпадающее ПО из реестра."
  data_needed: ["sku.registry_id", "families.registry"]
  priority: P1
  wow: "Для госзаказчика мгновенная сверка «номер реестра → точное семейство → готовые к закупке SKU без НДС»."

- id: okpd2_ktru_code_search
  group: sku_codes
  title: "Поиск по коду ОКПД2 или КТРУ из закупочной документации"
  user_goal: "Подобрать ПО, проходящее под конкретный код ОКПД2/КТРУ в плане-графике 44-ФЗ."
  examples:
    - "окпд2 58.29.11"
    - "окпд 58.29.29"
    - "58.29.32.000"
    - "ктру 58.29.11.000-00000001"
    - "окпд2 офисное по"
    - "код окпд антивирус"
    - "58.29.21"
    - "окпд2 58.29.12 операционные системы"
  detection: "Паттерн ОКПД2 (58.29.xx, 62.01.xx, 63.11.xx) или ключевые слова «окпд», «окпд2», «ктру»."
  behaviour: "Сопоставить код ОКПД2/КТРУ с классом ПО (категорией каталога), применить фильтр реестра Минцифры (по умолчанию для госзакупок) и вывести подходящие продукты."
  data_needed: ["compliance.okpd2_map", "categories.id", "families.registry"]
  priority: P1
  wow: "По вводу «58.29.11» поиск понимает «системное ПО / ОС» и сразу предлагает российские ОС из реестра."

- id: mixed_cyrillic_latin_sku
  group: sku_codes
  title: "Артикул со смешанной кириллицей и латиницей (скопирован из PDF/Word)"
  user_goal: "Найти товар по коду, скопированному из кривого КП, где визуально похожие буквы (А, В, Е, К, М, Н, О, Р, С, Т, Х) набраны кириллицей."
  examples:
    - "КL4867RАQFR"
    - "FQС-10572"
    - "Р7-ОFFIСЕ"
    - "КL4867RАКFR"
    - "СSР-50"
    - "АL-17-SЕ"
    - "МS-ОFFIСЕ"
    - "КL4867"
  detection: "Токен похож на артикул и содержит смесь латинских и кириллических гомоглифов."
  behaviour: "Нормализовать гомоглифы в латиницу (А→A, С→C, К→K, О→O, Р→P, Т→T, Х→X, Е→E, Н→H, М→M, В→B), выполнить точный поиск по SKU и показать уведомление об исправлении."
  data_needed: ["normalizer.homoglyphs", "sku.vendor_code"]
  priority: P0
  wow: "Демонстрация реальной боли закупщиков: копипаста артикула из PDF-счёта с русскими буквами находится без осечки."

# ============================================================================
# 3. LICENSING — Лицензионные намерения, метрики, сроки, аудитории и НДС
# ============================================================================

- id: renewal_by_quantity
  group: licensing
  title: "Продление лицензии на N устройств/пользователей"
  user_goal: "Быстро найти позицию именно продления (а не новой покупки) в нужном ценовом диапазоне узлов (tier/band)."
  examples:
    - "каспер продление на 30 компов"
    - "kes renewal 50"
    - "продлёнка др веб 100 пк"
    - "продлить р7 офис на 25 пользователей"
    - "продление лицензии мой офис 40 мест"
    - "пролонгация кибер бэкап 5 серверов"
    - "usergate продление подписки 1 год"
    - "kaspersky renew 15-19"
    - "продлить 1с итс проф на год"
    - "контур экстерн продление"
  detection: "Наличие маркера действия renewal («продление», «продлёнка», «продлить», «пролонгация», «renewal», «renew») + число + единица метрики («компов», «пк», «узлов», «мест», «юзеров», «серверов»)."
  behaviour: "Отфильтровать SKU по license_action=renewal, подобрать правильный ценовой диапазон (band: для 30 → 25-49), показать цену за 1 узел и расчётную сумму за N узлов (30 × цена)."
  data_needed: ["sku.license_action", "sku.min_qty", "sku.max_qty", "sku.metric", "slang.licensing"]
  priority: P0
  wow: "Калькулятор прямо в карточке выдачи: «Подобран диапазон 25–49 узлов: 2 857 ₽ × 30 ПК = 85 710 ₽ (без НДС)»."

- id: new_license_by_quantity_and_term
  group: licensing
  title: "Покупка новой лицензии с указанием количества и срока"
  user_goal: "Подобрать базовую (новую) лицензию на конкретное число рабочих мест и срок (1, 2, 3 года или бессрочно)."
  examples:
    - "антивирус на 100 компьютеров на 2 года"
    - "р7 офис 50 лицензий на год"
    - "астра линукс 200 рабочих мест"
    - "доктор веб на 15 пк новая лицензия 3 года"
    - "мойофис стандартный 30 мест бессрочно"
    - "контур толк на 10 организаторов год"
    - "ассистент удаленный доступ 10 подключений"
    - "криптопро 5 на 5 рабочих мест бессрочная"
    - "windows 11 pro 10 шт"
    - "нанокад 3 рабочих места годовая"
  detection: "Продукт/категория + количество (N) + срок (1/2/3 года, 12/24/36 мес, бессрочно) + опционально маркер new («новая», «базовая», «первичная»)."
  behaviour: "Выбрать license_action=new, срок и ценовой band под N; посчитать итоговую сумму и подсказать экономию при выборе 2–3 лет (если есть SKU)."
  data_needed: ["sku.license_action", "sku.term_months", "sku.model", "sku.min_qty", "sku.max_qty"]
  priority: P0
  wow: "Подсказка «На 2 года дешевле на 18% в пересчёте на год» прямо в карточке."

- id: perpetual_vs_subscription
  group: licensing
  title: "Выбор модели лицензирования: бессрочная или подписка"
  user_goal: "Купить именно бессрочную (постоянную, неисключительную без срока) лицензию или наоборот годовую подписку под OPEX."
  examples:
    - "бессрочная лицензия офиса"
    - "офис без подписки купить навсегда"
    - "р7 офис бессрочный"
    - "криптопро годовая лицензия"
    - "нанокад постоянная лицензия"
    - "компас бессрочная"
    - "подписка на антивирус помесячно"
    - "perpetual license sql server"
    - "бессрочная ос астра"
    - "купить 1с навсегда не облако"
  detection: "Маркеры модели: «бессрочная», «постоянная», «навсегда», «без подписки», «perpetual» vs «подписка», «годовая», «помесячно», «subscription», «аренда»."
  behaviour: "Жёстко фильтровать по license.model (perpetual / subscription). Если продукт продаётся только по подписке (например, антивирус), честно объяснить это и не выдавать пустую страницу."
  data_needed: ["sku.license_model", "families.license.models"]
  priority: P0
  wow: "Честное пояснение «Корпоративные антивирусы лицензируются только по подписке (1–3 года) из-за обновлений баз» вместо нуля результатов."

- id: license_addon_expansion
  group: licensing
  title: "Докупка (долицензирование) узлов к действующей лицензии"
  user_goal: "Увеличить количество рабочих мест в уже купленной лицензии, не переплачивая за отдельный ключ."
  examples:
    - "докупка лицензий касперский 10 узлов"
    - "долицензирование kesb на 15 пк"
    - "добавить пользователей 1с на 5 рабочих мест"
    - "клиентские лицензии 1с на 10 пользователей"
    - "докупить 5 мест мойофис"
    - "расширение лицензии dr web"
    - "addon license kaspersky"
    - "увеличить число пользователей битрикс24"
  detection: "Слова «докупка», «докупить», «долицензирование», «расширение», «добавить мест/пользователей», «addon», «доп лицензии»."
  behaviour: "Приоритизировать SKU с license_action=addon или пакеты клиентских лицензий (как у 1С); подсказать, что срок докупки обычно выравнивается до даты окончания основной лицензии."
  data_needed: ["sku.license_action", "families.license.actions", "faq.addon_rules"]
  priority: P1
  wow: "Карточка с пояснением про ко-терминг (выравнивание срока докупки) и кнопкой «Запросить расчёт на остаток срока»."

- id: license_upgrade_and_crossgrade
  group: licensing
  title: "Апгрейд редакции и конкурентный переход (миграция со скидкой)"
  user_goal: "Перейти на старшую редакцию или мигрировать с конкурирующего продукта со скидкой (crossgrade)."
  examples:
    - "апгрейд касперский стандартный на расширенный"
    - "переход с eset на касперский"
    - "миграция с dr web на kes со скидкой"
    - "crossgrade kaspersky"
    - "апгрейд 1с бухгалтерия базовая на проф"
    - "переход с 1с проф на корп"
    - "конкурентный переход мойофис"
    - "миграция с microsoft office на р7"
    - "переход с vmware на брест скидка"
    - "апгрейд нанокад"
  detection: "Слова «апгрейд», «upgrade», «переход с … на …», «миграция с», «crossgrade», «конкурентный переход», «трейд-ин»."
  behaviour: "Если «с редакции А на Б одного вендора» → license_action=upgrade. Если «с вендора Х на вендора Y» → license_action=crossgrade, показать спецпозиции миграции и пояснить, какие документы нужны (действующая лицензия конкурента)."
  data_needed: ["sku.license_action", "analogs", "faq.crossgrade"]
  priority: P1
  wow: "Автоматическое определение, что переход с ESET на Kaspersky даёт скидку по программе миграции (Crossgrade)."

- id: server_and_infrastructure_metrics
  group: licensing
  title: "Лицензирование по инфраструктурным метрикам (ядра, CPU, сокеты, ВМ, серверы, ТБ)"
  user_goal: "Купить серверное ПО, СУБД, виртуализацию или бэкап с правильной единицей лицензирования."
  examples:
    - "windows server 16 ядер"
    - "sql server на 4 ядра"
    - "виртуализация на 2 сокета"
    - "кибер бэкап на 10 виртуальных машин"
    - "бэкап на 5 терабайт"
    - "postgres pro по ядрам"
    - "астра линукс для 3 серверов"
    - "лицензия на 1 хост гипервизора"
    - "резервное копирование гипервизора по сокетам"
    - "1с сервер x64"
  detection: "Упоминание серверных/инфраструктурных метрик: «ядра», «core», «cpu», «сокет», «процессор», «вм», «виртуальных машин», «хост», «сервер», «тб», «терабайт»."
  behaviour: "Фильтровать по license.metrics (core/cpu/vm/server/storage); для Windows Server / SQL Server автоматически напомнить про минимальный порог лицензирования (например, кратность пакетам ядер)."
  data_needed: ["sku.metric", "families.license.metrics", "faq.core_licensing"]
  priority: P1
  wow: "Подсказка «SQL Server лицензируется пакетами по 2 ядра (минимум 4 ядра на сервер) — подобрано 2 пакета»."

- id: concurrent_vs_named_licensing
  group: licensing
  title: "Плавающие (конкурентные/сетевые) vs именные (локальные) лицензии"
  user_goal: "Сэкономить бюджет, купив плавающие сетевые лицензии (например, САПР, терминальный доступ, ВКС), которыми пользуются по очереди."
  examples:
    - "нанокад сетевая лицензия"
    - "компас 3d плавающая лицензия"
    - "конкурентные лицензии вкс"
    - "floating license cad"
    - "удаленный доступ по одновременным сессиям"
    - "ассистент конкурентные подключения"
    - "локальная лицензия нанокад"
    - "именная лицензия мойофис"
    - "плавающая лицензия криптопро"
    - "сетевая лицензия autocad аналог"
  detection: "Слова «сетевая», «плавающая», «конкурентная», «floating», «concurrent», «одновременных подключений/сессий» vs «локальная», «именная», «named», «привязанная к пк»."
  behaviour: "Фильтровать по metric=concurrent (для плавающих) или user/device (для именных/локальных); объяснить разницу в цене и гибкости."
  data_needed: ["sku.metric", "families.license.metrics"]
  priority: P1
  wow: "Сравнение стоимости: «5 плавающих лицензий САПР заменят 12–15 локальных при посменной работе»."

- id: cal_and_rds_client_access
  group: licensing
  title: "Клиентские лицензии доступа (CAL, RDS CAL, терминальные лицензии)"
  user_goal: "Легализовать подключение пользователей или устройств к Windows Server, SQL Server, Exchange или терминальному серверу."
  examples:
    - "rds cal 10 пользователей"
    - "windows server cal user 25"
    - "терминальные лицензии windows server 2022"
    - "лицензии удаленного рабочего стола на устройства"
    - "sql server cal"
    - "кал на пользователя виндовс сервер"
    - "клиентские лицензии на терминальник"
    - "user cal vs device cal"
  detection: "Токены «cal», «rds», «кал», «терминальные лицензии», «клиентские лицензии доступа», «user cal», «device cal»."
  behaviour: "Вывести именно клиентские лицензии доступа, а не сами серверные ОС; разделить варианты «на пользователя» (User CAL) и «на устройство» (Device CAL) с краткой подсказкой выбора."
  data_needed: ["categories:server_os", "families.editions", "slang.cal", "faq.what_is_cal"]
  priority: P0
  wow: "Карточка-подсказка: «User CAL выгоднее при нескольких гаджетах у сотрудника, Device CAL — при посменной работе за одним ПК»."

- id: audience_specific_pricing
  group: licensing
  title: "Льготные и отраслевые типы клиентов (Гос, Образование, Медицина, НКО, SMB)"
  user_goal: "Получить специальный академический, медицинский или государственный прайс, либо лицензию строго для юрлица (а не домашнюю)."
  examples:
    - "антивирус для школы"
    - "астра линукс для вуза"
    - "р7 офис академическая лицензия"
    - "мойофис образование бесплатно или платно"
    - "касперский для больницы медицина"
    - "лицензии для бюджетного учреждения"
    - "офис для некоммерческой организации нко"
    - "антивирус для ип на 3 компьютера"
    - "софт для малого бизнеса 5 пк"
    - "коммерческая лицензия для юрлица"
  detection: "Упоминание типа организации: «школа», «вуз», «университет», «образование», «edu», «академическая», «больница», «медицина», «госучреждение», «бюджет», «нко», «ип», «ооо», «юрлицо», «малый бизнес»."
  behaviour: "Фильтровать SKU по license.audiences (edu/med/gov/nonprofit/business); исключить домашние версии (home) для юрлиц; учесть контекст сегмента авторизованного клиента."
  data_needed: ["sku.audience", "families.license.audiences", "client_profile.segment"]
  priority: P0
  wow: "На запрос «р7 офис 50 шт» школа видит академический прайс, а коммерческая компания — бизнес-лицензии (персонализация контекста!)."

- id: vat_and_tax_preference
  group: licensing
  title: "Поиск ПО без НДС (льгота по реестру) или с выделенным НДС"
  user_goal: "Бухгалтер или закупщик проверяет, облагается ли лицензия НДС (ПО из ЕРРП продаётся без НДС, зарубежное/услуги — с НДС)."
  examples:
    - "офис без ндс"
    - "по без ндс из реестра"
    - "купить windows с ндс по безналу"
    - "антивирус без ндс для юрлиц"
    - "лицензии с ндс к вычету"
    - "ос без ндс на 50 пк"
    - "счет без ндс 1с"
    - "почему без ндс касперский"
  detection: "Токены «без ндс», «с ндс», «ндс 0», «ндс 20», «ндс 22», «льгота по ндс»."
  behaviour: "Для «без НДС» — фильтровать по vat=0 / registry=yes (неисключительные права на ПО из ЕРРП освобождены от НДС по ст. 149 НК РФ); для «с НДС» — показать позиции с выделенным НДС и пояснить налоговый режим."
  data_needed: ["sku.vat", "families.registry", "compliance.vat_exemption"]
  priority: P1
  wow: "Явный бейдж «Без НДС (реестр Минцифры)» vs «в т.ч. НДС» и фильтр для бухгалтерии."

# ============================================================================
# 4. IMPORT_SUBSTITUTION — Импортозамещение, ушедшие вендоры, аналоги, миграция
# ============================================================================

- id: explicit_analog_query
  group: import_substitution
  title: "Явный запрос российского аналога зарубежного ПО"
  user_goal: "Найти отечественную замену конкретному привычному зарубежному продукту."
  examples:
    - "российский аналог microsoft office"
    - "замена autocad из реестра"
    - "аналог vmware vsphere российский"
    - "чем заменить zoom для компании"
    - "российский аналог jira и confluence"
    - "замена teamviewer для юрлиц"
    - "аналог adobe acrobat pro"
    - "чем заменить microsoft exchange"
    - "отечественный аналог veeam backup"
    - "замена slack корп мессенджер"
    - "аналог sap erp российский"
    - "замена power bi из реестра"
  detection: "Слова «аналог», «замена», «чем заменить», «вместо», «импортозамещение» + название зарубежного продукта/вендора."
  behaviour: "Обратиться к kb/analogs.yaml: показать структурированный блок «Российские аналоги для X» с кратким пояснением по совместимости (форматы, протоколы, миграция) для каждого аналога, фильтр registry=yes по умолчанию."
  data_needed: ["analogs", "families.replaces", "families.registry", "families.formats"]
  priority: P0
  wow: "Карточка сравнения «Что замещаем → Чем замещаем → Что сохранится при миграции (например, макросы VBA, формат DWG, протокол MAPI)»."

- id: departed_vendor_direct_query
  group: import_substitution
  title: "Прямой поиск ушедшего с рынка РФ вендора или продукта (без слова «аналог»)"
  user_goal: "Человек просто вбил привычное название (Jira, AutoCAD, VMware, Zoom, Slack, Oracle, SAP, Adobe, TeamViewer), не зная, можно ли это купить."
  examples:
    - "autocad купить"
    - "vmware vsphere лицензия"
    - "jira server"
    - "adobe photoshop для юрлиц"
    - "teamviewer corporate"
    - "veeam backup enterprise"
    - "cisco anyconnect"
    - "zoom business"
    - "oracle database"
    - "atlassian confluence"
    - "fortinet fortigate лицензия"
    - "solidworks"
  detection: "Обнаружен вендор/семейство с market_status=left или catalog=no (в базе знаний есть, в продаже нет)."
  behaviour: "НЕ возвращать пустую выдачу! Показать честный информационный блок «Официальные поставки X в РФ прекращены», сразу ниже вывести проверенные российские аналоги из каталога + записать событие в аналитику неудовлетворённого спроса."
  data_needed: ["vendors.market_status", "families.catalog", "analogs", "analytics.gap_log"]
  priority: P0
  wow: "Вместо 0 результатов (как на обычном сайте) — мгновенный «мост импортозамещения» и одновременно сигнал продакт-менеджеру в дашборд спроса."

- id: restricted_vendor_query
  group: import_substitution
  title: "Поиск ПО с ограниченными поставками (параллельный импорт / остатки / спецзаказ)"
  user_goal: "Понять, можно ли ещё легально купить Microsoft/JetBrains/Corel или лучше сразу смотреть альтернативу."
  examples:
    - "microsoft windows 11 pro"
    - "microsoft office 2021 для юрлиц"
    - "ms project купить"
    - "visio professional"
    - "windows server 2022 standard"
    - "sql server 2022"
    - "coreldraw для бизнеса"
    - "jetbrains intellij idea лицензия"
  detection: "Вендор/продукт со статусом market_status=restricted, часть SKU есть в каталоге."
  behaviour: "Показать доступные в каталоге позиции (например, ESD-ключи Windows 11 Pro), а рядом аккуратный блок «Отечественные альтернативы из реестра» для сравнения цены и рисков."
  data_needed: ["vendors.market_status", "families.catalog", "analogs"]
  priority: P0
  wow: "Сбалансированная выдача: если товар есть в каталоге — даём купить, и тут же показываем безрисковую замену из ЕРРП."

- id: stack_migration_complex
  group: import_substitution
  title: "Комплексное импортозамещение целого стека инфраструктуры"
  user_goal: "Заменить сразу связку Microsoft (AD + Exchange + Office + Windows) или стек Atlassian на совместимую российскую экосистему."
  examples:
    - "импортозамещение microsoft под ключ"
    - "замена active directory и exchange"
    - "переход с windows и office на российское по"
    - "замена стека atlassian jira confluence bitbucket"
    - "импортозамещение vmware и veeam"
    - "российский стек вместо microsoft 365"
    - "замена citrix vdi на отечественное"
    - "переезд с oracle и sap"
  detection: "Упомянуто 2+ зарубежных продукта/компонента или слова «стек», «экосистема», «инфраструктура», «под ключ» в контексте импортозамещения."
  behaviour: "Собрать совместимую российскую связку по слотам (например: ОС Astra Linux + контроллер домена ALD Pro + почта RuPost/Tegu + офис Р7/МойОфис) с отметкой о проверенной совместимости компонентов."
  data_needed: ["analogs", "ecosystems_bundles", "families.compat_ru_os"]
  priority: P1
  wow: "Готовая «карта переезда» по слотам с единой кнопкой «Сформировать спецификацию в КП»."

- id: format_preserving_analog
  group: import_substitution
  title: "Замена зарубежного ПО с критичным требованием к формату файлов"
  user_goal: "Перейти на российский софт так, чтобы старые архивы DWG, DOCX/XLSX с макросами, PDF, PSD, RVT открывались без поломок."
  examples:
    - "российский аналог автокада с поддержкой dwg"
    - "офис из реестра с макросами excel vba"
    - "чем открыть файлы visio vsdx на линукс"
    - "замена adobe acrobat редактирование pdf"
    - "аналог revit с форматом ifc"
    - "замена photoshop с открытием psd"
    - "российский аналог ms project файлы mpp"
    - "аналог coreldraw с поддержкой cdr"
  detection: "Запрос аналога/замены + указание расширения файла (dwg, xlsx, vba, pdf, psd, vsdx, mpp, cdr, ifc, rvt)."
  behaviour: "Фильтровать аналоги по families.formats, выделить совместимость с форматом в сниппете карточки и честно предупредить об ограничениях (например, частичная совместимость сложных VBA-макросов)."
  data_needed: ["families.formats", "analogs.note", "families.registry"]
  priority: P1
  wow: "Вывод точного бейджа совместимости «Нативный DWG» (nanoCAD) или «Импорт MPP»."

- id: domestic_alternative_by_category
  group: import_substitution
  title: "Поиск «российского / отечественного» ПО в категории"
  user_goal: "Отсеять всё зарубежное и увидеть только отечественные разработки определённого класса."
  examples:
    - "российская операционная система"
    - "отечественный антивирус"
    - "российская субд"
    - "отечественная виртуализация"
    - "российский почтовый клиент"
    - "российская crm система"
    - "отечественный сапр"
    - "российский вкс"
    - "отечественный бэкап"
    - "российский браузер для бизнеса"
  detection: "Слова «российский», «отечественный», «наш», «рф», «импортозамещение» + название категории."
  behaviour: "Применить жёсткий фильтр origin=russian (и мягкий/жёсткий буст registry=yes), вывести линейку отечественных лидеров категории."
  data_needed: ["vendors.origin", "families.registry", "categories"]
  priority: P0
  wow: "Мгновенная активация чипа «Отечественное ПО · Реестр Минцифры» с прозрачным объяснением."

- id: open_source_with_commercial_support
  group: import_substitution
  title: "Поиск коммерческой сборки / техподдержки для Open Source"
  user_goal: "Юрлицу нужен PostgreSQL, Linux, Zabbix, Proxmox или LibreOffice с официальной русской поддержкой, SLA и закрывающими документами."
  examples:
    - "postgresql с техподдержкой для юрлиц"
    - "коммерческий linux с поддержкой"
    - "техподдержка zabbix россия"
    - "поддержка kubernetes российская"
    - "аналог proxmox с поддержкой в рф"
    - "nginx коммерческая версия рф"
    - "libreoffice с поддержкой и сертификатом"
    - "коммерческий redmine аналог"
  detection: "Известный Open Source продукт + слова «поддержка», «техподдержка», «коммерческая», «для юрлиц», «с sla», «реестр»."
  behaviour: "Показать российские коммерческие дистрибутивы и форки на базе этого Open Source (PostgreSQL → Postgres Pro / Tantor / Jatoba; Nginx → Angie Pro; Linux → Astra/Альт/РЕД ОС; K8s → Deckhouse/Штурвал)."
  data_needed: ["analogs", "families.replaces", "categories:tech_support"]
  priority: P1
  wow: "На «postgresql техподдержка» поиск сразу предлагает Postgres Pro, Tantor и сервисные контракты, а не говорит «товар бесплатный, не найден»."

