# Подписи «Искали ПО для …?» для классов оборудования каталога store.softline.ru
# (спецификация 30.4, п. 1 — намерение «железо или ПО»).
#
# Когда запрос содержит голое название класса оборудования (например «сервер»,
# «ноутбук», «коммутатор»), движок показывает карточки `domain=hardware` первыми
# и добавляет кликабельную подсказку `prompt` для быстрого перехода к соответствующим
# классам ПО (`software_classes` — id уровня 2 из `real-categories.tsv`).

# ==============================================================================
# 1. БАЗОВЫЕ КЛАССЫ ОБОРУДОВАНИЯ ИЗ ЗАДАНИЯ (7 классов)
# ==============================================================================

- id: hw_hint_server
  hardware_class: server
  hardware_feed_classes: [86563, 87417, 87268, 87317]
  trigger_words: ["сервер", "серверы", "рэк сервер", "рэк-сервер", "стоечный сервер", "микросервер", "сервак"]
  prompt: "Искали ПО для сервера?"
  software_classes: [369, 222320, 2050, 222321, 2500, 650, 1033]
  software_query_hint: "серверное ПО, серверные ОС, виртуализация, бэкап и защита серверов"
  sw_examples: ["Windows Server", "Astra Linux Special Edition", "MS SQL Server", "Кибер Бэкап", "zVirt"]

