# Подписи «для кого» у линеек 12 популярных вендоров и analogs для непродаваемых/домашних линеек (ход 6, 29.2–29.3)
# Файл — предложение Neon-4 для потока A: поле `for_whom` пока отсутствует в FIELDS["families"] (loader.py),
# поэтому файл размещён в design/proposals/neon4/. После добавления `for_whom` в схему/загрузчик
# значения можно подключать напрямую как overlay по family id или влить в kb/overrides/families.yaml.
#
# Закрытый список audience (29.2):
#   home, micro_office, business, enterprise, gov, edu, server, mobile, industrial

schema_version: "r6-proposal-v1"

# Рекомендованные правки базовых домашних линеек из kb/families/security.yaml
# (базовые файлы вне зоны записи Neon-4; сейчас там catalog: yes, а analogs указывают друг на друга — на другие домашние антивирусы).
base_overrides_recommended:
  - id: kaspersky_standard_home
    catalog: no
    analogs: [kaspersky_ksos, kaspersky_kesb]
    upgrade_to: kaspersky_ksos
    reason: "Домашних лицензий Kaspersky нет в B2B-каталоге; ближайшая продаваемая линейка того же вендора — KSOS, далее KES для бизнеса."
  - id: drweb_security_space
    catalog: no
    analogs: [drweb_small_business, drweb_enterprise_security_suite]
    upgrade_to: drweb_small_business
    reason: "Домашний Dr.Web Security Space не продаётся в B2B-каталоге; ближайшая продаваемая линейка того же вендора — Dr.Web Малый бизнес."
