    catalog: no
    analogs: [pro32_endpoint_security]
    upgrade_to: pro32_endpoint_security
    reason: "Домашний PRO32 Total Security не продаётся в B2B-каталоге; ближайшая продаваемая линейка того же вендора — PRO32 Endpoint Security."

