    - "гарда"
    - "тезис"
  detection: "Короткий токен совпадает с редким/нишевым продуктом или вендором из KB (`KUMA`, `Брест`, `Альт`, `РОСА`, `Renga`, `Tantor`, `Аврора`, `Соболь`, `Гарда`, `ТЕЗИС`), но также близок по Левенштейну к бытовому или более частотному слову."
  behaviour: "Никогда не заменять валидный термин из KB! Если же токен действительно неизвестен, но уверенность исправления средняя — показать результаты по лучшему варианту и кликабельную ссылку «Искать точно как введено: …» (или наоборот), логируя `correction_accept` / `correction_reject`."
  data_needed: ["kb_protected_vocabulary", "typo_corrector", "analytics.events:correction_reject"]
  priority: P1
  wow: "«кума» находит Kaspersky KUMA (SIEM), «брест» — виртуализацию ПК СВ Брест, «соболь» — ПАК Соболь, а не исправляется ошибочно."

# ============================================================================
# 6. BUSINESS_ANALYTICS_SIGNALS — Сценарии, приносящие измеримую пользу бизнесу
# ============================================================================

- id: signal_hot_enterprise_lead
  group: business_analytics_signals
  title: "Сигнал горячего крупного лида для менеджера e-com"
  user_goal: "Менеджер e-com хочет в тот же день увидеть и подхватить клиентов, которые ищут крупные объёмы или проектные решения, пока они не ушли к другому поставщику."
  examples:
    - "astra linux 1000 рабочих мест"
    - "maxpatrol siem внедрение"
    - "kaspersky endpoint security 500 узлов продление"
    - "vmware замена на 40 серверов"
    - "infowatch dlp 1500 пользователей"
    - "р7 офис 800 лицензий 44 фз"
    - "postgres pro enterprise 64 ядра"
    - "usergate кластер для цод"
  detection: "В поисковой сессии обнаружен маркер высокого чека (`estimated_deal_rub >= 300 000` или `qty >= 100` или `price_on_request=true`), особенно при повторных запросах/просмотрах за 7 дней без оформленного заказа."
  behaviour: "Агент создаёт находку `hot_lead` в очереди менеджера e-com с оценкой потенциального чека, списком запросов клиента, его профилем (ОС, сегмент) и кнопкой «Взять в работу / Подготовить КП»."
  data_needed: ["query_log", "client_profile", "sku.price", "agent.insight:hot_lead"]
  priority: P0
  wow: "Поиск работает не только как витрина, но и как радар крупных B2B-сделок для отдела продаж."

- id: signal_rising_demand_trend
  group: business_analytics_signals
  title: "Сигнал растущего спроса и сезонных волн для продукт-менеджера и коммерции"
  user_goal: "Руководитель и продукт-менеджер хотят заранее замечать взрывной рост спроса на новые категории (ИИ-инструменты, КЭДО, K8s, отечественные BI) и предквартальные пики."
  examples:
    - "gigachat корпоративный api"
    - "кэдо для удаленных сотрудников"
    - "deckhouse kubernetes лицензия"
    - "российский bi вместо power bi"
    - "аналог miro российский"
    - "защита llm и ии моделей"
    - "система управления паролями российская"
    - "импортозамещение active directory"
  detection: "Рост числа уникальных сессий по кластеру запросов за последние 14 дней >= +40% к базовому периоду (предыдущие 28 дней) при минимуме >= 15 сессий."
  behaviour: "Агент формирует инсайт `rising_demand` с динамикой, долей конверсии по кластеру, списком товаров-лидеров и пробелов, предлагая вывести категорию на витрину или расширить ассортимент."
  data_needed: ["query_log.90d", "cluster_aggregator", "agent.insight:rising_demand"]
  priority: P0
  wow: "На дашборде руководителя наглядно видно: «Спрос на российские аналоги Miro и корпоративный ИИ вырос в 2,4 раза за 2 недели, но 60% уходят без покупки»."

- id: signal_catalog_gap_monetization
  group: business_analytics_signals
  title: "Выявление пробелов каталога с консервативной оценкой упущенной выручки"
  user_goal: "Контент-менеджер и категорийный менеджер хотят получить приоритизированный список продуктов, которых нет в каталоге, но которые системно ищут покупатели."
  examples:
    - "yonote корпоративный"
    - "kaiten лицензия для юрлиц"
    - "holst доски корпоративный тариф"
    - "angie pro лицензия"
    - "passwork корпоративный"
    - "compass мессенджер on-premise"
    - "pix bi лицензия"
    - "weeek для команды"
  detection: "Регулярные запросы (`>= 10` уникальных сессий за 30 дней) с причиной `not_in_catalog_known` по доступному на рынке РФ (российскому или дружественному) ПО — отдельно от ушедших брендов (`vendor_left`) и мусора (`off_topic`)."
  behaviour: "Агент создаёт инсайт `add_product` с числом сессий, профилями клиентов, оценкой потенциальной выручки (консервативной, с прозрачной формулой) и предлагаемыми текущими аналогами-мостами, пока товар не заведён."
  data_needed: ["query_log", "families.catalog:no", "vendors.market_status", "agent.insight:add_product"]
  priority: P0
  wow: "Отделяет реальный коммерческий пробел («Passwork / Yonote / Angie Pro не заведены в прайс — теряем заказы») от ушедших вендоров и спама."

- id: signal_vocabulary_gap_synonym_discovery
  group: business_analytics_signals
  title: "Автообнаружение пробелов словаря и новых синонимов из лога поиска"
  user_goal: "Контент-менеджер хочет одним кликом закрывать жаргонизмы, сокращения и новые названия, из-за которых поиск даёт 0 или слабую выдачу."
  examples:
    - "адешка для линукса"
    - "эцпшка буху"
    - "файрволл фстэк"
    - "бэкапилка для виртуалок"
    - "кесб продленка"
    - "савз на сервер"
    - "почтовик в контур"
    - "терминальник 2022"
  detection: "Запрос даёт `zero_result` или низкий CTR (< 5%) при >= 5 сессиях, и в >= 30% этих сессий пользователь успешно переформулирует запрос в существующую сущность каталога."
  behaviour: "Агент формирует инсайт `add_synonym` с парой `термин -> целевая категория/семейство`, примерами сессий и прогнозом спасённых запросов. Кнопка «Применить» добавляет синоним в live-индекс, а через 7 дней (или на replay) система проверяет рост CTR и падение zero-rate."
  data_needed: ["query_log", "analytics.events:reformulate", "slang", "agent.insight:add_synonym"]
  priority: P0
  wow: "На демо контент-менеджер нажимает «Применить синоним» в инсайте агента — и проблемный запрос тут же начинает давать точную выдачу!"

- id: signal_card_content_gap_high_bounce
  group: business_analytics_signals
  title: "Обнаружение дефектных карточек товара с высоким спросом и низкой конверсией"
  user_goal: "Контент-менеджер хочет знать, какие именно карточки теряют продажи из-за пустых атрибутов (не указана совместимость с Astra Linux, нет статуса ЕРРП, нет цены, неверная метрика)."
  examples:
    - "антивирус под астра линукс"
    - "офис без ндс"
    - "бэкап для postgres"
    - "удаленный доступ с фстэк"
    - "сапр сетевая лицензия"
    - "мессенджер on-premise"
    - "вкс на 100 участников"
    - "субд из реестра"
  detection: "Товар часто показывается или отсеивается фильтрами из-за `null`-атрибутов, либо имеет высокий CTR (> 20%) при аномально низкой конверсии в корзину (< 1%) и быстрых возвратах в выдачу (pogo-sticking)."
  behaviour: "Агент создаёт инсайт `fix_card` со списком конкретных SKU, указанием недостающих полей (`compat_ru_os`, `registry`, `certs`, `license_action`, `price`) и ожидаемым ростом охвата по популярным фильтрам."
  data_needed: ["catalog.sku", "query_log.filters", "analytics.events:click,cart,exit", "agent.insight:fix_card"]
  priority: P0
  wow: "Показывает контент-менеджеру не абстрактную «полноту каталога 82%», а конкретные 12 карточек, заполнение которых даст максимальный эффект в рублях."

- id: signal_proactive_renewal_wave
  group: business_analytics_signals
  title: "Сигнал риска оттока при поиске конкурентов клиентом с истекающей лицензией"
  user_goal: "Менеджер e-com хочет вовремя узнать, что действующий клиент с истекающей через 30 дней лицензией ищет аналоги или цены конкурентов."
  examples:
    - "антивирус не касперский"
    - "dr web вместо касперского"
    - "мой офис или р7 офис что дешевле"
    - "замена битрикс24"
    - "аналог кибер бэкап"
    - "сравнение ассистент и rudesktop"
    - "переход с dr web на pro32"
    - "контур экстерн или сбис что выгоднее"
  detection: "Авторизованный клиент с `owned.expires_in_days <= 45` делает запросы на конкурирующие продукты, исключение своего текущего вендора (`exclude_vendor`) или сравнение цен."
  behaviour: "В поиске для клиента — честная релевантная выдача + мягкое напоминание о выгодной цене продления текущей лицензии (обычно дешевле новой покупки конкурента). В аналитике менеджера e-com — инсайт `renewal_campaign` / риск оттока с объёмом контракта под угрозой."
  data_needed: ["client_profile.owned", "query_log", "agent.insight:renewal_campaign"]
  priority: P1
  wow: "Превращает поисковый лог в систему раннего предупреждения оттока (churn alert) для B2B-аккаунт-менеджеров."

- id: signal_margin_safe_merchandising
  group: business_analytics_signals
  title: "Коммерческое управление выдачей (маржа и фокусные вендоры) без ущерба релевантности"
  user_goal: "Руководитель e-com и категорийный менеджер хотят поднимать высокомаржинальные и приоритетные лицензии, сохраняя доверие покупателя и качество поиска."
  examples:
    - "российский антивирус для бизнеса"
    - "отечественный офисный пакет"
    - "система резервного копирования из реестра"
    - "удаленный доступ российский"
    - "корпоративная вкс из реестра"
    - "российская операционная система"
    - "защита от утечек dlp"
    - "российский аналог teamviewer"
  detection: "Категорийный или аналоговый запрос, по которому в релевантной полосе Tier 1 присутствует >= 3 равноценных по соответствию требованиям продукта с разной маржинальностью."
  behaviour: "Ранжирование строго соблюдает барьер полос (Tier 0 > Tier 1 > Tier 2 > Tier 3 — 0 инверсий полос), а вес `margin` и правила мерчандайзинга (`merch_rule`) переупорядочивают только равнорелевантные товары внутри одной полосы. В дашборде руководителя отображается симулятор «Маржа vs NDCG@5»."
  data_needed: ["sku.margin_pct", "ranking.bands", "merch_rules", "agent.insight:merch_rule,weights_advice"]
  priority: P0
  wow: "На живом слайдере руководитель увеличивает вес маржи и видит рост маржинальной выручки при неизменных NDCG@5 и 0 нарушениях релевантности."
