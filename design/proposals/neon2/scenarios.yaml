# Дополняющая карта сценариев поиска и аналитики (поток Neon-2, AiXenix)
# Фокус: путь покупателя (persona & funnel stage), контекст и персонализация,
# цепочки запросов в сессии, нетоварные ответы, саджест и бизнес-сигналы для 5 ролей.
# Не дублирует 73 сценария первого потока (design/proposals/neon/scenarios.yaml).
# Всего: 45 новых сценариев в 6 группах.

# ============================================================================
# 1. CONTEXT_PERSONALIZATION — Контекст клиента, парка ОС, истории и страницы
# ============================================================================

- id: same_query_different_segment
  group: context_personalization
  title: "Один и тот же запрос от клиентов разных сегментов (Гос / Вуз / SMB / Enterprise / ИП)"
  user_goal: "Получить выдачу, сразу соответствующую статусу и закупочным ограничениям своей организации, не проставляя каждый раз 4–5 фильтров вручную."
  examples:
    - "антивирус на 30 пк"
    - "офисный пакет"
    - "операционная система"
    - "видеоконференцсвязь"
    - "почтовый сервер"
    - "резервное копирование"
    - "защита рабочих станций"
    - "электронный документооборот"
    - "корпоративный мессенджер"
  detection: "Широкий или категорийный запрос без явного упоминания сегмента при наличии авторизованного профиля клиента (segment = gov | edu | smb | mid | enterprise | individual)."
  behaviour: "Применить мягкий (или жёсткий для gov по реестру/сертификатам) профиль сегмента в ранжировании и выборе SKU-варианта: edu → академические лицензии, gov → реестр Минцифры + ФСТЭК/госпрайс, smb → лёгкие редакции без порога входа enterprise, enterprise → корпоративные линейки и проектный расчёт, individual → персональные/домашние лицензии. Показать прозрачный бейдж «Учтён профиль: …» с возможностью сбросить."
  data_needed: ["client_profile.segment", "client_profile.preferences", "sku.audience", "families.registry"]
  priority: P0
  wow: "На демо переключаем профиль с «Малый бизнес» на «Поликлиника (Гос, Astra)» и «Вуз» на одном и том же запросе «антивирус на 30 пк» — выдача и цены перестраиваются мгновенно и объяснимо."

- id: os_fleet_auto_filtering
  group: context_personalization
  title: "Автоподстройка выдачи под парк операционных систем клиента"
  user_goal: "Не тратить время на просмотр Windows-only программ, если компания работает на Astra Linux, РЕД ОС, Альт или macOS."
  examples:
    - "удаленный доступ"
    - "антивирус для бизнеса"
    - "pdf редактор"
    - "распознавание документов"
    - "защита от утечек"
    - "резервное копирование серверов"
    - "криптопровайдер"
    - "почтовый клиент"
    - "система видеосвязи"
  detection: "Запрос не содержит явного указания ОС, но в профиле клиента `fleet.os` не включает Windows (например `[astra, linux]` или `[macos, linux]`)."
  behaviour: "Приоритетно ранжировать продукты, совместимые с `fleet.os` клиента; Windows-only решения опускать или скрывать за сбрасываемым чипом «Совместимо с вашим парком: Astra Linux / macOS». На каждой карточке подсветить подтверждённую ОС."
  data_needed: ["client_profile.fleet.os", "families.platforms", "families.compat_ru_os"]
  priority: P0
  wow: "ИТ-компания на macOS/Linux и поликлиника на Astra Linux не видят бесполезных Windows-only позиций в топе и не совершают ошибочных закупок."

- id: proactive_expiring_renewal
  group: context_personalization
  title: "Проактивное продление истекающей лицензии при поиске по категории или вендору"
  user_goal: "Быстро продлить заканчивающуюся лицензию без поиска старого счёта, артикула и количества узлов."
  examples:
    - "антивирус"
    - "касперский"
    - "доктор веб"
    - "р7 офис"
    - "криптопро"
    - "контур экстерн"
    - "кибер бэкап"
    - "битрикс24"
    - "видеоконференцсвязь"
    - "сдача отчетности"
  detection: "У авторизованного клиента в `owned` есть лицензия из запрошенной категории/вендора со сроком `expires_in_days <= 60`."
  behaviour: "Показать сверху компактный блок `my_licenses`: «Истекает через N дней: <Продукт> (<qty> <metric>)» с предсобранной кнопкой «Продлить на 12 мес» и опцией изменить количество. Ниже — обычная выдача каталога."
  data_needed: ["client_profile.owned", "sku.license_action:renewal", "sku.bands"]
  priority: P0
  wow: "Клиент ввёл просто «антивирус», а поиск сам напомнил: «Через 21 день заканчивается Kaspersky Small Office Security на 15 устройств — продлить в 1 клик»."

- id: addon_vs_new_by_ownership
  group: context_personalization
  title: "Автоматическое распознавание докупки (addon) вместо новой базовой поставки"
  user_goal: "Докупить рабочие места к уже купленной системе (1С, KES, nanoCAD, МойОфис), не переплачивая за дублирующую основную поставку."
  examples:
    - "1с лицензии на 10 человек"
    - "1с бухгалтерия 5 пользователей"
    - "касперский 20 узлов"
    - "нанокад 5 лицензий"
    - "мойофис еще 15 мест"
    - "битрикс24 30 пользователей"
    - "р7 офис 10 штук"
    - "кибер бэкап 3 сервера"
  detection: "Запрос указывает продукт/вендора и количество N без явного слова «новая» или «продление», при этом продукт уже есть в `client_profile.owned` с `expires_in_days == null` (бессрочная) или `expires_in_days > 60`."
  behaviour: "Поднять наверх SKU с `license_action=addon` (дополнительные клиентские лицензии / расширение узлов), показать пояснение «У вас уже есть <Продукт> на M мест — подобрано расширение +N мест (ко-терминг)» и оставить вкладку «Новая отдельная лицензия»."
  data_needed: ["client_profile.owned", "sku.license_action:addon", "sku.bands"]
  priority: P0
  wow: "Бухгалтерская фирма с купленной 1С:Бухгалтерией КОРП на «1с лицензии на 10 человек» сразу получает пакет клиентских лицензий, а не вторую коробку программы."

- id: ksos_to_kes_seat_threshold_upgrade
  group: context_personalization
  title: "Автоподсказка перехода на старшую линейку при превышении лимита SMB-продукта"
  user_goal: "Расширить защиту на выросший штат, не упираясь в технические ограничения малого продукта."
  examples:
    - "kaspersky small office security на 30 пк"
    - "ksos 40 компьютеров"
    - "касперский для малого офиса 50 узлов"
    - "антивирус на 30 пк"
    - "1с базовая на 5 пользователей"
    - "битрикс24 базовый на 25 человек"
    - "мойофис домашний на 20 пк"
    - "р7 домашний для офиса 15 мест"
  detection: "Запрошенное количество `qty` превышает максимальный лимит `max_seats` запрошенного (или уже имеющегося у клиента) SMB/home-продукта."
  behaviour: "Показать понятную плашку-совет (например: «Kaspersky Small Office Security поддерживает до 25 устройств — для 30 ПК требуется Kaspersky Endpoint Security для бизнеса (диапазон 25–49 узлов)») и сразу выдать корректный корпоративный SKU с расчётом суммы."
  data_needed: ["families.seat_limits", "client_profile.owned", "sku.bands"]
  priority: P0
  wow: "Предотвращает частую ошибку малого бизнеса и прямо в выдаче конвертирует апсейл с SMB на корпоративную линейку."

- id: category_page_scoped_search
  group: context_personalization
  title: "Контекстный поиск внутри открытой категории каталога"
  user_goal: "Уточнить выбор коротким модификатором («фстэк», «продление 50», «бессрочная», «на линукс»), находясь уже в нужном разделе витрины."
  examples:
    - "фстэк"
    - "реестр минцифры"
    - "продление 50 пк"
    - "бессрочная"
    - "под астра линукс"
    - "на 2 года"
    - "до 5000 рублей"
    - "для вуза"
    - "сетевая лицензия"
    - "в закрытый контур"
  detection: "Передан параметр `category_ctx != null`, а сам запрос содержит только атрибуты/фильтры (без самостоятельного продукта или другой категории)."
  behaviour: "Сохранить область поиска в `category_ctx`, применить извлечённые из запроса фильтры и показать чип «В разделе: <Категория> ×» (с возможностью одним кликом расширить поиск на весь каталог). Если же пользователь ввёл явный продукт из другой категории — автоматически выйти из `category_ctx` с уведомлением."
  data_needed: ["request.category_ctx", "categories", "attribute_extractors"]
  priority: P0
  wow: "Покупатель в разделе «Антивирусы» печатает просто «фстэк 100» и сразу получает сертифицированные антивирусы на 100 узлов — а если введёт «1с бухгалтерия», поиск умнó переключит раздел сам."

- id: account_my_licenses_lookup
  group: context_personalization
  title: "Навигационные запросы к своим лицензиям, заказам и документам в строке поиска"
  user_goal: "Из главной строки поиска мгновенно увидеть свои действующие лицензии, сроки продления и статус счетов."
  examples:
    - "мои лицензии"
    - "что у нас скоро истекает"
    - "когда кончается касперский"
    - "продлить мои подписки"
    - "история заказов"
    - "скачать закрывающие документы"
    - "мои счета на оплату"
    - "список купленного по"
    - "активные ключи компании"
  detection: "Интент `account`: притяжательные местоимения («мои», «наши», «у нас») + сущности ЛК («лицензии», «подписки», «заказы», «счета», «ключи», «истекает», «закрывающие»)."
  behaviour: "Для авторизованного клиента вывести интерактивный блок `my_licenses` со списком его лицензий, отсортированным по `expires_in_days`, и кнопками «Продлить» / «Докупить». Для гостя — предложить войти в профиль (или выбрать демо-профиль)."
  data_needed: ["client_profile.owned", "client_profile.orders", "intent:account"]
  priority: P1
  wow: "Строка поиска превращается в единую точку входа для постоянного B2B-клиента: вбил «что скоро истекает» — увидел все горящие продления компании."

- id: repeat_order_from_history
  group: context_personalization
  title: "Повтор прошлой закупки с изменением масштаба или срока"
  user_goal: "Повторить заказ прошлого года («то же самое, что брали, но на 2 года / на 40 ПК»), не вспоминая точное название редакции."
  examples:
    - "повторить прошлый заказ антивируса"
    - "продлить как в прошлом году на 2 года"
    - "докупить еще 10 таких же лицензий офиса"
    - "такой же бэкап еще на 5 серверов"
    - "повторная закупка криптопро"
    - "продлить всё что брали год назад"
    - "та же версия нанокад еще 5 мест"
    - "продление нашего комплекта"
  detection: "Слова повтора («повторить», «как в прошлом году», «такой же», «наш комплект», «что брали») + наличие истории `client_profile.orders`."
  behaviour: "Найти соответствующий прошлый заказ/позицию в `orders`/`owned`, подставить новую метрику/количество/срок из текущего запроса и сформировать готовый предзаказ с пересчётом цены."
  data_needed: ["client_profile.orders", "client_profile.owned", "sku.bands"]
  priority: P2
  wow: "Максимально сокращает путь повторной B2B-сделки: один запрос вместо переписки с менеджером «пришлите счёт как в прошлом октябре»."

# ============================================================================
# 2. SESSION_REFINEMENT_CHAINS — Многошаговые цепочки запросов в сессии
# ============================================================================

- id: chain_qty_recalculation
  group: session_refinement_chains
  title: "Уточнение количества в следующем запросе сессии («а на 50?», «100 пк»)"
  user_goal: "Прикинуть бюджет на разные варианты штата (30, 50, 100 мест), не перепечатывая длинный запрос целиком."
  examples:
    - "а на 50?"
    - "на 100 пк"
    - "посчитай на 25 человек"
    - "а если 200 узлов"
    - "15 мест"
    - "на 5 серверов"
    - "а на 500 рабочих мест сколько выйдет"
    - "для 12 сотрудников"
  detection: "Короткий эллиптический запрос содержит только число/метрику (и маркер продолжения «а», «если», «на») при активном контексте предыдущего запроса в сессии (`session.last_query`)."
  behaviour: "Унаследовать продукт/категорию и фильтры из `session.last_query`, заменить `qty` и `metric`, переподобрать ценовой диапазон (band) и мгновенно пересчитать итоговую стоимость с бейджем контекста «Пересчитано для: <предыдущий запрос> · 50 ПК»."
  data_needed: ["session_context.last_state", "sku.bands", "qty_extractor"]
  priority: P0
  wow: "Пользователь ищет «касперский продление 30 пк», затем просто пишет «а на 50?» — поиск сам переключает band с 25–49 на 50–99 и показывает более выгодную цену за узел."

- id: chain_cheaper_or_budget_pivot
  group: session_refinement_chains
  title: "Уточнение в сессии по цене («подешевле», «в пределах 100 тыс», «есть аналоги дешевле?»)"
  user_goal: "После просмотра первых цен быстро найти более доступную редакцию или бюджетного вендора в том же классе задач."
  examples:
    - "подешевле"
    - "есть что-то дешевле?"
    - "бюджетный вариант"
    - "а до 50000 рублей"
    - "слишком дорого, что попроще"
    - "более дешевый аналог"
    - "уложиться в 30 тыс"
    - "эконом версия"
  detection: "Сравнительные/ценовые маркеры («подешевле», «дешевле», «дорого», «попроще», «до N руб») без указания категории при наличии `session.last_state`."
  behaviour: "Сохранить категорию и ограничения (ОС, реестр, сертификаты) из прошлого шага, пересортировать внутри релевантной полосы по цене вверх (или применить `price_max`), показать младшие редакции и бюджетных конкурентов, не нарушая обязательных требований."
  data_needed: ["session_context.last_state", "sku.price", "families.editions"]
  priority: P0
  wow: "Живой диалоговый паттерн без навязчивого чат-окна: в той же строке поиска «подешевле» сразу перестраивает витрину под бюджет."

- id: chain_os_or_compliance_pivot
  group: session_refinement_chains
  title: "Добавление платформенного или регуляторного ограничения на втором шаге («а под астру?», «из реестра»)"
  user_goal: "Сузить уже найденную подборку ПО до совместимости с российской ОС или наличия сертификатов."
  examples:
    - "а под астру?"
    - "только из реестра"
    - "с сертификатом фстэк"
    - "на ред ос работает?"
    - "под макос"
    - "чтобы без ндс"
    - "для 44-фз"
    - "на линукс"
    - "в закрытый контур без облака"
  detection: "Фрагмент-модификатор ОС/комплаенса/развёртывания без указания категории/продукта при непустом `session.last_state`."
  behaviour: "Наложить новый фильтр поверх `session.last_state`, отобразить накопленные чипы фильтров и объяснить, какие позиции остались, а какие отсеялись (если отсеялись все — предложить ближайшие совместимые альтернативы)."
  data_needed: ["session_context.last_state", "families.compat_ru_os", "families.registry", "families.certs"]
  priority: P0
  wow: "Наглядная демонстрация памяти сессии: «резервное копирование» → «под астру» → «с фстэк» за 3 коротких ввода."

- id: chain_term_or_model_pivot
  group: session_refinement_chains
  title: "Смена срока или модели лицензирования в цепочке («а на 3 года?», «а бессрочную?»)"
  user_goal: "Сравнить стоимость годовой подписки, 2–3-летнего контракта и бессрочной лицензии для выбранного продукта."
  examples:
    - "а на 2 года?"
    - "на 3 года сколько"
    - "а бессрочная есть?"
    - "а по подписке"
    - "а сетевая плавающая"
    - "в коробке а не электронная"
    - "с расширенной поддержкой"
    - "а на 36 месяцев"
  detection: "Указание срока, модели, метрики или способа поставки без названия продукта при активном `session.last_state`."
  behaviour: "Переключить SKU-варианты текущего продукта/подборки на новый срок/модель и показать сравнение выгоды (например, «На 3 года выгоднее годового продления»). Если бессрочной модели у продукта не существует — честно объяснить это."
  data_needed: ["session_context.last_state", "sku.term_months", "sku.license_model", "sku.metric"]
  priority: P1
  wow: "Позволяет закупщику в 2 секунды сравнить CAPEX (бессрочная) vs OPEX (подписка на 1/2/3 года) прямо из поиска."

- id: chain_reformulation_after_failure
  group: session_refinement_chains
  title: "Переформулировка после нулевой или нерелевантной выдачи"
  user_goal: "Найти нужный продукт со второй попытки другими словами, если первая формулировка (жаргон, редкий бренд, узкий термин) не сработала."
  examples:
    - "файрвол -> межсетевой экран"
    - "защита от шифровальщиков -> антивирус edr"
    - "программа для схем -> редактор диаграмм"
    - "терминалка -> удаленный рабочий стол"
    - "аудит пк -> инвентаризация по itam"
    - "облачный диск корпоративный -> файловое хранилище корпоративное"
    - "софт для кс2 -> сметная программа"
    - "контроль сотрудников -> учет рабочего времени"
  detection: "Два запроса в одной сессии с интервалом <= 120 секунд, где первый дал `zero_result` или `exit_without_click`, а второй привёл к `click` / `cart`."
  behaviour: "Для пользователя — не переносить сломанные фильтры от первого неудачного запроса; для аналитики — связать пару `(q1 -> q2)` событием `reformulate` и автоматически выдвинуть кандидата на синоним/use_case для контент-менеджера."
  data_needed: ["session_context.history", "analytics.events:reformulate", "agent.insight:add_synonym"]
  priority: P0
  wow: "Главный механизм самообучения «Кузницы Softline»: неудачные переформулировки превращаются в готовые предложения синонимов для контент-менеджера."

- id: chain_competitor_alternative_pivot
  group: session_refinement_chains
  title: "Переход к альтернативному вендору в сессии («что вместо этого?», «другой вендор»)"
  user_goal: "После просмотра карточки продукта оценить 2–3 прямых конкурентов того же класса и уровня комплаенса."
  examples:
    - "что вместо этого"
    - "аналоги подешевле"
    - "другой производитель"
    - "не касперский"
    - "а конкуренты какие есть"
    - "альтернативы из реестра"
    - "кто еще делает такое по"
    - "сравнить с конкурентами"
  detection: "Запрос-переход на альтернативы без названия исходного продукта при наличии просмотренного/найденного семейства в `session.last_state`."
  behaviour: "Исключить текущего вендора из топа, подобрать прямых конкурентов из той же листовой категории и блока `analogs` с сохранением ограничений (ОС, реестр, сертификаты) и предложить быструю таблицу сравнения."
  data_needed: ["session_context.last_state", "categories", "analogs", "families"]
  priority: P1
  wow: "Закупщик для тендера по 44-ФЗ в один клик собирает пул из 3 сопоставимых российских альтернатив."

- id: chain_narrowing_from_broad_to_sku
  group: session_refinement_chains
  title: "Пошаговое сужение от широкой проблемы до конкретного SKU через чипы и подзапросы"
  user_goal: "Пройти путь от неопределённого запроса («защита офиса») до готового SKU в корзине за 2–3 шага."
  examples:
    - "защита информации -> антивирус -> на 50 пк -> продление"
    - "1с -> 1с бухгалтерия -> проф -> +5 лицензий"
    - "сапр -> строительный bim -> сетевая лицензия"
    - "российское по -> операционная система -> астра линукс -> фстэк"
    - "офис -> р7 офис -> профессиональный -> 20 мест"
    - "бэкап -> для виртуализации -> на 4 хоста"
    - "удаленка -> для техподдержки -> под linux"
    - "почта -> на свой сервер -> на 200 ящиков"
  detection: "Последовательность 2–4 шагов (текстовый ввод или клики по уточняющим чипам `chip`), где каждый шаг добавляет сущность или атрибут."
  behaviour: "На каждом шаге показывать не более 4–6 самых информативных уточняющих чипов (счётчик товаров на чипе), чтобы пользователь не попадал в пустую выдачу."
  data_needed: ["session_context.filters", "facet_counts", "analytics.events:chip"]
  priority: P1
  wow: "Чипы с живыми счётчиками товаров исключают «слепую фильтрацию» в ноль."

- id: chain_upsell_companion_addition
  group: session_refinement_chains
  title: "Последовательный добор совместимых продуктов в стек в рамках одной сессии"
  user_goal: "Собрать совместимую связку за один визит: сначала выбрали ОС (Astra Linux), следом ищут офис, антивирус, бэкап и СКЗИ под неё."
  examples:
    - "астра линукс 50 шт -> офис к ней"
    - "криптопро -> токен к нему"
    - "windows server 2022 -> клиентские лицензии"
    - "1с бухгалтерия -> сдача отчетности"
    - "нанокад -> модуль спдс"
    - "ред ос -> антивирус совместимый"
    - "postgres pro -> бэкап для нее"
    - "битрикс24 -> телефония"
  detection: "Второй запрос в сессии ссылается местоимением («к ней», «к нему», «для неё», «совместимый») или ищет смежную категорию сразу после добавления/просмотра якорного продукта."
  behaviour: "Извлечь якорный продукт из сессии/корзины, автоматически отфильтровать вторую выдачу по совместимости с якорным продуктом (ОС, БД, интеграция) и подсветить «Совместимо с выбранным ранее <Продукт>»."
  data_needed: ["session_context.cart_and_views", "families.compat_ru_os", "families.integrations"]
  priority: P1
  wow: "Покупатель собирает непротиворечивый стек: выбрал Astra Linux → следом вбил «офис к ней» и получил только совместимые Linux-редакции."

# ============================================================================
# 3. NON_LIST_ANSWERS — Сценарии, где правильный ответ НЕ просто список карточек
# ============================================================================

- id: spec_list_messy_email_paste
  group: non_list_answers
  title: "Вставка «грязной» заявки из письма, Excel или 1С с лишними колонками и шумом"
  user_goal: "Скопировать фрагмент письма от ИТ-отдела или таблицы закупки как есть (с нумерацией, ценами, «срочно!», «шт.», комментариями) и получить разобранную смету."
  examples:
    - "Добрый день! Прошу выставить счет:\n1. Astra Linux SE Воронеж - 25 шт.\n2. Р7-Офис Проф - 25 лицензий\n3. Касперский KES продление - 25 узлов"
    - "Позиция\tКол-во\tСрок\nКриптоПро CSP 5.0\t10\tбессрочно\nРутокен ЭЦП 3.0\t10\t-\nКонтур.Диадок\t1\t12 мес"
    - "нужно срочно купить: dr web 40 пк на год (продление!), мой офис стандартный 40 шт, кибер бэкап 2 сервера — бюджет до 400к"
    - "№1) nanoCAD 24 - 4 сетевых\n№2) Renga - 2 шт\n№3) Гранд-Смета - 1 шт"
    - "На филиал в Казани:\n- Windows 11 Pro (ESD) 12 шт\n- 1С Бухгалтерия ПРОФ 1 шт + 5 доплицензий\n- Ассистент 2 подключения"
    - "KL4867RAQFR - 30 шт\nР7-Офис (реестр) - 30 шт\nАльт Рабочая станция - 30 шт"
    - "1. UserGate NGFW (на 200 юзеров)\n2. Secret Net Studio 200 АРМ\n3. VipNet Client 50 шт"
    - "Продление: Контур.Экстерн 1 шт; 1С ИТС ПРОФ 12 мес; КриптоПро 15 шт"
  detection: "Многострочный ввод (`\n`, `\t`), нумерация/маркеры списка, приветствия/служебные фразы («прошу счет», «на филиал») и 2+ позиции с числами."
  behaviour: "Очистить ввод от приветствий и шума, разбить на строки спецификации, для каждой строки подобрать лучший SKU + альтернативу + флаг уверенности (найдено точно / требует уточнения / нет в каталоге), вывести блок `spec` с итоговой суммой, НДС/без НДС и кнопками «Всё в корзину» и «Экспорт сметы / КП»."
  data_needed: ["spec_parser", "sku_matcher", "bundle_calculator"]
  priority: P0
  wow: "Реальная боль любого B2B-закупщика: вставил кусок письма с приветствием и буллетами — получил готовую интерактивную смету за 1 секунду."

- id: tender_tz_fragment_paste
  group: non_list_answers
  title: "Вставка обезличенного фрагмента ТЗ из тендера (44-ФЗ / 223-ФЗ)"
  user_goal: "Понять, какие конкретные продукты из каталога соответствуют формальным техническим требованиям тендерной документации (где бренды указывать нельзя)."
  examples:
    - "Средство антивирусной защиты конечных точек, наличие в ЕРРП, сертификат ФСТЭК, поддержка ОС Astra Linux, 100 узлов"
    - "Офисный пакет для редактирования текстов и таблиц, реестр Минцифры, работа на Linux и Windows, бессрочная лицензия"
    - "Система резервного копирования виртуальных машин и СУБД PostgreSQL, отечественное ПО, лицензирование по хостам"
    - "Программный комплекс видеоконференцсвязи, развертывание on-premise, не менее 100 участников, запись, ЕРРП"
    - "Межсетевой экран нового поколения с функцией VPN по ГОСТ, сертификат ФСТЭК и ФСБ, для объектов КИИ"
    - "Система управления базами данных на базе PostgreSQL, сертификат ФСТЭК 4 УД, поддержка кластеризации"
    - "Средство защиты информации от несанкционированного доступа для АРМ, сертификат ФСТЭК, совместимость с РЕД ОС"
    - "Система автоматизированного проектирования 2D/3D с нативной поддержкой формата DWG, ЕРРП, сетевая лицензия"
  detection: "Длинный канцелярский запрос (10+ слов) без имени вендора, но с высокой плотностью технических атрибутов (класс ПО + ЕРРП + ФСТЭК/ФСБ + ОС + метрика)."
  behaviour: "Извлечь структурированный чек-лист требований из текста ТЗ (показать его пользователю в виде галочек «Распознанные требования ТЗ») и вывести только продукты, закрывающие максимум требований, с колонкой соответствия по каждому пункту."
  data_needed: ["attribute_extractors", "compliance", "families.certs", "families.compat_ru_os", "families.formats"]
  priority: P0
  wow: "Закупщик копирует абзац из ЕИС (zakupki.gov.ru) — система сама разбирает его на 5 фильтров и показывает матрицу соответствия."

- id: license_audit_deficit_check
  group: non_list_answers
  title: "Проверка достаточности и корректности лицензирования перед аудитом"
  user_goal: "Убедиться, не нарушает ли компания условия лицензирования (смены, терминальный сервер, перенос ключа, домашняя версия в офисе)."
  examples:
    - "можно ли использовать домашний касперский в офисе юрлица"
    - "хватит ли 10 лицензий 1с на 30 человек в три смены"
    - "нужны ли отдельные cal лицензии для подключения к rdp"
    - "можно ли перенести oem лицензию windows на новый компьютер"
    - "сколько лицензий windows server нужно на 2 процессора по 16 ядер"
    - "нарушение ли ставить бесплатный антивирус на компьютеры ооо"
    - "нужна ли лицензия криптопро на каждого пользователя на терминальном сервере"
    - "можно ли купить академическую лицензию для коммерческого учебного центра"
  detection: "Вопросительные конструкции про допустимость/достаточность («можно ли», «хватит ли», «нужны ли», «нарушение ли», «сколько лицензий нужно») + лицензионные условия."
  behaviour: "Вывести блок `answer` с чётким ответом из `kb/faq.yaml` (без выдумывания юридических штрафов и несуществующих статей), пояснить правильную схему лицензирования и сразу предложить корректные SKU (например, бизнес-версию вместо домашней или RDS CAL)."
  data_needed: ["faq", "families.license", "sku"]
  priority: P1
  wow: "Снимает риски штрафов и ошибок при закупке: честно предупреждает, что домашние/академические ключи юрлицу не подходят, и даёт правильный вариант."

- id: budget_estimation_tco_query
  group: non_list_answers
  title: "Предварительная оценка бюджета проекта и ТСО («сколько стоит перевести офис на российское ПО?»)"
  user_goal: "Получить порядок бюджета для защиты перед финансовым директором ещё до выбора конкретных артикулов."
  examples:
    - "сколько стоит перевести офис на 50 пк на российское по"
    - "бюджет на импортозамещение 100 рабочих мест"
    - "ориентировочная стоимость оснащения 20 рабочих мест"
    - "сколько стоит лицензирование 1с на 15 человек под ключ"
    - "смета на защиту персональных данных 152 фз для клиники"
    - "во сколько обойдется переход с windows и office на астру и р7 30 пк"
    - "бюджет на информационную безопасность для малого бизнеса"
    - "стоимость рабочего места конструктора в год"
  detection: "Вопросы стоимости комплексной задачи («сколько стоит», «бюджет на», «смета на», «во сколько обойдется») + масштаб (N ПК/мест) или роль/миграция."
  behaviour: "Показать блок `kit` / `spec` с ориентировочной сметой по слотам (ОС + Офис + Антивирус + профильное ПО) в 2–3 вариантах (Эконом / Оптимальный / Сертифицированный ФСТЭК) с суммой и пометкой «Ориентировочный расчёт по прайсу каталога» + кнопка «Получить официальное КП»."
  data_needed: ["roles", "industries", "bundles", "sku.price", "sku.bands"]
  priority: P1
  wow: "Финансовый или ИТ-директор за 5 секунд получает внятную вилку бюджета для защиты инвестпроекта."

- id: manager_presale_lead_routing
  group: non_list_answers
  title: "Маршрутизация сложного проектного запроса на пресейл-менеджера (форма лида)"
  user_goal: "Не продираться через тысячи SKU, когда нужен индивидуальный проектный расчёт (500+ узлов, спеццены, внедрение, ФСТЭК-аттестация, ПАК)."
  examples:
    - "нужен расчет кп на 2000 рабочих мест астра линукс и ald pro"
    - "внедрение siem и soc под ключ для завода"
    - "индивидуальные условия закупки kaspersky на 3000 узлов"
    - "аттестация испдн и поставка сзи под ключ"
    - "миграция почты exchange на 1500 ящиков с услугами"
    - "подбор пак ngfw для 40 филиалов"
    - "нужен пресейл по импортозамещению виртуализации vmware 50 хостов"
    - "спеццена на продление 1000 лицензий мой офис"
  detection: "Высокий объём (`qty >= 250`), enterprise-категории (`price_on_request=true`), либо явный запрос проектной услуги («под ключ», «расчет КП», «спеццена», «внедрение», «пресейл», «аттестация»)."
  behaviour: "Показать релевантные продукты и одновременно выделить блок `lead` с уже предзаполненными параметрами из запроса и профиля клиента (продукт, объём, ОС, требования ФСТЭК/ЕРРП), а в аналитику менеджера e-com отправить событие `hot_lead`."
  data_needed: ["sku.price_on_request", "client_profile", "analytics.events:lead"]
  priority: P0
  wow: "Крупный лид не уходит в пустоту: менеджер e-com видит структурированный бриф и горячий сигнал прямо в панели аналитики."

- id: honest_no_impossible_requirement
  group: non_list_answers
  title: "Честное «нет» при противоречивом или невыполнимом требовании + рабочий выход"
  user_goal: "Не получить мусорную выдачу и не быть обманутым, если сочетание требований физически или юридически не существует."
  examples:
    - "microsoft office из реестра минцифры"
    - "windows 11 с сертификатом фстэк и реестром рф"
    - "бессрочная лицензия антивируса касперского навсегда"
    - "autocad официальная поставка по 44 фз"
    - "бесплатная 1с бухгалтерия корп для ооо"
    - "vmware vsphere из реестра отечественного по"
    - "adobe photoshop российский аналог с сертификатом фсб"
    - "oracle database без ндс по реестру минцифры"
  detection: "Конфликт несовместимых ограничений: зарубежный/ушедший продукт + `registry=true`; антивирус + `model=perpetual`; ушедший вендор + `44-ФЗ`."
  behaviour: "Вывести честный блок `answer` / `not_in_catalog`: чётко объяснить противоречие (например, «Microsoft Office не входит в Единый реестр российского ПО и не может закупаться по 44-ФЗ в рамках нацрежима»), и сразу ниже предложить два корректных выхода: (1) реестровые аналоги (Р7-Офис, МойОфис) или (2) доступные позиции без ограничения реестра (если уместно)."
  data_needed: ["families.registry", "families.license.models", "vendors.origin", "analogs"]
  priority: P0
  wow: "Высший класс доверия в B2B: поиск не врёт и не подсовывает нерелевантный товар ради галочки, а грамотно разводит противоречие."

- id: clarify_before_commit_ambiguous_task
  group: non_list_answers
  title: "Уточняющие чипы при слишком широкой или многозначной бизнес-задаче"
  user_goal: "Быстро сузить размытый запрос в 1 клик, вместо того чтобы листать 5 страниц разнородных товаров."
  examples:
    - "защита сети"
    - "автоматизация бизнеса"
    - "система для завода"
    - "по для удаленной работы"
    - "защита данных"
    - "корпоративная связь"
    - "облако для компании"
    - "контроль доступа"
    - "информационная безопасность"
  detection: "Запрос попадает в 3+ непересекающиеся листовые категории одной или разных групп и не содержит уточняющих атрибутов."
  behaviour: "Показать блок `clarify` с 4–6 понятными направлениями-чипами (например, для «защита сети»: «Межсетевой экран (NGFW)», «ГОСТ VPN для филиалов», «Защита веб-приложений (WAF)», «Мониторинг сети / SIEM», «Сканер уязвимостей»), а ниже — по 1–2 флагманских решения из топовых направлений."
  data_needed: ["categories", "ambiguity_rules", "client_profile"]
  priority: P1
  wow: "Вместо каши из VPN, DLP, антивирусов и токенов — структурированная развилка на понятном бизнесу языке."

- id: migration_checklist_answer
  group: non_list_answers
  title: "Информационный ответ о порядке миграции и требованиях перехода (crossgrade / импортозамещение)"
  user_goal: "Понять, какие шаги, лицензии и подтверждающие документы нужны для перехода с зарубежного или конкурирующего продукта."
  examples:
    - "как перейти с eset на касперский со скидкой"
    - "какие документы нужны для миграции с другого антивируса"
    - "как перевести домен active directory на астра линукс"
    - "что нужно для перехода с microsoft exchange на российскую почту"
    - "можно ли мигрировать с vmware на российский гипервизор без переустановки"
    - "порядок перехода с 1с проф на корп"
    - "как перенести макросы excel в р7 офис"
    - "условия конкурентного перехода мой офис"
  detection: "Вопросительные конструкции («как перейти», «какие документы нужны», «что нужно для перехода», «условия перехода») + маркер миграции/crossgrade."
  behaviour: "Показать краткий структурированный ответ `answer` из `kb/faq.yaml` (чек-лист шагов и документов) + блок `analogs` / `products` с целевыми лицензиями crossgrade и услугами миграции."
  data_needed: ["faq", "analogs", "sku.license_action:crossgrade", "categories:tech_support"]
  priority: P1
  wow: "Закрывает главный барьер перед миграцией — страх «а как мы это перенесём и оформим»."

- id: post_purchase_activation_support_query
  group: non_list_answers
  title: "Сервисные и постпродажные вопросы в поиске (активация, дистрибутив, ЭДО, возврат)"
  user_goal: "Получить быстрый ответ по работе с уже купленной или планируемой лицензией, не дозваниваясь на горячую линию."
  examples:
    - "как активировать электронный ключ esd"
