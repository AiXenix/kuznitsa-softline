# Демо-профили клиентов интернет-магазина ПО (Кузница Softline, поток Neon-2)
# Используются для демонстрации персонализации выдачи, контекстного подбора лицензий,
# сценария продления истекающих лицензий и оценки качества поиска (eval/queries.*.jsonl).
#
# Поле `family`: id семейства из design/work/families_index.tsv (kb/families/).
# Поле `edition`: id редакции из design/work/families_index.tsv (если редакция однозначно определяется), иначе исходное описание.
# Поле `industry`: соответствует id из kb/industries.yaml.
# Поле `expires_in_days`: положительное число — дней до окончания лицензии, null — бессрочная.

profiles:
  - id: guest
    title: "Гость — неавторизованный посетитель без истории покупок"
    demo: true
    segment: null
    industry: null
    size_seats: null
    region: "Москва"
    fleet:
      os: []
      servers: 0
      notes: "Инфраструктура неизвестна"
    preferences:
      registry_required: false
      certs_required: []
      budget: medium
    owned: []
    orders: []
    showcase:
      - q: "антивирус на 30 пк"
        expect: "Новые коммерческие лицензии (action=new) на диапазон 25–49 узлов: Kaspersky Endpoint Security, Dr.Web Enterprise Security Suite, PRO32; без домашних версий и без принудительного переключения на продление."
        why: "У гостя нет истории владения, поэтому базовый коммерческий сценарий — первичная покупка (new) для бизнеса."
      - q: "офисный пакет"
        expect: "Сбалансированная выдача российских и доступных коммерческих офисных пакетов (Р7-Офис, МойОфис, Microsoft Office — если есть в каталоге) + уточняющие чипы: «Для бизнеса», «Реестр Минцифры», «Бессрочная»."
        why: "Без профиля сегмента и ОС нельзя жёстко отсекать платформы или реестр; поиск даёт лучший базовый топ и быстрые фильтры."
      - q: "продление касперский"
        expect: "Позиции продления Kaspersky для бизнеса с предложением уточнить количество узлов и срок (или войти в личный кабинет, чтобы подставить текущие лицензии)."
        why: "У гостя нет блока «Мои лицензии», поэтому система мягко предлагает указать масштаб или авторизоваться."
      - q: "софт"
        expect: "Навигационная витрина категорий B2B (ИБ, ОС, Офис, 1С, ВКС, Виртуализация, САПР, Бэкап) и быстрые сценарии без случайных карточек SKU."
        why: "Слишком общий запрос от неизвестного пользователя должен вести к навигации, а не к случайному списку лицензий."

