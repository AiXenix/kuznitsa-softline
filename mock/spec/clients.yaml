# 2. Детализация профилей парка ОС (маппинг на массив fleet.os)
fleet_os_profiles:
  windows_only:      {os: [windows], weights: {astra: 0, redos: 0, alt: 0}}
  windows_linux_mix: {os: [windows, linux]}
  windows_macos_mix: {os: [windows, macos]}
  ru_linux_only:     {os_choices: [[astra], [redos], [alt], [astra, redos]], probs: [0.55, 0.22, 0.13, 0.10]}
  ru_linux_mix:      {os_choices: [[astra, windows], [redos, windows], [alt, windows]], probs: [0.55, 0.28, 0.17]}

