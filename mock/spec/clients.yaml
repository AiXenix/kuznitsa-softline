# Спецификация генерации синтетических B2B-клиентов («Кузница Softline»)
# Дополняет 11 демо-профилей из mock/spec/profiles.yaml до 311 аккаунтов.
# Все industry id строго соответствуют kb/industries.yaml (28 отраслей).
# Все названия компаний вымышленные (mock: true).

meta:
  version: "1.0"
  author: "AiXenix (Neon-2)"
  seed_offset: 2
  demo_profiles_file: "mock/spec/profiles.yaml"
  demo_profiles_count: 11
  synthetic_clients_count: 300
  total_clients_count: 311
  history_months: 24
  id_pattern: "cli_{seq:04d}"     # cli_0001 .. cli_0300

