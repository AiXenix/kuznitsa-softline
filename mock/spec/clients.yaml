# 4. Шаблоны вымышленных названий (гарантированно синтетические, без совпадений с брендами)
company_naming:
  legal_forms:
    smb:        ["ООО"]
    mid:        ["ООО", "АО"]
    enterprise: ["АО", "ПАО", "ГК"]
    gov:        ["ГБУЗ", "ГКУ", "МКУ", "ФГБУ"]
    edu:        ["ФГБОУ ВО", "ГАПОУ", "АНО ДПО", "МАОУ"]
    individual: ["ИП", "Частный специалист"]
  stems_by_industry:
    default: ["Вектор", "Импульс", "Горизонт", "Атлант", "Меридиан", "Спектр", "Орбита", "Кварц", "Сигма", "Прогресс", "Контур-Плюс", "Сфера", "Орион", "Базис-Трейд", "Арктика", "УралТех", "ВолгаПром", "СибирьЛогистик", "БалтСтрой", "ЮгАгро"]
    healthcare: ["Городская поликлиника", "МедЦентр", "Диагностический центр", "Клиническая больница"]
    education: ["Политехнический колледж", "Технологический университет", "Учебный центр", "Инженерный лицей"]
    gov_public_sector: ["Центр цифровизации", "Управление ЖКХ", "МФЦ района", "Департамент имущественных отношений"]

# 5. Типовые пакеты купленного ПО (owned) и история заказов (24 месяца)
portfolio_rules:
  # Какой набор категорий вероятен в owned у каждого сегмента
  core_categories_by_segment:
    smb:        [endpoint_security, office_suite, accounting, tax_reporting_edo, crypto_skzi]
    mid:        [endpoint_security, office_suite, backup_recovery, ngfw_vpn, accounting, remote_desktop, vks_webinars]
    enterprise: [endpoint_security, desktop_os_ru, office_suite, server_virtualization, backup_recovery, ngfw_vpn, siem_soc, dlp, rdbms, sed_ecm]
    gov:        [desktop_os_ru, endpoint_security, office_suite, nsd_access_control, crypto_skzi, ngfw_vpn, backup_recovery, directory_services]
    edu:        [desktop_os_ru, office_suite, endpoint_security, vks_webinars, lms_elearning]
    individual: [home_antivirus, office_suite, pdf_editors, raster_photo]

  # Согласованность владения и заказов:
  # - Каждая позиция в owned имеет соответствующий заказ в orders за последние 12–24 мес.
  # - Для подписок 12 мес. purchased_days_ago = 365 - expires_in_days (плюс опциональный предыдущий заказ за 2 года до этого).
  # - Для бессрочных лицензий expires_in_days = null, purchased_days_ago ∈ [60..700].
  term_distribution:
    subscription_12m: 0.68
    subscription_24m: 0.14
    subscription_36m: 0.06
    perpetual: 0.12

  # Когорта истекающих лицензий (синхронизировано с INS-17 в analytics.md!)
  expiring_cohort_target:
    # 10 из 11 демо-профилей (все кроме guest) уже имеют истекающие лицензии в окне 14..55 дней.
    # Среди 300 синтетических клиентов ровно 24 компании получают 1–2 контракта с expires_in_days ∈ [14..45]
    # (итого 10 демо + 24 синтетических = 34 клиента, ~48 контрактов, суммарный потенциал продления ~4.85 млн ₽).
    synthetic_clients_in_14_45d_window: 24
    segment_mix_in_cohort: {smb: 10, mid: 8, enterprise: 3, gov: 2, edu: 1}
    other_subscriptions_expires_in_days: {min: 46, max: 350}
