    - {category: rdbms, families: [postgres_pro, tantor_db], reason: "Надёжная российская СУБД для развёртывания корпоративных приложений на сервере."}
  note: "Инфраструктурная обвязка серверов МСВСфера"

- id: cs_aurora_mobile_mdm
  when: {categories: [mobile_os], families: []}
  suggest:
    - {category: crypto_skzi, families: [cryptopro_csp, vipnet_client], reason: "Мобильный криптопровайдер нужен для электронной подписи и защищённого VPN на устройствах с ОС «Аврора»."}
    - {category: corporate_messengers, families: [express_messenger, vk_teams], reason: "Защищённый корпоративный мессенджер позволяет сотрудникам в полях безопасно обмениваться данными."}
    - {category: mail_servers, families: [rupost, myoffice_mail], reason: "Корпоративная почта интегрируется с мобильными рабочими местами в едином контуре."}
  note: "Прикладные сервисы и защита для российских мобильных ОС"

- id: cs_r7_office_addons
  when: {categories: [], families: [r7_office]}
  suggest:
    - {category: pdf_editors, families: [contentreader_pdf, master_pdf_editor], reason: "Редактор PDF с OCR дополняет Р7-Офис распознаванием сканов и сборкой договоров."}
    - {category: text_editors, families: [paratype_fonts], reason: "Официальные российские шрифты сохраняют разметку старых документов при переходе на Р7-Офис."}
    - {category: translation_dictionaries, families: [promt_translation], reason: "Офлайн-переводчик позволяет переводить документы прямо внутри рабочего контура без утечек."}
    - {category: e_signature, families: [cryptoarm_gost, cryptopro_dss], reason: "Подписание подготовленных в Р7-Офис документов квалифицированной электронной подписью."}
  note: "Дополнения к офисному пакету Р7-Офис"

- id: cs_myoffice_suite_addons
  when: {categories: [], families: [myoffice_standard, myoffice_professional]}
  suggest:
    - {category: mail_servers, families: [myoffice_mail], reason: "Почтовый сервер МойОфис объединяет редакторы, почту и календарь в одной экосистеме."}
    - {category: corporate_messengers, families: [myoffice_squadus], reason: "Корпоративный мессенджер Squadus добавляет чаты и видеозвонки к пакету МойОфис."}
    - {category: pdf_editors, families: [contentreader_pdf, master_pdf_editor], reason: "Инструмент для полноценной правки PDF и распознавания сканов в дополнение к редакторам."}
    - {category: text_editors, families: [paratype_fonts], reason: "Корпоративная лицензия на шрифты обеспечивает корректное отображение бланков и договоров."}
  note: "Экосистема и дополнения к МойОфис"

- id: cs_yandex_360_addons
  when: {categories: [], families: [yandex_360]}
  suggest:
    - {category: task_project_trackers, families: [yandex_tracker], reason: "Трекер задач органично дополняет почту, диск и календарь Яндекс 360 для командной работы."}
    - {category: bi_analytics, families: [yandex_datalens], reason: "Облачная аналитика позволяет строить дашборды по рабочим данным компании."}
    - {category: endpoint_security, families: [kaspersky_kes_cloud, kaspersky_kesb], reason: "Антивирус защищает устройства сотрудников при работе с облачными файлами и почтой."}
  note: "Сопутствующие сервисы для пользователей Яндекс 360"

# --- 2. 1С, БУХГАЛТЕРИЯ, ЭДО И ТОРГОВЛЯ (10) ---

