# Расширение правил сопутствующих товаров «С этим обычно берут» (Кузница Softline, раунд K2b)
# Соответствует схеме kb/SCHEMA.md и формату kb/crosssell.yaml.
# Все id категорий — листовые из design/work/kb_categories_r3.tsv; все id семейств — из design/work/kb_families_r3.tsv (catalog: yes).
# Только реальные дополнения и связки без заменителей и конкурентов.
# Всего новых правил: 60.

# --- 1. ОС, ОФИС И РАБОЧИЕ МЕСТА (8) ---

- id: cs_windows_server_rds_terminal
  when: {categories: [], families: [windows_server_rds_cal]}
  suggest:
    - {category: server_os, families: [windows_server_cal], reason: "Для подключения к терминальному серверу помимо RDS CAL требуются базовые клиентские лицензии Windows Server CAL."}
    - {category: iam_pam_mfa, families: [multifactor_mfa, indeed_am, avanpost_fam], reason: "Двухфакторная аутентификация защищает опубликованный терминальный доступ от подбора паролей."}
    - {category: endpoint_security, families: [kaspersky_kesb, drweb_enterprise_security_suite], reason: "Серверный антивирус защищает терминальные сессии от шифровальщиков и заражения общих папок."}
  note: "Доукомплектование терминального сервера Windows RDS"

- id: cs_windows_server_cal_addon
  when: {categories: [], families: [windows_server_cal]}
  suggest:
    - {category: terminal_access, families: [windows_server_rds_cal], reason: "Если сотрудники работают на сервере по RDP с 1С или приложениями, дополнительно нужны терминальные лицензии RDS CAL."}
    - {category: backup_recovery, families: [cyber_backup, handy_backup], reason: "Резервное копирование защитит файловые шары и контроллер домена Windows Server от сбоев."}
    - {category: endpoint_security, families: [kaspersky_kesb, drweb_enterprise_security_suite], reason: "Антивирусная защита сервера обязательна при росте числа подключённых пользователей."}
  note: "Расширение клиентских подключений Windows Server"

- id: cs_rosa_chrome_ecosystem
  when: {categories: [], families: [rosa_chrome]}
  suggest:
    - {category: office_suite, families: [r7_office, myoffice_standard], reason: "Совместимый российский офисный пакет для ежедневной работы с документами в РОСА Хром."}
    - {category: endpoint_security, families: [kaspersky_kesb, drweb_enterprise_security_suite], reason: "Антивирус с поддержкой Linux защищает рабочие станции и серверы РОСА."}
    - {category: backup_recovery, families: [cyber_backup, rubackup], reason: "Регулярное резервное копирование пользовательских данных и серверов на базе РОСА."}
  note: "Комплектование рабочих мест на ОС РОСА"

- id: cs_msvsphere_server_stack
  when: {categories: [], families: [msvsphere_os]}
  suggest:
