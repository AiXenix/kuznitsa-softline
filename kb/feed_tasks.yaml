# Раздел привязывается к заголовку загруженного дерева. В каждой фразе
# важны все перечисленные леммы; порядок и посторонние слова роли не играют.
- id: compression
  sections: [Архиваторы]
  phrases: [заархивировать, архивировать, запаковать файлы, сжать документы, сжать файлы, упаковать в архив]
- id: crm
  sections: [CRM/ERP-системы, CRM системы]
