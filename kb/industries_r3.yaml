  aliases: ["по для холдинга с филиалами", "софт для группы компаний", "программы для распределенного холдинга", "что нужно холдингу с филиальной сетью", "комплект по для крупной группы компаний", "автоматизация филиальной сети по", "единый ит стек для холдинга", "софт для корпорации с филиалами", "холдинг с филиалами программы"]
  compliance: [fz152_pdn]
  slots:
    - {category: finance_budgeting, must: true, families: [onec_holding, optimacros, project_expert], products: ["1С:Управление холдингом 8", "Optimacros"], note: "Централизованное казначейство, консолидация отчётности юрлиц и единый бюджет группы."}
    - {category: erp_systems, must: true, families: [onec_erp, galaktika_erp], products: ["1С:ERP 2", "Галактика ERP"], note: "Сквозное управление ресурсами, закупками и межфирменными операциями холдинга."}
    - {category: sed_ecm, must: true, families: [directum_rx, onec_docflow, docsvision], products: ["Directum RX", "1С:Документооборот"], note: "Единое согласование договоров, приказов и реестр доверенностей по всем филиалам."}
    - {category: directory_services, must: true, families: [ald_pro, red_adm, alt_domain], products: ["ALD Pro", "РЕД АДМ", "Альт Домен"], note: "Иерархическое управление доменом, учётными записями и политиками в филиальной сети."}
    - {category: ngfw_vpn, must: false, families: [usergate_ngfw, continent_ngfw, vipnet_coordinator], products: ["UserGate NGFW", "Континент 4", "ViPNet Coordinator"], note: "Объединение филиалов в единую защищённую корпоративную сеть VPN."}
    - {category: bi_analytics, must: false, families: [visiology_bi, foresight_analytics, polymatica_bi], products: ["Visiology", "Форсайт", "Polymatica BI"], note: "Сводная аналитика по всем дочерним обществам и региональным подразделениям."}
    - {category: itsm_service_desk, must: false, families: [simpleone_itsm, naumen_smp, inframanager], products: ["SimpleOne ITSM", "Naumen SMP"], note: "Единый центр ИТ-поддержки и управления заявками сотрудников по всей стране."}
    - {category: endpoint_security, must: false, families: [kaspersky_kesb, kaspersky_symphony_xdr, drweb_enterprise_security_suite], products: ["Kaspersky Endpoint Security", "Kaspersky Symphony XDR"], note: "Централизованная консоль киберзащиты всех площадок группы компаний."}
