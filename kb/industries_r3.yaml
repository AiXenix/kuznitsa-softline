# Расширение отраслей и типов организаций с типовыми стеками ПО (Кузница Softline, раунд K2b / обновление K4)
# Соответствует схеме kb/SCHEMA.md, дополнению design/spec-addendum-v0.5.md (27.3) и формату kb/industries.yaml.
# Категории в `slots` — листовые id из design/work/kb_categories_r3.tsv.
# Регуляторика в `compliance` — id из kb/compliance.yaml и kb/compliance_r3.yaml.
# Семейства в `families` — id из design/work/kb_families_r3.tsv (в каждом must: true слоте >= 1 семейство с catalog: yes).
# Поле `parent` задаёт связь «частная → общая» (идентификатор из kb/industries.yaml); у корневых записей опущено.
# Всего записей: 30.

