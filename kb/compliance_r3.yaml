  effect: {boost: {certs: fstec, registry: yes}}
  explain: "Положение Банка России № 821-П устанавливает требования к защите информации при осуществлении переводов денежных средств для банков и операторов платёжных систем. Включает применение сертифицированной криптографии (СКЗИ), контроль целостности, защиту конечных точек, WAF/NGFW и мониторинг событий ИБ."
