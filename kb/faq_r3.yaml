# Расширенная база ответов на вопросы о редакциях, лицензировании и выборе ПО (r3)
# Соответствует kb/SCHEMA.md. Идентификаторы категорий и семейств проверены по таблицам r3.
# Всего карточек: 70.

# --- 1. ЧЕМ ОТЛИЧАЮТСЯ РЕДАКЦИИ ПРОДУКТОВ (34) ---

- id: faq_r3_editions_kesb
  questions: ["чем отличается касперский стандартный от расширенного", "разница kesb standard advanced total", "какую редакцию kaspersky endpoint security выбрать", "отличие kesb расширенный от тотал", "kes стандартный или расширенный"]
  answer: "Редакция Стандартный (Select) закрывает базовую защиту рабочих станций, файловых серверов и мобильных устройств с контролем веб-доступа и USB. Расширенный (Advanced) добавляет шифрование дисков и файлов, управление уязвимостями и установкой патчей, а также расширенные инструменты системного администрирования — её выбирают компании со средним и крупным парком ПК. Total включает все возможности Расширенного плюс защиту почтовых серверов и интернет-шлюзов в одном комплекте."
  related_categories: [endpoint_security, mail_security]
  related_families: [kaspersky_kesb]

- id: faq_r3_editions_ksos_vs_kesb
  questions: ["чем отличается ksos от kesb", "kaspersky small office или endpoint security", "разница касперский малый офис и для бизнеса", "что выбрать ksos или kes", "переход с ksos на kesb"]
  answer: "Kaspersky Small Office Security (KSOS) рассчитан на небольшие компании без выделенного ИТ-администратора и имеет ограничение по максимальному числу защищаемых устройств (небольшой офис). Kaspersky Endpoint Security для бизнеса (KESB) поддерживает централизованную консоль управления, гибкие политики безопасности, работу с Linux и крупный парк ПК с ценовыми диапазонами. Если офис вырос свыше лимита KSOS или нужен единый контроль и ФСТЭК, выбирают KESB."
  related_categories: [endpoint_security]
  related_families: [kaspersky_ksos, kaspersky_kesb]

- id: faq_r3_editions_kes_cloud
  questions: ["разница kes cloud base plus pro", "чем отличается kaspersky cloud plus от pro", "какую версию касперский клауд выбрать", "отличия редакций kaspersky endpoint security cloud"]
  answer: "Базовая редакция KES Cloud подходит компаниям, которым нужна простая облачная консоль защиты ПК и серверов без развёртывания собственного сервера управления. Plus добавляет защиту облачных сервисов, управление патчами, шифрование и расширенный контроль устройств. Pro включает элементы EDR для анализа сложных угроз и автоматического реагирования и ориентирована на компании с более зрелыми задачами ИБ."
  related_categories: [endpoint_security, edr_xdr]
  related_families: [kaspersky_kes_cloud]

- id: faq_r3_editions_kaspersky_symphony
  questions: ["разница kaspersky symphony security edr xdr", "чем отличается касперский симфони edr от xdr", "редакции kaspersky symphony", "что входит в kaspersky symphony xdr"]
  answer: "Линейка Kaspersky Symphony объединяет защиту конечных точек и продвинутое обнаружение угроз по уровням зрелости ИБ. Уровень Security даёт корпоративную защиту узлов, уровень EDR добавляет расследование инцидентов и реагирование на рабочих станциях и серверах. Уровень XDR расширяет видимость на сеть, почту и другие источники телеметрии для зрелых служб ИБ и SOC."
  related_categories: [edr_xdr, endpoint_security]
  related_families: [kaspersky_symphony_xdr, kaspersky_kesb]

- id: faq_r3_editions_drweb_ess
  questions: ["чем отличаются редакции dr web enterprise", "разница доктор веб десктоп сервер почта комплекс", "что входит в dr web комплексная защита", "как выбрать комплектацию dr web для бизнеса"]
  answer: "Dr.Web Enterprise Security Suite строится модульно: можно купить защиту отдельно для рабочих станций (Desktop), файловых серверов (Server) или почтовых шлюзов (Mail). Комплексная защита объединяет защиту рабочих станций, серверов, мобильных устройств и базовые модули фильтрации в едином пакете с централизованным сервером управления. Для большинства офисов удобнее начинать с модулей на рабочие станции и серверы, а при наличии собственной почты добавлять почтовый компонент."
  related_categories: [endpoint_security, mail_security]
  related_families: [drweb_enterprise_security_suite]

- id: faq_r3_editions_drweb_sb_vs_ess
  questions: ["чем отличается dr web малый бизнес от enterprise", "доктор веб малый бизнес или корп", "разница dr web small business и ess", "когда брать dr web enterprise вместо малого бизнеса"]
  answer: "Dr.Web Малый бизнес — готовый пакет для небольших организаций с простым внедрением и фиксированным набором узлов без сложной настройки. Dr.Web Enterprise Security Suite предназначен для растущих и крупных сетей: он поддерживает централизованный сервер управления, гибкое лицензирование по узлам и платформам (включая российские ОС) и доступен в сертифицированном исполнении."
  related_categories: [endpoint_security]
  related_families: [drweb_small_business, drweb_enterprise_security_suite]

- id: faq_r3_editions_astra_linux
  questions: ["разница астра линукс орел воронеж смоленск", "чем отличается воронеж от смоленска астра", "какой уровень защищенности astra linux нужен", "астра линукс базовый усиленный максимальный", "отличие серверной лицензии астра линукс"]
  answer: "В Astra Linux Special Edition уровень «Орёл» (базовый) подходит для обычных коммерческих офисов без специальных требований регуляторов. «Воронеж» (усиленный) добавляет замкнутую программную среду и расширенные механизмы защиты — его выбирают для ИСПДн, ГИС и объектов КИИ. «Смоленск» (максимальный) включает мандатный контроль доступа и применяется при работе с наиболее критичной информацией и гостайной; для серверных нагрузок оформляется отдельная серверная лицензия."
  related_categories: [desktop_os_ru, server_os]
  related_families: [astra_linux_se]

- id: faq_r3_editions_red_os
  questions: ["чем отличается ред ос стандартная от сертифицированной", "разница ред ос рабочая станция и сервер", "нужна ли сертифицированная ред ос фстэк", "редакции ред ос для юрлиц"]
  answer: "Стандартная редакция РЕД ОС выпускается отдельно для рабочих станций и серверов и закрывает задачи корпоративного импортозамещения без обязательной аттестации по требованиям ФСТЭК. Сертифицированная редакция РЕД ОС ФСТЭК поставляется с документами соответствия и применяется в ГИС, ИСПДн и на значимых объектах КИИ. Серверная редакция оптимизирована под развёртывание сервисов, СУБД и сетевых ролей, а настольная — под АРМ пользователей."
  related_categories: [desktop_os_ru, server_os]
  related_families: [red_os, red_os_server]

- id: faq_r3_editions_alt_linux
  questions: ["чем отличается альт рабочая станция от альт сп", "разница альт сервер рабочая станция образование", "какую редакцию альт линукс выбрать компании", "отличие alt workstation mate и kde"]
  answer: "Альт Рабочая станция (с окружением MATE или KDE) предназначена для обычных офисных ПК, Альт Сервер — для серверной инфраструктуры и сетевых служб, а Альт Образование содержит подборку учебных программ для школ и вузов. Альт СП (Сертифицированный пакет) — отдельная сертифицированная ФСТЭК ветка для рабочих станций и серверов, необходимая при аттестации защищённых систем и работе в госсекторе."
  related_categories: [desktop_os_ru, server_os]
  related_families: [alt_workstation, alt_server, alt_education, alt_sp]

- id: faq_r3_editions_windows_11
  questions: ["чем отличается windows 11 home от pro", "можно ли windows 11 home в офис", "разница виндовс 11 домашняя и про", "зачем юрлицу windows 11 pro"]
  answer: "Windows 11 Home предназначена для личного использования и не поддерживает ввод компьютера в корпоративный домен, групповые политики, BitLocker и полноценный удалённый рабочий стол (RDP-сервер). Windows 11 Pro создана для организаций: она интегрируется в домен, поддерживает шифрование дисков и централизованное администрирование. Для офисных ПК юрлиц выбирают редакцию Pro."
  related_categories: [desktop_os_windows]
  related_families: [windows_11]

- id: faq_r3_editions_windows_10_pro_ltsc
  questions: ["чем отличается windows 10 pro от ltsc", "зачем нужна windows 10 ltsc", "разница виндовс 10 про и корпоративная ltsc", "когда выбирают ltsc редакцию"]
  answer: "Windows 10 Pro рассчитана на обычные офисные рабочие места и получает регулярные функциональные обновления системы. Windows 10 Enterprise LTSC не содержит потребительских приложений и не меняет интерфейс годами, получая только обновления безопасности. Редакцию LTSC выбирают для специализированных АРМ, касс, медицинского и промышленного оборудования, где критична стабильность."
  related_categories: [desktop_os_windows]
  related_families: [windows_10]

- id: faq_r3_editions_windows_server
  questions: ["чем отличается windows server standard от datacenter", "разница виндовс сервер стандарт и датацентр", "когда выгоден windows server datacenter", "сколько виртуальных машин в standard и datacenter"]
  answer: "Обе редакции лицензируются по физическим ядрам сервера и требуют клиентские лицензии CAL, а главное отличие — права на виртуализацию. Windows Server Standard выгоден для физических серверов и сред с небольшим количеством гостевых ОС Windows. Windows Server Datacenter даёт право на неограниченное число виртуальных машин Windows на лицензированном хосте и добавляет программно-определяемые сети и хранилища — он окупается при высокой плотности виртуализации."
  related_categories: [server_os]
  related_families: [windows_server, windows_server_cal]

- id: faq_r3_editions_1c_base_prof_corp
  questions: ["чем отличается 1с бухгалтерия базовая от проф и корп", "разница 1с базовая проф корп", "какую 1с бухгалтерию выбрать для ооо", "когда нужна 1с бухгалтерия корп"]
  answer: "Базовая версия 1С:Бухгалтерии подходит для ИП или микробизнеса: она работает только на одном рабочем месте, ведёт одну организацию в базе и не позволяет дорабатывать конфигурацию. Версия ПРОФ снимает эти ограничения — поддерживает многопользовательскую работу, несколько юрлиц в одной базе и доработки под процессы компании. КОРП нужна организациям с обособленными подразделениями на отдельном балансе и сложным учётом НДС и налогов."
  related_categories: [accounting]
  related_families: [onec_accounting]

- id: faq_r3_editions_1c_zup
  questions: ["чем отличается 1с зуп базовая проф корп", "разница 1с зарплата проф и корп", "когда нужна 1с зуп корп", "отличие зуп проф от корп"]
  answer: "Базовая 1С:ЗУП подходит для небольшого штата с одним расчётчиком и без доработок. ЗУП ПРОФ закрывает типовой кадровый учёт и расчёт зарплаты в большинстве коммерческих компаний с многопользовательским доступом. ЗУП КОРП добавляет полноценный HR-блок — подбор персонала, оценку, обучение, KPI, охрану труда и учёт льгот для крупных компаний."
  related_categories: [payroll_hr_1c]
  related_families: [onec_zup]

- id: faq_r3_editions_1c_server
  questions: ["чем отличается сервер 1с мини от проф и корп", "разница лицензии сервер 1с проф и корп", "когда нужен сервер 1с мини", "что дает сервер 1с корп"]
  answer: "Сервер 1С:МИНИ — экономичный вариант для небольших команд с ограниченным числом одновременных подключений, когда файловой базы уже недостаточно. Лицензия на сервер x64 ПРОФ снимает ограничение МИНИ по сеансам и подходит для большинства средних компаний. Уровень КОРП нужен высоконагруженным и крупным внедрениям: он добавляет гибкое управление кластером серверов, балансировку нагрузки и фоновое обновление."
  related_categories: [onec_platform_licenses]
  related_families: [onec_server_license, onec_client_license]

- id: faq_r3_editions_1c_bgu_trade
  questions: ["разница 1с бгу базовая и проф", "чем отличается 1с управление торговлей базовая от проф", "какую 1с ут выбрать для склада", "отличие 1с бгу проф от корп"]
  answer: "Базовые версии 1С:БГУ и 1С:Управление торговлей рассчитаны на одно рабочее место и типовой учёт без изменения конфигурации. Редакция ПРОФ позволяет работать команде одновременно, вести несколько учреждений или организаций и адаптировать конфигурацию под регламенты и интеграции. Для 1С:БГУ редакция КОРП используется в централизованных бухгалтериях и крупных бюджетных структурах с повышенными требованиями к учёту."
  related_categories: [accounting, trade_warehouse]
  related_families: [onec_bgu, onec_trade]

- id: faq_r3_editions_myoffice
  questions: ["чем отличается мой офис стандартный от профессионального", "разница мойофис стандартный 2 и профессиональный", "что такое мойофис частное облако", "какую редакцию мойофис выбрать"]
  answer: "МойОфис Стандартный — это настольные редакторы текста, таблиц и презентаций для установки на рабочие компьютеры сотрудников (есть отдельная версия для образования). МойОфис Профессиональный дополняет настольные приложения серверной инфраструктурой: корпоративной почтой, календарём, хранилищем файлов и совместным редактированием документов в браузере. Вариант Частное Облако выбирают компании, которым нужна совместная работа и почта на собственных серверах без настольного комплекта."
  related_categories: [office_suite]
  related_families: [myoffice_standard, myoffice_professional]

- id: faq_r3_editions_r7_office
  questions: ["чем отличается р7 офис профессиональный от корпоративного сервера", "разница р7 офис десктоп и сервер", "какую редакцию р7 офис выбрать юрлицу", "отличие р7 офис образование"]
  answer: "Настольная редакция Р7-Офис (Профессиональный) ставится на ПК сотрудников и заменяет локальные редакторы документов, таблиц и презентаций. Корпоративный сервер добавляет совместное редактирование в браузере, корпоративный портал, почту, календарь и файловое хранилище в контуре компании. Редакция Образование поставляется по льготным условиям для аккредитованных учебных заведений."
  related_categories: [office_suite]
  related_families: [r7_office]

- id: faq_r3_editions_ms_office
  questions: ["чем отличается ms office home and business от pro plus", "разница офис для дома и бизнеса и профессиональный плюс", "какой microsoft office нужен юрлицу", "есть ли access в home and business"]
  answer: "Office Home & Business (Для дома и бизнеса) включает Word, Excel, PowerPoint и Outlook и подходит для большинства офисных сотрудников и малого бизнеса. Professional Plus дополнительно содержит Access и корпоративные функции развёртывания и управления политиками. Учитывайте, что официальные поставки Microsoft в РФ ограничены, поэтому для новых закупок компании всё чаще подбирают российские аналоги."
  related_categories: [office_suite]
  related_families: [ms_office, r7_office, myoffice_standard]

- id: faq_r3_editions_postgres_pro
  questions: ["разница postgres pro standard enterprise cert", "чем отличается postgres pro enterprise от standard", "когда нужен postgres pro certified", "какую редакцию постгрес про выбрать для 1с"]
  answer: "Postgres Pro Standard подходит для типовых бизнес-приложений и баз 1С, обеспечивая российскую поддержку и оптимизации поверх PostgreSQL. Postgres Pro Enterprise добавляет механизмы высокой доступности, мультимастер-кластеризацию, сжатие, продвинутое резервное копирование и инструменты миграции с Oracle для высоконагруженных систем. Сертифицированная редакция (Certified) имеет сертификат ФСТЭК и требуется для ГИС, ИСПДн и объектов КИИ."
  related_categories: [rdbms]
  related_families: [postgres_pro]

- id: faq_r3_editions_tantor
  questions: ["чем отличаются редакции субд tantor", "разница tantor basic для 1с и сертифицированная", "какой тантор выбрать под 1с", "отличие tantor db от tantor platform"]
  answer: "Базовая редакция СУБД Tantor (Basic) предназначена для общих корпоративных задач, а специализированная сборка для 1С оптимизирована под работу с платформой 1С:Предприятие. Сертифицированная версия применяется там, где требуются подтверждённые требования ФСТЭК. Отдельно поставляется Платформа Tantor — инструмент мониторинга, администрирования и обслуживания кластеров PostgreSQL."
  related_categories: [rdbms, db_management_tools]
  related_families: [tantor_db, tantor_platform]

- id: faq_r3_editions_cryptopro_csp
  questions: ["чем отличается клиентская и серверная лицензия криптопро csp", "когда нужна серверная лицензия криптопро", "разница криптопро на рабочее место и на сервер", "можно ли клиентский криптопро поставить на сервер"]
  answer: "Клиентская лицензия КриптоПро CSP предназначена для установки на отдельную рабочую станцию, где один пользователь подписывает документы или работает в клиент-банке. Серверная лицензия обязательна при установке на серверную ОС, терминальный сервер (RDS), веб-сервер или сервер приложений, обслуживающий подключения нескольких пользователей или автоматическую подпись. Выбор зависит от операционной системы и схемы подключения пользователей."
  related_categories: [crypto_skzi]
  related_families: [cryptopro_csp]

- id: faq_r3_editions_bitrix24
  questions: ["чем отличается битрикс24 облако от коробки", "разница битрикс24 корпоративный портал и энтерпрайз", "что выбрать облачный или коробочный битрикс24", "плюсы коробки битрикс24 для юрлица"]
  answer: "Облачный Битрикс24 (Базовый, Стандартный, Профессиональный) запускается сразу по подписке на серверах вендора и не требует собственного администрирования. Коробочная версия (Корпоративный портал) устанавливается на сервер компании, открывает доступ к исходному коду для глубоких доработок, интеграции с Active Directory и хранения данных в своём контуре. Редакция Энтерпрайз рассчитана на крупные компании и холдинги с многодепартаментностью и высокой нагрузкой."
  related_categories: [crm_systems]
  related_families: [bitrix24]

- id: faq_r3_editions_cyber_backup
  questions: ["чем отличается кибер бэкап стандартный от расширенного", "разница редакций cyber backup", "какую лицензию кибер бэкап выбрать для виртуализации", "отличие cyber backup workstation и virt host"]
  answer: "В линейке Кибер Бэкап редакции подбираются под тип защищаемого объекта: Рабочие станции — для ПК и ноутбуков, Стандартный — для базового резервного копирования серверов, а Расширенный (Advanced) — для кластеров, баз данных, корпоративной почты и дедупликации. Для хостов виртуализации выделена отдельная лицензия на хост, покрывающая гостевые виртуальные машины. Такой выбор позволяет не переплачивать за лишние модули на обычных ПК."
  related_categories: [backup_recovery]
  related_families: [cyber_backup]

- id: faq_r3_editions_rubackup
  questions: ["чем отличается rubackup standard от enterprise", "разница редакций ру бэкап", "когда нужен rubackup enterprise", "выбор лицензии rubackup"]
  answer: "RuBackup Standard закрывает резервное копирование файлов, операционных систем и базовых сервисов в небольших и средних инфраструктурах. RuBackup Enterprise добавляет поддержку крупных корпоративных СУБД, платформ виртуализации, распределённых площадок и расширенных сценариев восстановления. Выбор редакции зависит от перечня защищаемых приложений и наличия кластерных баз данных."
  related_categories: [backup_recovery]
  related_families: [rubackup]

- id: faq_r3_editions_zvirt
  questions: ["чем отличается zvirt standard от max", "разница редакций zvirt", "какую редакцию orion zvirt выбрать", "что добавляет zvirt max"]
  answer: "zVirt Standard обеспечивает базовую корпоративную виртуализацию серверов, миграцию виртуальных машин и отказоустойчивость кластера для большинства средних компаний. Редакция Max расширяет платформу продвинутыми функциями для крупных и распределённых инфраструктур: дополнительными возможностями управления, отказоустойчивости и интеграций (точный состав опций уточняется по актуальной матрице вендора)."
  related_categories: [server_virtualization]
  related_families: [orion_zvirt]

- id: faq_r3_editions_basis_dynamix
  questions: ["чем отличается basis dynamix standard от enterprise", "разница редакций базис динамикс", "что входит в basis dynamix enterprise", "выбор редакции basis виртуализация"]
  answer: "Basis Dynamix Standard подходит для построения классической среды виртуализации серверов на российском стеке с базовым управлением кластером. Basis Dynamix Enterprise ориентирован на крупные компании и ЦОД: он добавляет расширенные инструменты оркестрации, работу с контейнерами, автоматизацию и функции для высоконагруженных сред."
  related_categories: [server_virtualization, private_cloud_platforms]
  related_families: [basis_dynamix]

- id: faq_r3_editions_nanocad
  questions: ["чем отличаются модули nanocad спдс механика топоплан", "разница nanocad базовая и pro", "какую редакцию нанокад выбрать", "что входит в платформу nanocad"]
  answer: "Базовая Платформа nanoCAD даёт полноценное 2D-черчение и работу с DWG вместо AutoCAD. Отраслевые модули расширяют платформу под конкретную специальность: СПДС — для строительной документации, Механика — для машиностроительных чертежей, Топоплан — для геодезии и генплана, а 3D-моделирование — для объёмной геометрии. Конфигурация Pro объединяет ключевые модули для комплексных проектных отделов."
  related_categories: [cad_2d, bim_aec]
  related_families: [nanocad_platform]

- id: faq_r3_editions_kompas_3d
  questions: ["чем отличается компас график от компас 3d", "разница компас 3d машиностроение и строительство", "какую редакцию компас выбрать кб", "что входит в комплект компас"]
  answer: "КОМПАС-График предназначен исключительно для 2D-черчения и выпуска конструкторской документации по ЕСКД. КОМПАС-3D добавляет параметрическое твердотельное и поверхностное 3D-моделирование деталей и сборок. Отраслевые комплекты «Машиностроение» и «Строительство» включают базовый КОМПАС плюс профильные библиотеки стандартных изделий, расчётов и строительных элементов."
  related_categories: [mcad_plm, cad_2d]
  related_families: [kompas_3d]

- id: faq_r3_editions_secret_net_dallas
  questions: ["чем отличаются редакции secret net studio базовая полная с", "разница dallas lock c k linux", "какую версию dallas lock выбрать", "отличие редакций secret net studio"]
  answer: "В Secret Net Studio Базовая версия закрывает защиту от НСД и разграничение доступа, Полная добавляет межсетевой экран, антивирусную и сетевую защиту, а исполнение С рассчитано на работу со сведениями повышенной конфиденциальности и гостайной. У Dallas Lock редакции 8.0-К и 8.0-С различаются уровнем защищённости и областью применения (конфиденциальная информация или гостайна), а Dallas Lock Linux предназначен для отечественных ОС на базе Linux."
  related_categories: [nsd_access_control]
  related_families: [secret_net_studio, dallas_lock]

- id: faq_r3_editions_usergate_continent
  questions: ["чем отличается виртуальный ngfw от аппаратного пак", "разница usergate virtual и hardware", "континент виртуальный или аппаратный", "что выбрать ngfw виртуальную машину или железку"]
  answer: "Виртуальное исполнение (VA) UserGate или Континент разворачивается на существующих серверах виртуализации, быстрее масштабируется и подходит для облачных или виртуальных сегментов. Программно-аппаратный комплекс (ПАК) поставляется на выделенной аппаратной платформе с гарантированной пропускной способностью и часто требуется для прохождения сертификационных проверок периметра и ГОСТ VPN."
  related_categories: [ngfw_vpn]
  related_families: [usergate_ngfw, continent_ngfw]

- id: faq_r3_editions_contentreader
  questions: ["чем отличается contentreader pdf standard от corporate", "разница редакций contentreader pdf", "какую версию contentreader выбрать офису", "что добавляет contentreader corporate"]
  answer: "ContentReader PDF Standard закрывает повседневную работу одного пользователя с PDF и распознаванием сканов (редактирование, конвертация, подпись, защита). Редакция Corporate предназначена для компаний: она добавляет автоматическую пакетную обработку документов, сравнение версий договоров, централизованное развёртывание и конкурентное лицензирование."
  related_categories: [pdf_editors, ocr_capture]
  related_families: [contentreader_pdf]

- id: faq_r3_editions_kontur_tolk_mts
  questions: ["разница контур толк облако и сервер", "чем отличается мтс линк облако от онпремис", "тарифы контур толк бизнес и вебинары", "когда нужен серверный вкс вместо облака"]
  answer: "Облачные тарифы Контур.Толк и МТС Линк запускаются за один день и оплачиваются по подписке за организаторов или комнаты — оптимально для быстрого старта и распределённых команд. Серверные (on-premise) редакции устанавливаются в инфраструктуре компании и выбираются при строгих требованиях ИБ, закрытом контуре или запрете хранения записей встреч во внешнем облаке. Модули вебинаров выделяются отдельно для маркетинга и массового обучения."
  related_categories: [vks_webinars]
  related_families: [kontur_tolk, mts_link_meetings, mts_link_webinars]

- id: faq_r3_editions_rutoken_jacarta
  questions: ["чем отличается рутокен эцп 3.0 от рутокен лайт", "разница jacarta гост pki se", "какой токен нужен для фнс и егаис", "подойдет ли рутокен лайт для налоговой"]
  answer: "Рутокен Lite служит защищённым хранилищем ключей, но криптооперации выполняются программно на компьютере (например, через КриптоПро CSP). Рутокен ЭЦП 3.0 и JaCarta-2 ГОСТ выполняют криптографию внутри чипа с неизвлекаемым ключом и поддерживают работу с госсистемами и ЕГАИС. Модели с индексом PKI/SE комбинируют сертификаты для корпоративного входа и отечественную криптографию — выбор зависит от требований конкретной площадки."
  related_categories: [tokens_pki]
  related_families: [rutoken_ecp, aladdin_jacarta]

# --- 2. ЛИЦЕНЗИРОВАНИЕ И ПОКУПКА ДЛЯ ЮРЛИЦА (26) ---

- id: faq_r3_lic_home_in_org
  questions: ["можно ли домашнюю лицензию использовать в организации", "разрешено ли ставить home по в офисе", "штраф за домашний софт у юрлица", "домашний антивирус на рабочем компьютере"]
  answer: "Нет, лицензионные соглашения (EULA) домашних редакций прямо ограничивают их использование личными некоммерческими целями. Установка домашней ОС, офиса или антивируса в офисе юридического лица приравнивается к нарушению лицензионных условий и создаёт риски при проверках, а также лишает компанию права на корпоративную поддержку и централизованное управление. Для бизнеса необходимо оформлять коммерческие лицензии на юрлицо."
  related_categories: [endpoint_security, office_suite, desktop_os_windows]
  related_families: [kaspersky_standard_home, kaspersky_kesb, windows_11]

- id: faq_r3_lic_perpetual_av
  questions: ["бывает ли бессрочная лицензия антивируса", "можно ли купить антивирус навсегда", "есть ли пожизненная лицензия на касперский", "бессрочный антивирус для организации"]
  answer: "Бессрочных лицензий на современные корпоративные антивирусы практически не существует, поскольку их защита напрямую зависит от ежедневных обновлений антивирусных баз и сигнатур угроз. Все основные вендоры (Kaspersky, Dr.Web, PRO32) поставляют антивирусы по срочной подписке (обычно на 1, 2 или 3 года) с последующим продлением. Чтобы снизить частоту закупок и зафиксировать цену, организации оформляют многолетнюю подписку."
  related_categories: [endpoint_security]
  related_families: [kaspersky_kesb, drweb_enterprise_security_suite, pro32_endpoint_security]

- id: faq_r3_lic_subscription_expired_effect
  questions: ["что будет когда подписка на по закончится", "перестанет ли работать программа после окончания лицензии", "что происходит при истечении подписки", "заблокируется ли по если не продлить"]
  answer: "Последствия зависят от класса продукта и политики вендора. У антивирусов обычно прекращаются обновления баз и отключается активная защита, у облачных сервисов доступ переходит в режим чтения или блокируется, а у некоторых локальных программ по подписке перестают открываться функции редактирования. В любом случае использование ПО после окончания срока действия срочной лицензии неправомерно, поэтому продление лучше оформлять заранее."
  related_categories: [endpoint_security, office_suite, crm_systems]
  related_families: [kaspersky_kesb, r7_office, bitrix24]

- id: faq_r3_lic_midterm_addon
  questions: ["можно ли докупить места в середине срока", "докупка лицензий к действующему ключу срок", "что со сроком при расширении лицензии", "добавить рабочие места в антивирус в середине года"]
  answer: "Да, большинство корпоративных вендоров позволяют расширить число мест в любой момент действия лицензии (долицензирование / add-on). Обычно дополнительные узлы выравниваются по дате окончания основного контракта (ко-терминг) с пропорциональным расчётом стоимости за оставшийся период, чтобы далее всё продлевалось одним счётом. Точный порядок дозакупки зависит от правил конкретного производителя."
  related_categories: [endpoint_security, office_suite, onec_platform_licenses]
  related_families: [kaspersky_kesb, drweb_enterprise_security_suite, onec_client_license]

- id: faq_r3_lic_device_vs_user
  questions: ["лицензия на устройство или на пользователя", "что выгоднее лицензия на пк или на сотрудника", "разница per device и per user", "как считать лицензии при сменной работе"]
  answer: "Лицензия на устройство (device) закрепляется за конкретным компьютером или терминалом и выгодна при сменной работе, когда за одним ПК в разные смены трудятся несколько сотрудников. Лицензия на пользователя (user) закрепляется за человеком и выгодна, если один сотрудник работает с офисного ПК, ноутбука и смартфона. При расчёте выбирают ту метрику, по которой общее число лицензий получается меньше (если вендор предлагает оба варианта)."
  related_categories: [server_os, office_suite, endpoint_security]
  related_families: [windows_server_cal, myoffice_standard, r7_office]

- id: faq_r3_lic_concurrent
  questions: ["что такое конкурентная лицензия", "как работает плавающая лицензия", "сетевая конкурентная лицензия что это", "concurrent license простыми словами"]
  answer: "Конкурентная (плавающая, сетевая) лицензия ограничивает не число установленных копий, а количество пользователей, одновременно работающих с программой в один момент времени. ПО можно установить на большее число ПК, а сервер лицензий автоматически выдаёт свободный слот при запуске и освобождает его после закрытия. Такая схема особенно выгодна для САПР, 1С, систем удалённого доступа и программ, которыми сотрудники пользуются эпизодически."
  related_categories: [cad_2d, onec_platform_licenses, remote_desktop]
  related_families: [nanocad_platform, onec_client_license, assistant_remote]

- id: faq_r3_lic_cores_and_vms
  questions: ["как работают лицензии на ядра и виртуальные машины", "лицензирование по ядрам и по вм", "что считать при лицензировании хоста", "лицензия на сокет ядро или виртуальную машину"]
  answer: "При лицензировании по ядрам (cores) или сокетам (CPU) учитываются физические ресурсы сервера, на котором развёрнуто ПО (часто действует минимальный порог ядер на сервер — уточняется по правилам вендора). При лицензировании по виртуальным машинам (VM) или vCPU оплачивается количество защищаемых либо запускаемых виртуальных машин независимо от мощности хоста. Выбор модели зависит от плотности виртуализации: на нагруженных хостах с множеством ВМ нередко выгоднее лицензия на хост или сокет."
  related_categories: [server_os, server_virtualization, rdbms]
  related_families: [windows_server, orion_zvirt, postgres_pro]

- id: faq_r3_lic_cal_for_server
  questions: ["нужны ли клиентские лицензии к серверу", "достаточно ли купить только серверную лицензию", "зачем к серверу докупать клиентские лицензии", "клиентские лицензии для сервера 1с и windows"]
  answer: "Для многих серверных продуктов одной лицензии на сам сервер недостаточно — дополнительно требуются клиентские лицензии на каждого подключающегося пользователя или устройство. Классические примеры: Windows Server (требуются CAL, а для терминального доступа ещё и RDS CAL) и сервер 1С:Предприятия (нужны клиентские лицензии 1С). При этом ряд российских СУБД и Linux-серверов лицензируется только на сервер/ядра без отдельных CAL — всегда уточняйте модель конкретного продукта."
  related_categories: [server_os, onec_platform_licenses, rdbms]
  related_families: [windows_server, windows_server_cal, onec_server_license, onec_client_license]

- id: faq_r3_lic_transfer_pc
  questions: ["можно ли перенести лицензию на другой компьютер", "перенос лицензии при замене пк", "что делать с лицензией если сгорел компьютер", "переактивация ключа на новом компьютере"]
  answer: "Большинство коммерческих электронных (ESD), коробочных и корпоративных лицензий можно перенести на новый компьютер внутри той же организации после удаления ПО со старого устройства. Исключение — OEM-лицензии, жёстко привязанные к конкретному оборудованию (материнской плате), а также отдельные продукты со строгой привязкой к аппаратному профилю, требующие сброса активации через поддержку вендора."
  related_categories: [desktop_os_windows, office_suite, endpoint_security]
  related_families: [windows_11, r7_office, kaspersky_kesb]

- id: faq_r3_lic_downgrade_rights
  questions: ["что такое право на предыдущие версии", "downgrade rights что это", "можно ли поставить старую версию по новой лицензии", "право даунгрейда лицензии"]
  answer: "Право на использование предыдущих версий (downgrade rights) позволяет легально установить более ранний релиз программы по лицензии, купленной на актуальную версию. Это востребовано, когда у компании есть отраслевое ПО или оборудование, совместимое только со старой версией ОС или СУБД. Наличие права даунгрейда и список допустимых прошлых версий всегда определяются условиями лицензии конкретного вендора."
  related_categories: [desktop_os_windows, server_os, desktop_os_ru]
  related_families: [windows_11, windows_server, astra_linux_se]

- id: faq_r3_lic_support_certificate
  questions: ["что такое сертификат техподдержки", "зачем покупать сертификат тп к лицензии", "обязательна ли техподдержка вендора", "что дает сертификат технической поддержки"]
  answer: "Сертификат технической поддержки — это срочный контракт на сопровождение ПО от производителя: он даёт доступ к официальным обновлениям и патчам безопасности, базе знаний и обращениям к инженерам вендора по SLA. У многих российских вендоров (например, Astra Linux, РЕД ОС, Postgres Pro, 1С:ИТС) право на получение обновлений связано именно с действующим сертификатом поддержки, даже если сама лицензия на ПО бессрочная."
  related_categories: [tech_support, desktop_os_ru, rdbms]
  related_families: [astra_support_pack, redsoft_support_pack, basealt_support_pack, onec_its]

- id: faq_r3_lic_esd_vs_box
  questions: ["электронная поставка и коробка в чем разница", "что лучше esd или box для юрлица", "отличие электронной лицензии от коробочной", "чем отличается электронный ключ от коробки"]
  answer: "Электронная поставка (ESD) — это передача прав и лицензионного ключа по e-mail или в личном кабинете без физического носителя: она быстрее, не требует логистики и является стандартом для B2B. Коробочная поставка (BOX) включает физический носитель и бумажную упаковку и обычно дороже из-за производства и доставки. По юридической силе при наличии закрывающих документов обе формы равнозначны, но для сертифицированных ФСТЭК/ФСБ решений иногда дополнительно нужен бумажный формуляр и медиакит."
  related_categories: [endpoint_security, office_suite, desktop_os_ru]
  related_families: [kaspersky_kesb, r7_office, astra_linux_se]

- id: faq_r3_lic_formular
  questions: ["что такое формуляр на по", "когда нужен формуляр на программу", "зачем нужен бумажный формуляр фстэк", "формуляр для сзи и скзи"]
  answer: "Формуляр — это бумажный документ учёта сертифицированного экземпляра ПО или СЗИ с заводским номером и защитным знаком (голограммой), подтверждающий подлинность и легальность поставки. Он требуется при аттестации ГИС, значимых объектов КИИ, защищённых ИСПДн и при эксплуатации СКЗИ (например, КриптоПро, Secret Net Studio, сертифицированной Astra Linux). Для обычного коммерческого офиса без аттестации формуляр, как правило, не нужен."
  related_categories: [nsd_access_control, crypto_skzi, desktop_os_ru]
  related_families: [secret_net_studio, cryptopro_csp, astra_linux_se]

- id: faq_r3_lic_accounting_docs
  questions: ["какие документы получит бухгалтерия при покупке по", "закрывающие документы на лицензии по", "упд или акт на передачу прав на по", "документы для бухгалтерии на электронную лицензию"]
  answer: "При покупке лицензий на юридическое лицо оформляются счёт на оплату, договор (лицензионный/сублицензионный или счёт-оферта) и закрывающий документ — УПД или акт приёма-передачи неисключительных прав, а также электронный лицензионный сертификат с ключом. Документооборот можно провести по ЭДО (Диадок, СБИС и другие операторы) либо в бумажном виде. Для ПО из реестра Минцифры в документах отражается освобождение от НДС."
  related_categories: [accounting, tax_reporting_edo]
  related_families: [kontur_diadoc, sbis_saby, onec_edo]

- id: faq_r3_lic_renew_after_expiry
  questions: ["как продлить если лицензия уже истекла", "просрочили продление антивируса что делать", "можно ли продлить истекший ключ", "льготное окно продления лицензии"]
  answer: "У большинства вендоров после окончания срока действия подписки предусмотрен льготный период (grace period), в течение которого ещё можно оформить продление со скидкой, а не покупать новую лицензию. Длительность такого окна и правила отсчёта нового срока (от даты окончания старого ключа или от даты активации) различаются у каждого производителя. Если льготный период уже прошёл, потребуется приобретение новой базовой лицензии."
  related_categories: [endpoint_security, office_suite, backup_recovery]
  related_families: [kaspersky_kesb, drweb_enterprise_security_suite, cyber_backup]

- id: faq_r3_lic_renewal_discount_rules
  questions: ["продление дешевле новой лицензии при каких условиях", "условия скидки на продление по", "что нужно для покупки продления лицензии", "проверка предыдущей лицензии при продлении"]
  answer: "Продление обычно стоит заметно дешевле первичной покупки, если соблюдены три условия: у компании есть действующая или недавно истёкшая базовая лицензия того же продукта, номер предыдущего ключа/сертификата подтверждён при заказе и соблюдены правила по количеству узлов и редакции. При покупке продления без предыдущей лицензии ключ не активируется или будет аннулирован вендором."
  related_categories: [endpoint_security, backup_recovery, cad_2d]
  related_families: [kaspersky_kesb, drweb_enterprise_security_suite, nanocad_platform]

- id: faq_r3_lic_edu_med_discounts
  questions: ["льготы образованию и медицине на по", "скидки на софт для школ вузов и больниц", "кто может купить академическую лицензию", "льготные лицензии для клиник и университетов"]
  answer: "Многие вендоры (Kaspersky, Dr.Web, Р7-Офис, МойОфис, Альт, Astra Linux и др.) предоставляют специальные льготные прайсы для образовательных учреждений (школы, колледжи, вузы с образовательной лицензией), а часть производителей — и для государственных медицинских организаций. Для подтверждения права на льготу обычно запрашиваются реквизиты организации и копия действующей лицензии на образовательную или медицинскую деятельность. Точный перечень льготных категорий зависит от политики конкретного вендора."
  related_categories: [endpoint_security, office_suite, desktop_os_ru]
  related_families: [alt_education, r7_office, myoffice_standard, drweb_enterprise_security_suite]

- id: faq_r3_lic_44fz_223fz
  questions: ["покупка по по 44 фз и 223 фз", "как оформить закупку софта по 44 фз", "требования к закупке по по 223 фз", "госзакупка лицензий по правилам нацрежима"]
  answer: "При закупках ПО по 44-ФЗ и для ряда заказчиков по 223-ФЗ действует национальный режим: приоритет и обязательный выбор решений из Единого реестра российского или евразийского ПО. В техническом задании указываются код ОКПД2, характеристики по позиции КТРУ (если она есть) и обоснование НМЦК на базе сопоставимых коммерческих предложений. При необходимости в ТЗ также включают требования по сертификации ФСТЭК/ФСБ и поставке бумажного формуляра."
  related_categories: [desktop_os_ru, office_suite, endpoint_security]
  related_families: [astra_linux_se, r7_office, kaspersky_kesb]

- id: faq_r3_lic_check_registry
  questions: ["входит ли продукт в реестр российского по и где проверить", "как проверить программу в реестре минцифры", "где узнать номер реестровой записи по", "проверка софта в еррп"]
  answer: "Проверить включение продукта в Единый реестр российского ПО можно на официальном портале реестра Минцифры России по наименованию ПО, ИНН правообладателя или номеру реестровой записи. Обращайте внимание не только на название линейки, но и на точную редакцию и класс ПО, поскольку у части вендоров в реестр включены не все модули. В карточках каталога статус реестра показан справочно, а перед тендером запись рекомендуется перепроверять на портале Минцифры."
  related_categories: [desktop_os_ru, office_suite, rdbms]
  related_families: [astra_linux_se, red_os, r7_office, postgres_pro]

- id: faq_r3_lic_replace_left_vendor
  questions: ["чем заменить продукт ушедшего вендора", "аналоги зарубежного по в россии", "российские аналоги ушедших программ", "как подобрать замену иностранному софту"]
  answer: "Для большинства ушедших зарубежных решений есть зрелые российские аналоги из реестра Минцифры: вместо Microsoft Office — Р7-Офис и МойОфис, вместо Windows — Astra Linux, РЕД ОС и Альт, вместо AutoCAD — nanoCAD и КОМПАС-3D, вместо VMware — Брест, zVirt и Basis Dynamix, вместо Jira — Яндекс Трекер, Kaiten и EvaProject. Введите название зарубежного продукта в поиск — система покажет статус вендора и совместимые российские замены с учётом вашей инфраструктуры."
  related_categories: [office_suite, desktop_os_ru, cad_2d, server_virtualization]
  related_families: [r7_office, astra_linux_se, nanocad_platform, orion_zvirt]

- id: faq_r3_lic_keep_using_foreign
  questions: ["можно ли продолжать пользоваться ранее купленной зарубежной лицензией", "легально ли использовать старый microsoft или autocad", "нужно ли удалять купленное ранее иностранное по", "работа на бессрочной лицензии ушедшего вендора"]
  answer: "Если коммерческая компания ранее легально приобрела бессрочную лицензию зарубежного ПО, право пользования в рамках исходного договора обычно сохраняется, но без официальных обновлений, техподдержки и возможности докупки новых мест. Исключение составляют значимые объекты КИИ, госсектор и регулируемые организации, для которых действуют нормативные запреты и сроки обязательного перехода на отечественное ПО. Если же у зарубежного софта была срочная подписка, после её истечения легальное использование прекращается."
  related_categories: [desktop_os_windows, office_suite, desktop_os_ru]
  related_families: [windows_11, ms_office, astra_linux_se, r7_office]

- id: faq_r3_lic_hardware_vs_software_key
  questions: ["аппаратный usb ключ или программная лицензия", "разница usb ключ и программная защита 1с", "что выбрать hasp ключ или программный пинкод", "плюсы и минусы программной лицензии"]
  answer: "Программная лицензия активируется пин-кодом, привязывается к параметрам оборудования, поставляется электронно и не занимает USB-порт, что особенно удобно в виртуальных средах. Аппаратный USB-ключ (например, в 1С или САПР) не зависит от смены комплектующих и легко переставляется между физическими ПК, но требует физической доставки и бережного хранения при утере."
  related_categories: [onec_platform_licenses, cad_2d]
  related_families: [onec_client_license, nanocad_platform, kompas_3d]

- id: faq_r3_lic_pack_vs_range
  questions: ["разница пакет лицензий и диапазон узлов", "что такое pack и band в прайсе по", "почему цена за штуку меняется от количества", "как купить на 35 пк если диапазон 25 49"]
  answer: "При пакетном лицензировании (pack) продукт продаётся фиксированными наборами, например на 5, 10 или 25 мест — цена указана за весь пакет. При диапазонном лицензировании (band, например 25–49 узлов) цена указана за одну лицензию в этом диапазоне, а итоговая сумма равна количеству мест, умноженному на цену диапазона. Поэтому на 35 ПК заказывают 35 штук из позиции диапазона 25–49."
  related_categories: [endpoint_security, onec_platform_licenses]
  related_families: [kaspersky_kesb, drweb_enterprise_security_suite, onec_client_license]

- id: faq_r3_lic_crossgrade
  questions: ["переход с другого антивируса со скидкой", "что такое миграционная лицензия", "скидка за переход с конкурента", "как оформить кроссгрейд лицензии"]
  answer: "Кроссгрейд (конкурентный переход) позволяет купить лицензию нового вендора по сниженной цене при переходе с аналогичного продукта другого производителя, включая ушедших зарубежных вендоров. Для получения скидки обычно требуется подтвердить владение предыдущей лицензией (сертификат, акт или счёт). Условия и размер скидки определяются действующей промопрограммой конкретного вендора."
  related_categories: [endpoint_security, office_suite, backup_recovery]
  related_families: [kaspersky_kesb, drweb_enterprise_security_suite, cyber_backup]

- id: faq_r3_lic_multi_entity_group
  questions: ["можно ли купить одну лицензию на группу компаний", "лицензия на холдинг и несколько юрлиц", "передача лицензий между дочерними компаниями", "лицензирование филиалов и аффилированных лиц"]
  answer: "По общему правилу простая неисключительная лицензия выдаётся на конкретное юридическое лицо и не передаётся другим юрлицам, даже если они входят в один холдинг (филиалы одного юрлица при этом покрываются). Для группы компаний вендоры предусматривают либо отдельные лицензии на каждое юрлицо, либо специальное корпоративное соглашение с правом использования аффилированными лицами — это нужно согласовывать до покупки."
  related_categories: [endpoint_security, office_suite, erp_systems]
  related_families: [kaspersky_kesb, onec_holding, bitrix24]

- id: faq_r3_lic_vat_software_services
  questions: ["почему техподдержка с ндс а лицензия без ндс", "облагается ли ндс внедрение российского по", "ндс на токены и криптопро в одном счете", "когда на российское по начисляется ндс"]
  answer: "Освобождение от НДС по ст. 149 НК РФ распространяется именно на передачу неисключительных прав на ПО, включённое в Единый реестр российского ПО. Сопутствующие услуги (внедрение, настройка, обучение, а также часть договоров сопровождения, оформляемых как услуги, а не передача прав на обновления) и физическое оборудование (USB-токены, аппаратные шлюзы) облагаются НДС по общей ставке. Поэтому в одном счёте могут сочетаться позиции с НДС и без НДС."
  related_categories: [tech_support, tokens_pki, accounting]
  related_families: [astra_support_pack, rutoken_ecp, cryptopro_csp]

# --- 3. ВОПРОСЫ ВЫБОРА КЛАССА РЕШЕНИЙ (10) ---

- id: faq_r3_choice_av_vs_edr
  questions: ["чем отличается антивирус от edr", "разница epp и edr", "зачем edr если уже есть антивирус", "что лучше антивирус или edr"]
  answer: "Классический антивирус (EPP) предотвращает известные и типовые угрозы на конечной точке автоматически. EDR (Endpoint Detection and Response) непрерывно собирает телеметрию процессов на ПК и серверах, выявляет скрытые целевые атаки и позволяет специалистам ИБ расследовать цепочку инцидента и изолировать узел. EDR не заменяет антивирус, а дополняет его в средних и крупных организациях с выделенной службой ИБ."
  related_categories: [endpoint_security, edr_xdr]
  related_families: [kaspersky_kesb, kaspersky_symphony_xdr, pt_maxpatrol_edr, bizone_edr]

- id: faq_r3_choice_dlp_vs_monitoring
  questions: ["чем отличается dlp от контроля сотрудников", "разница dlp и учета рабочего времени", "что выбрать dlp или стахановец", "dlp против мониторинга персонала"]
  answer: "Системы учёта рабочего времени и контроля сотрудников фиксируют активность за ПК, опоздания, открытые программы и скриншоты — их главная задача связана с продуктивностью и дисциплиной. DLP-системы анализируют содержимое писем, мессенджеров, печати и USB-носителей, чтобы предотвратить или расследовать утечку конфиденциальных документов и баз данных. При этом многие современные решения объединяют оба модуля, но фокус внедрения (HR или ИБ) различается."
  related_categories: [dlp, employee_monitoring]
  related_families: [infowatch_traffic_monitor, searchinform_kib, stakhanovets, kickidler]

- id: faq_r3_choice_ngfw_vs_firewall
  questions: ["чем отличается ngfw от обычного межсетевого экрана", "разница фаервол и ngfw", "зачем компании ngfw вместо роутера", "отличие межсетевого экрана нового поколения"]
  answer: "Обычный межсетевой экран фильтрует трафик на уровне IP-адресов и портов. NGFW (Next-Generation Firewall) дополнительно распознаёт конкретные приложения и пользователей (DPI), включает систему предотвращения вторжений (IPS), контентную фильтрацию сайтов, расшифровку TLS и антивирусную проверку трафика на периметре. Для корпоративной сети, филиалов и выполнения требований регуляторов выбирают NGFW."
  related_categories: [ngfw_vpn]
  related_families: [usergate_ngfw, continent_ngfw, pt_ngfw, ideco_ngfw]

- id: faq_r3_choice_skzi_vs_nsd
  questions: ["чем отличается скзи от сзи от нсд", "разница скзи и сзи", "криптопро это скзи или сзи от нсд", "нужно ли и скзи и сзи от нсд"]
  answer: "СКЗИ (средства криптографической защиты информации, например КриптоПро CSP, ViPNet) отвечают за шифрование данных, электронную подпись и защиту каналов связи по алгоритмам ГОСТ и сертифицируются ФСБ России. СЗИ от НСД (например, Secret Net Studio, Dallas Lock) защищают сам компьютер от несанкционированного доступа — контролируют вход пользователей, права на файлы, устройства и целостность ОС и сертифицируются ФСТЭК. Эти классы не заменяют друг друга и часто применяются вместе."
  related_categories: [crypto_skzi, nsd_access_control]
  related_families: [cryptopro_csp, vipnet_coordinator, secret_net_studio, dallas_lock]

- id: faq_r3_choice_cloud_vs_box
  questions: ["чем отличается облачная версия от коробочной", "облако или коробка что выбрать компании", "saas или on premise плюсы и минусы", "когда нужна коробочная версия по"]
  answer: "Облачная версия (SaaS) разворачивается у провайдера: быстрый старт, оплата подпиской и отсутствие затрат на собственные серверы и администрирование. Коробочная версия (on-premise) устанавливается в инфраструктуре заказчика — она даёт полный контроль над данными, гибкие интеграции, работу в закрытом контуре и соответствие строгим требованиям ИБ и КИИ. Малый и средний бизнес чаще выбирает облако, а крупный и госсектор — коробку."
  related_categories: [crm_systems, vks_webinars, office_suite]
  related_families: [bitrix24, kontur_tolk, myoffice_professional, elma365]

- id: faq_r3_choice_vdi_vs_terminal
  questions: ["чем отличается vdi от терминального доступа", "разница vdi и rds", "что выбрать vdi или терминальный сервер", "отличие виртуальных рабочих столов от терминала"]
  answer: "При терминальном доступе (RDS) все пользователи одновременно работают в сеансах одной общей серверной ОС — это дешевле по ресурсам и лицензиям, но приложения разделяют одну среду. В VDI каждому пользователю выделяется изолированная виртуальная машина со своей настольной ОС, что повышает безопасность, гибкость настроек и совместимость с тяжёлым ПО. Для типовой работы в 1С и офисе обычно хватает терминального сервера, а для ИБ, удалёнки и сложного ПО выбирают VDI."
  related_categories: [vdi_desktop_virt, terminal_access]
  related_families: [termidesk, basis_workplace, space_vdi, windows_server_rds_cal]

- id: faq_r3_choice_backup_vs_archive
  questions: ["чем отличается резервное копирование от архивации", "разница бэкап и архив данных", "зачем система бэкапа если есть архиватор", "бэкап или архив документов"]
  answer: "Резервное копирование (бэкап) предназначено для быстрого восстановления работоспособных серверов, баз данных и файлов после сбоя, ошибки или атаки шифровальщика по расписанию с контролем точек восстановления. Архивация нужна для долгосрочного хранения редко изменяемых файлов и документов (часто с сжатием и соблюдением сроков хранения), чтобы разгрузить основное хранилище. Архиватор вроде WinRAR не заменяет корпоративную систему резервного копирования."
  related_categories: [backup_recovery, archivers, sed_ecm]
  related_families: [cyber_backup, rubackup, winrar, directum_rx]

- id: faq_r3_choice_siem_vs_soar
  questions: ["чем отличается siem от soar", "разница siem и soar в soc", "зачем нужен soar если есть siem", "что выбрать siem или soar"]
  answer: "SIEM собирает логи со всей ИТ-инфраструктуры, коррелирует события и выявляет подозрительные инциденты информационной безопасности. SOAR (например, Security Vision, R-Vision) автоматизирует дальнейшую работу с этими инцидентами по сценариям (плейбукам): обогащает данными, ставит задачи, отправляет уведомления и запускает ответные действия. Сначала в компании обычно внедряют SIEM, а по мере роста числа инцидентов подключают SOAR."
  related_categories: [siem_soc]
  related_families: [pt_maxpatrol_siem, kaspersky_kuma, security_vision_soar, r_vision_soar]

- id: faq_r3_choice_iam_vs_pam
  questions: ["чем отличается idm от pam", "разница iam и pam систем", "что внедрять сначала idm или pam", "отличие управления доступом от контроля админов"]
  answer: "Системы IDM/IAM управляют жизненным циклом учётных записей и прав обычных сотрудников — автоматически выдают доступы при приёме на работу и отзывают при увольнении. Системы PAM фокусируются на привилегированных учётных записях (администраторы, подрядчики, root/domain admin): прячут пароли, проксируют подключения и ведут видеозапись сессий. Для крупной компании нужны оба класса, но при работе с внешними подрядчиками часто начинают с PAM."
  related_categories: [iam_pam_mfa, pam_jump_hosts]
  related_families: [avanpost_idm, solar_inrights, skdpu_nt, indeed_pam]

- id: faq_r3_choice_sast_vs_waf
  questions: ["чем отличается sast от waf", "разница анализатора кода и waf", "что лучше waf или проверка кода sast", "защита сайта waf или sast"]
  answer: "SAST (статический анализ исходного кода, например PT Application Inspector, PVS-Studio) ищет уязвимости и ошибки ещё на этапе разработки до публикации приложения. WAF (межсетевой экран веб-приложений, например PT AF, Гарда WAF) работает в бою перед сайтом или API и блокирует реальные атаки (SQL-инъекции, XSS, ботов) в сетевом трафике. В безопасной разработке (DevSecOps) оба инструмента дополняют друг друга."
  related_categories: [code_analysis_sast, waf_appsec]
  related_families: [pt_application_inspector, solar_appscreener, pt_af, garda_waf]
