# Роли и типовые рабочие места (АРМ) с комплектами ПО (Кузница Softline, поток Neon-2)
# Соответствует схеме kb/SCHEMA.md.
# Категории в `slots` — листовые id из kb/categories.yaml.
# `families` содержит явные id семейств из design/work/families_index.tsv (в порядке рекомендации для РФ юрлица);
# общеизвестные продукты перечислены в `products`.
# Всего ролей: 46.

- id: office_worker
  title: "Новый офисный сотрудник (универсальное рабочее место)"
  aliases: ["офисный сотрудник", "новый сотрудник", "рабочее место офиса", "базовый арм", "сотрудник офиса", "типовое рабочее место"]
  slots:
    - {category: desktop_os_ru, must: true, families: [astra_linux_se, red_os, alt_workstation], products: ["Astra Linux", "РЕД ОС", "Альт Рабочая станция"], note: "Российская ОС из реестра (или Windows 11 Pro при коммерческом парке)"}
    - {category: office_suite, must: true, families: [r7_office, myoffice_standard, yandex_360, alteroffice], products: ["Р7-Офис", "МойОфис Стандартный"], note: "Редакторы текстов, таблиц и презентаций"}
    - {category: endpoint_security, must: true, families: [kaspersky_kesb, drweb_enterprise_security_suite, pro32_endpoint_security], products: ["Kaspersky Endpoint Security", "Dr.Web Enterprise Security Suite"], note: "Антивирусная защита рабочей станции"}
    - {category: email_clients_calendars, must: true, families: [myoffice_mail, yandex_360, rupost, the_bat], products: ["МойОфис Почта", "Р7-Органайзер", "Яндекс 360"], note: "Корпоративная почта и календарь"}
    - {category: corporate_messengers, must: false, families: [vk_teams, express_messenger, pachca_messenger, compass_messenger], products: ["VK Teams", "eXpress", "Пачка"], note: "Корпоративный чат"}
    - {category: pdf_editors, must: false, families: [contentreader_pdf, master_pdf_editor], products: ["ContentReader PDF", "Мастер PDF Редактор"], note: "Просмотр и правка PDF"}

- id: remote_employee
