# Политика размещения плиток допродажи в основной ленте выдачи.
# Предел 50 % — верхняя граница безопасности, а не цель.
max_per_page: 3          # максимум плиток допродажи на первой странице (на 8 карточек)
page_window: 8           # опорное окно первой страницы (карточек)
max_share: 0.375         # максимум 3/8 (37.5 %) от числа основных карточек
min_first_position: 3    # первая плитка не раньше 3-й позиции (1-based; индекс вставки >= 2)
no_adjacent: true        # две плитки подряд не допускаются
