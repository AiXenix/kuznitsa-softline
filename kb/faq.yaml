  answer: "Часть зарубежных правообладателей прекратила официальные поставки и поддержку в РФ, поэтому их продукты не представлены в каталоге или доступны в сильно ограниченном перечне позиций. В выдаче по таким запросам мы честно сообщаем о статусе вендора и сразу предлагаем проверенные российские аналоги с сопоставлением форматов и сценариев миграции."
