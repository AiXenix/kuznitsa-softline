- id: faq_okpd2_ktru_software
  questions: ["какой код окпд2 у программного обеспечения", "как подобрать по под ктру", "код окпд2 для лицензий"]
  answer: "В закупочной документации лицензии на ПО чаще всего относятся к группировке ОКПД2 58.29 («Услуги по изданию прочего программного обеспечения» — системное, прикладное, онлайн-ПО), а сопутствующие ИТ-услуги — к 62.01 / 62.02. В поиске можно ввести код ОКПД2 или КТРУ, чтобы сузить выдачу до соответствующего класса ПО, но итоговый код в плане-графике всегда утверждает контрактная служба заказчика."
  related_categories: [desktop_os_ru, office_suite, endpoint_security]
  related_families: []
  related_products: ["Astra Linux", "Р7-Офис", "Kaspersky Endpoint Security"]
  tags: [okpd2, ktru, fz44]

- id: faq_gov_license_proof
  questions: ["кто может покупать государственные лицензии gov", "какие документы нужны для гослицензии", "отличие гослицензии от коммерческой"]
  answer: "Специальные государственные (GOV) прайсы предоставляются органам власти, государственным и муниципальным бюджетным/казённым учреждениям (а у ряда вендоров — учреждениям здравоохранения и культуры). Как правило, право на льготный прайс подтверждается реквизитами организации (ИНН, ОГРН, ОКВЭД/организационно-правовая форма) при оформлении счёта."
  related_categories: [office_suite, endpoint_security, desktop_os_ru]
