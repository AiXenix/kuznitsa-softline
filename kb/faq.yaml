- id: faq_accounting_nu_bu_software
  questions: ["как учесть лицензию на по в бухгалтерском учете", "неисключительные права это нма или расходы будущих периодов"]
  answer: "При покупке лицензии юрлицо обычно получает неисключительное право пользования (простую лицензию). Порядок отражения в бухгалтерском и налоговом учёте (в том числе в рамках действующих стандартов ФСБУ для НМА и списания по сроку действия лицензии) зависит от срока использования, лимита существенности и учётной политики организации; в закрывающих документах срок действия лицензии указывается явно."
