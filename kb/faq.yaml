- id: faq_esd_delivery_explained
  questions: ["что такое esd электронная лицензия", "как происходит электронная поставка по", "куда придет ключ после оплаты"]
  answer: "ESD (Electronic Software Delivery) — это электронная поставка лицензии: после зачисления оплаты и выпуска лицензии вендором на указанный e-mail (и в личный кабинет) приходят электронный ключ/сертификат и ссылка на официальный дистрибутив. Срок выпуска зависит от конкретного вендора и типа лицензии — от быстрого автоматического выпуска до нескольких рабочих дней для именных корпоративных сертификатов."
  related_categories: [endpoint_security, office_suite, desktop_os_windows]
  related_families: []
  related_products: []
  tags: [esd, delivery]

- id: faq_oem_vs_box_vs_esd
  questions: ["чем отличается oem от box и esd", "можно ли перенести oem лицензию на другой компьютер", "что лучше коробка или электронная лицензия"]
  answer: "OEM-лицензия поставляется вместе с новым оборудованием и привязывается к конкретному устройству (перенос на другой ПК запрещён). BOX/FPP (коробка) — физический комплект с носителем и документами, обычно допускает перенос при удалении со старого ПК. ESD / корпоративная электронная лицензия — самый быстрый и удобный формат для юрлиц без логистики коробок, полностью равнозначный по юридической силе при наличии закрывающих документов."
  related_categories: [desktop_os_windows, office_suite, accounting]
  related_families: []
  related_products: ["Microsoft Windows 11 Pro", "1С:Бухгалтерия 8"]
  tags: [oem, box, esd, delivery]

- id: faq_paper_certificate_fstec_pack
  questions: ["когда нужен бумажный формуляр и медиакит", "почему сертифицированная версия дороже и едет курьером", "нужен ли диск с голограммой для фстэк"]
  answer: "Для аттестуемых информационных систем (ГИС, ИСПДн, КИИ, гостайна) часто требуется сертифицированная редакция с бумажным формуляром, заверенной копией сертификата ФСТЭК/ФСБ, знаком соответствия и эталонным носителем (медиакитом). Такие комплекты нельзя поставить только по e-mail — они доставляются физически (курьером или спецсвязью в зависимости от требований), поэтому закладывайте время на логистику."
  related_categories: [desktop_os_ru, nsd_access_control, crypto_skzi, ngfw_vpn]
  related_families: []
  related_products: ["Astra Linux Special Edition", "Secret Net Studio", "КриптоПро CSP"]
  tags: [fstec, fsb, delivery, paper]

- id: faq_return_electronic_license
  questions: ["можно ли вернуть электронную лицензию по", "возврат ошибочно купленного ключа", "обмен лицензии после выпуска"]
  answer: "Программное обеспечение, поставляемое в виде именных или активируемых электронных лицензий, после выпуска ключей вендором, как правило, не подлежит стандартному возврату. Поэтому перед оплатой счёта критически важно проверить редакцию, совместимость с ОС, количество узлов и тип действия (новая или продление) — наш поиск помогает отсечь эти ошибки заранее."
  related_categories: [endpoint_security, office_suite]
