- id: faq_expired_license_grace_period
  questions: ["можно ли продлить просроченную лицензию", "что такое льготный период продления", "истек срок антивируса нужно покупать новый или продление"]
  answer: "Многие вендоры предусматривают льготный период после истечения срока лицензии, в течение которого ещё разрешено оформить продление по льготной цене (продолжительность периода индивидуальна у каждого производителя). Если просрочка превышает льготный период, вендор может потребовать покупку новой базовой лицензии — проверяйте статус до оплаты."
  related_categories: [endpoint_security, backup_recovery, cad_2d]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "Dr.Web", "Платформа nanoCAD"]
  tags: [renewal, grace_period]

- id: faq_addon_coterming
  questions: ["как докупить рабочие места к действующей лицензии", "что такое ко-терминг лицензий", "долицензирование на остаток срока"]
  answer: "При расширении штата (докупке/долицензировании, addon) корпоративные вендоры обычно предлагают ко-терминг: новые узлы добавляются к существующему ключу и выравниваются по дате окончания основной лицензии, чтобы компания не путалась в десятке разных сроков. Итоговая стоимость рассчитывается пропорционально оставшемуся сроку или по шкале общего числа узлов."
  related_categories: [endpoint_security, office_suite, onec_platform_licenses]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "МойОфис", "1С:Предприятие 8"]
  tags: [addon, coterming]

- id: faq_price_bands_tiers
  questions: ["как работают ценовые диапазоны лицензий", "почему на 25 пк цена за штуку ниже чем на 24", "как подобрать диапазон узлов"]
  answer: "Корпоративное ПО часто продаётся ступенчатыми диапазонами (tier/band, например 10–14, 15–24, 25–49, 50–99 узлов): чем выше диапазон, тем ниже цена за одно рабочее место. Если количество узлов находится рядом с границей следующего диапазона, иногда выгоднее взять минимальный объём следующего диапазона — наш калькулятор в выдаче подбирает корректный band автоматически."
  related_categories: [endpoint_security, office_suite, remote_desktop]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "Dr.Web", "Р7-Офис"]
  tags: [bands, pricing]

- id: faq_upgrade_edition
  questions: ["как сделать апгрейд редакции по", "переход с базовой на проф или корп", "доплата за повышение редакции"]
  answer: "Апгрейд (upgrade) позволяет перейти на старшую редакцию того же продукта (например, с 1С:Бухгалтерия Базовая на ПРОФ, с ПРОФ на КОРП, или с Kaspersky Стандартный на Расширенный) без оплаты полной стоимости новой поставки — зачитывается часть стоимости имеющейся лицензии. Для оформления потребуется подтвердить владение текущей лицензией."
  related_categories: [accounting, endpoint_security, rdbms]
  related_families: []
  related_products: ["1С:Бухгалтерия 8", "Kaspersky Endpoint Security", "Postgres Pro"]
  tags: [upgrade, licensing]

- id: faq_crossgrade_migration_discount
  questions: ["что такое кроссгрейд или конкурентный переход", "скидка при переходе с другого антивируса или офиса", "какие документы нужны для миграции со скидкой"]
  answer: "Конкурентный переход (crossgrade / миграция) — это специальная программа вендора со скидкой для компаний, переходящих с продукта конкурента (в том числе зарубежного). Как правило, для получения скидки нужно предоставить копию действующего или недавно истёкшего лицензионного сертификата либо платёжного документа на прежний продукт."
  related_categories: [endpoint_security, office_suite, server_virtualization, cad_2d]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "Dr.Web", "Р7-Офис", "МойОфис"]
  tags: [crossgrade, migration]

- id: faq_ksos_limit_to_kes
  questions: ["сколько максимум компьютеров поддерживает kaspersky small office security", "что делать если выросли выше 25 пк на ksos"]
  answer: "Kaspersky Small Office Security рассчитан на малый бизнес с ограниченным числом рабочих станций и серверов (как правило, до 25 устройств). При росте парка свыше лимита следует перейти на корпоративную линейку Kaspersky Endpoint Security для бизнеса с централизованной консолью управления и гибкой шкалой от 25 узлов и выше."
  related_categories: [endpoint_security]
  related_families: []
  related_products: ["Kaspersky Small Office Security", "Kaspersky Endpoint Security"]
  tags: [smb, upgrade]

- id: faq_multiyear_subscription_savings
  questions: ["выгодно ли брать лицензию на 2 или 3 года сразу", "фиксация цены при покупке подписки на несколько лет"]
  answer: "Оформление подписки сразу на 2 или 3 года обычно даёт скидку в пересчёте на один год по сравнению с ежегодным продлением, фиксирует цену на весь период (защита от индексации прайсов) и избавляет бухгалтерию и закупщиков от ежегодного согласования счетов."
  related_categories: [endpoint_security, office_suite, backup_recovery, vks_webinars]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "Р7-Офис", "Кибер Бэкап"]
  tags: [subscription, term]

- id: faq_license_transfer_between_entities
  questions: ["можно ли передать лицензию другому юрлицу внутри холдинга", "переоформление лицензии при реорганизации компании"]
  answer: "Большинство коммерческих лицензий привязаны к конкретному юридическому лицу-конечному пользователю и не подлежат свободной перепродаже. Переоформление прав возможно, как правило, только при официальной реорганизации, слиянии или по специальному письменному согласованию с правообладателем."
  related_categories: [office_suite, endpoint_security, accounting]
  related_families: []
  related_products: []
  tags: [legal, transfer]

- id: faq_lost_license_key_recovery
  questions: ["что делать если потеряли лицензионный ключ или сертификат", "как восстановить электронную лицензию"]
  answer: "Именные корпоративные лицензии фиксируются у правообладателя и поставщика по реквизитам организации (ИНН). При утере файла ключа или сертификата обратитесь к менеджеру или в поддержку вендора с реквизитами юрлица и закрывающими документами — доступ к личному кабинету и копию сертификата обычно можно восстановить."
  related_categories: [endpoint_security, office_suite, crypto_skzi]
  related_families: []
  related_products: []
  tags: [support, recovery]

# --- 4. МОДЕЛИ И МЕТРИКИ ЛИЦЕНЗИРОВАНИЯ (13) ---

- id: faq_subscription_vs_perpetual
  questions: ["чем отличается подписка от бессрочной лицензии", "что выгоднее бессрочная лицензия или годовая подписка", "capex или opex при покупке по"]
  answer: "Бессрочная лицензия (perpetual) даёт право пользоваться купленной версией без ограничения по времени (обычно дороже на старте, относится к CAPEX; обновления и техподдержка после базового срока оплачиваются отдельно). Подписка (subscription) действует выбранный срок (1–3 года), включает актуальные обновления на период действия и снижает порог входа (OPEX). Обратите внимание: антивирусы и облачные сервисы практически всегда поставляются только по подписке."
  related_categories: [office_suite, desktop_os_ru, cad_2d, crypto_skzi]
  related_families: []
  related_products: ["Р7-Офис", "МойОфис", "Платформа nanoCAD", "КриптоПро CSP"]
  tags: [subscription, perpetual]

- id: faq_antivirus_no_perpetual
  questions: ["почему нет бессрочного антивируса", "можно ли купить касперский или доктор веб навсегда"]
  answer: "Корпоративные антивирусы (Kaspersky, Dr.Web, PRO32) лицензируются только по срочной подписке (обычно на 1, 2 или 3 года), потому что ключевая ценность антивируса — непрерывное получение свежих антивирусных баз и обновлений движка против новых угроз. Без действующей подписки защита быстро устаревает."
  related_categories: [endpoint_security]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "Dr.Web Enterprise Security Suite", "PRO32"]
  tags: [perpetual, antivirus]

- id: faq_what_is_cal
  questions: ["что такое cal лицензия", "зачем покупать cal кроме windows server", "клиентские лицензии доступа"]
  answer: "CAL (Client Access License) — это клиентская лицензия доступа, дающая право пользователю или устройству обращаться к службам сервера (например, Windows Server, SQL Server). Она не является программой и не требует установки, но юридически обязательна в дополнение к самой серверной лицензии."
  related_categories: [server_os, terminal_access, rdbms]
  related_families: []
  related_products: ["Microsoft Windows Server CAL", "SQL Server CAL"]
  tags: [cal, server]

- id: faq_user_cal_vs_device_cal
  questions: ["в чем разница между user cal и device cal", "какие cal выбрать на пользователя или на устройство"]
  answer: "User CAL (на пользователя) выгодна, если один сотрудник работает с нескольких устройств (ПК, ноутбук, смартфон). Device CAL (на устройство) выгоднее при посменной работе, когда за одним общим компьютером или кассой в разное время работают несколько сотрудников. Обе модели юридически равнозначны — выбирайте ту, где требуется меньше лицензий."
  related_categories: [server_os, terminal_access]
  related_families: []
  related_products: ["Microsoft Windows Server User CAL", "Windows Server Device CAL"]
  tags: [cal, metric]

- id: faq_rds_cal_terminal
  questions: ["нужны ли отдельные rds cal для удаленного рабочего стола", "чем отличается rds cal от обычного windows server cal"]
  answer: "Да. Обычная Windows Server CAL даёт базовый доступ к серверу (файлы, печать, домен). Если сотрудники подключаются к серверу по протоколу удалённого рабочего стола (RDP / Remote Desktop Services) для запуска 1С или офисных программ на сервере, дополнительно требуются терминальные лицензии RDS CAL (на пользователя или на устройство), которые активируются на сервере лицензирования RDS."
  related_categories: [terminal_access, server_os]
  related_families: []
  related_products: ["Microsoft Windows Server RDS CAL"]
  tags: [rds, cal, terminal]

- id: faq_core_licensing_servers
  questions: ["как лицензируется по по ядрам", "как посчитать лицензии windows server по ядрам", "лицензирование субд по ядрам процессора"]
  answer: "При поядерном лицензировании (Windows Server, MS SQL Server, Postgres Pro Enterprise, часть серверного ПО) нужно покрыть лицензиями все физические ядра процессоров сервера с учётом минимальных порогов вендора (например, в Microsoft Windows Server лицензируются все физические ядра, но не менее установленного минимума на процессор и на сервер, пакетами по 2 или 16 ядер). При лицензировании СУБД по ядрам часто не требуются отдельные клиентские лицензии CAL."
  related_categories: [server_os, rdbms]
  related_families: []
  related_products: ["Microsoft Windows Server", "SQL Server", "Postgres Pro Enterprise"]
  tags: [core, metric, server]

- id: faq_socket_cpu_vm_licensing
  questions: ["как лицензируется виртуализация по сокетам или по вм", "что выгоднее лицензия на хост сокет или на виртуальную машину"]
  answer: "Платформы серверной виртуализации и системы резервного копирования (Брест, zVirt, Basis, Кибер Бэкап) часто лицензируются по физическим процессорам (сокетам/CPU) хоста либо по числу виртуальных машин (ВМ) / объёму данных (ТБ). При высокой плотности ВМ на мощном сервере лицензирование по сокетам обычно выгоднее, а для небольшого числа критичных ВМ — лицензирование по ВМ."
  related_categories: [server_virtualization, backup_recovery]
  related_families: []
  related_products: ["ПК СВ «Брест»", "zVirt", "Кибер Бэкап", "RuBackup"]
  tags: [socket, vm, metric]

- id: faq_concurrent_vs_named
  questions: ["в чем разница между плавающей и именной лицензией", "что такое конкурентная сетевая лицензия", "когда выгоднее плавающие лицензии"]
  answer: "Именная (named / локальная) лицензия закрепляется за конкретным сотрудником или рабочим местом. Плавающая (сетевая / конкурентная / floating) лицензия хранится на сервере лицензий и выдаётся пользователям по очереди в момент запуска программы. Для САПР, ВКС и удалённой техподдержки, которыми сотрудники пользуются не одновременно (или в смены), плавающие лицензии позволяют заметно сократить бюджет."
  related_categories: [cad_2d, mcad_plm, remote_desktop, vks_webinars]
  related_families: []
  related_products: ["Платформа nanoCAD", "КОМПАС-3D", "Ассистент"]
  tags: [concurrent, named, metric]

- id: faq_1c_licensing_basics
  questions: ["как посчитать лицензии 1с для компании", "нужна ли лицензия на сервер 1с", "отличие базовой проф и корп 1с"]
  answer: "Базовая версия 1С рассчитана на 1 рабочее место и не поддерживает многопользовательскую работу и доработки. Версия ПРОФ включает 1 рабочее место и допускает докупку пакетов клиентских лицензий (на 1, 5, 10, 20, 50, 100 и более одновременных сеансов), а также работу через отдельный сервер 1С (требуется лицензия на сервер x86-64 или МИНИ). Версия КОРП добавляет расширенный функционал для холдингов и сложных процессов."
  related_categories: [accounting, onec_platform_licenses]
  related_families: []
  related_products: ["1С:Бухгалтерия 8", "1С:Предприятие 8"]
  tags: [1c, licensing]

- id: faq_1c_its_why_needed
  questions: ["обязателен ли договор 1с итс", "чем отличается итс техно от итс проф"]
  answer: "Для версий 1С ПРОФ и КОРП действующий договор сопровождения (1С:ИТС / Комплект поддержки) необходим для легального получения обновлений платформы и конфигураций (включая актуальные формы налоговой отчётности). ИТС Техно даёт базовый доступ к обновлениям, а ИТС ПРОФ дополнительно включает популярные сервисы (1С-Отчётность на 1 юрлицо, 1С-Контрагент, 1С-ЭДО, линию консультаций)."
  related_categories: [tech_support, accounting]
  related_families: []
  related_products: ["1С:ИТС ПРОФ", "1С:ИТС Техно"]
  tags: [1c, its, support]

- id: faq_home_license_in_office
  questions: ["можно ли использовать домашний антивирус или офис в офисе ооо", "нарушение ли ставить бесплатные программы для дома в компании"]
  answer: "Нет, лицензионные соглашения (EULA) большинства домашних и бесплатных «для личного использования» продуктов прямо запрещают коммерческое использование юридическими лицами. Для ООО и корпоративных сетей необходимо приобретать коммерческие/бизнес-лицензии — они также обеспечивают централизованное управление, поддержку и юридическую чистоту при аудите."
  related_categories: [endpoint_security, office_suite, home_antivirus]
  related_families: []
  related_products: ["Kaspersky Small Office Security", "Kaspersky Endpoint Security", "Р7-Офис"]
  tags: [audit, legal, audience]

- id: faq_cryptopro_terminal_licensing
  questions: ["как лицензируется криптопро на терминальном сервере", "нужна ли серверная лицензия криптопро csp"]
  answer: "Для работы КриптоПро CSP на одиночном ПК достаточно клиентской лицензии на рабочее место. Если КриптоПро устанавливается на терминальный сервер (RDS) или веб-сервер для обслуживания множества пользователей, применяется серверная лицензия КриптоПро CSP (при этом конкретная схема учёта рабочих мест зависит от архитектуры подключения и правил вендора)."
  related_categories: [crypto_skzi, terminal_access]
  related_families: []
  related_products: ["КриптоПро CSP"]
  tags: [cryptopro, terminal, server]

- id: faq_vks_license_metrics
  questions: ["как лицензируется видеоконференцсвязь по организаторам или по участникам", "чем отличаются тарифы вкс"]
  answer: "Облачные сервисы ВКС (Контур.Толк, МТС Линк) обычно лицензируются по числу организаторов встреч (киосков/комнат) и максимальной вместимости одной конференции (например, до 100, 200 или 500 участников), тогда как серверные on-premise системы (TrueConf Server, IVA MCU) часто лицензируются по числу одновременных подключений или зарегистрированных пользователей."
  related_categories: [vks_webinars]
  related_families: []
  related_products: ["Контур.Толк", "МТС Линк", "TrueConf Server", "IVA MCU"]
  tags: [vks, metric]

# --- 5. ИБ, СЕРТИФИКАЦИЯ ФСТЭК И ФСБ, КОМПЛАЕНС (10) ---

- id: faq_fstec_certified_vs_regular
  questions: ["что такое фстэк сертифицированная версия по", "чем отличается сертифицированная версия от обычной", "нужен ли сертификат фстэк коммерческой компании"]
  answer: "Сертифицированная ФСТЭК версия проходит инспекционные испытания на соответствие требованиям по безопасности информации и уровням доверия, имеет фиксированную контрольную сумму дистрибутива и поставляется с формуляром и знаком соответствия. Она обязательна для ГИС (приказ №17), значимых объектов КИИ (приказ №239), АСУ ТП (приказ №31), работы с гостайной и ряда категорий ИСПДн (152-ФЗ, приказ №21). Для обычного офиса без аттестуемых систем достаточно несертифицированной коммерческой версии."
  related_categories: [desktop_os_ru, endpoint_security, nsd_access_control, ngfw_vpn]
  related_families: []
  related_products: ["Astra Linux Special Edition", "Kaspersky Endpoint Security (ФСТЭК)", "Secret Net Studio"]
  tags: [fstec, certs]

- id: faq_astra_orel_voronezh_smolensk
  questions: ["чем отличается астра линукс орел воронеж смоленск", "какой уровень защищенности astra linux выбрать"]
  answer: "В Astra Linux Special Edition предусмотрены три уровня защищённости в рамках единого дистрибутива: «Орёл» (базовый — для повседневных бизнес-задач без строгих требований регуляторов), «Воронеж» (усиленный — для ИСПДн, ГИС и КИИ с обработкой конфиденциальной информации) и «Смоленск» (максимальный — с мандатным управлением доступом, в том числе для закрытых контуров и сведений, составляющих гостайну)."
  related_categories: [desktop_os_ru, server_os]
  related_families: []
  related_products: ["Astra Linux Special Edition"]
  tags: [astra, fstec, os]

- id: faq_fsb_license_for_buyer
  questions: ["нужна ли лицензия фсб чтобы купить криптопро или vipnet", "может ли обычное ооо купить скзи без лицензии фсб"]
  answer: "Обычной компании (конечному пользователю) для покупки и использования СКЗИ (КриптоПро CSP, ViPNet Client) для собственных нужд (сдача отчётности, ЭДО, банк-клиент, защищённый VPN) лицензия ФСБ не требуется. Лицензия ФСБ нужна именно поставщику/интегратору для распространения и обслуживания СКЗИ, а также организациям, оказывающим криптографические услуги третьим лицам."
  related_categories: [crypto_skzi, ngfw_vpn, tokens_pki]
  related_families: []
  related_products: ["КриптоПро CSP", "ViPNet Client", "Континент АП"]
  tags: [fsb, skzi]

- id: faq_skzi_classes_ks1_ks2_ks3
  questions: ["что такое классы скзи кс1 кс2 кс3", "какой класс скзи нужен для 152 фз"]
  answer: "КС1, КС2 и КС3 — это классы средств криптографической защиты информации по классификации ФСБ, определяющие стойкость к модели нарушителя (от внешних угроз до инсайдеров с доступом к оборудованию). Требуемый класс СКЗИ определяется моделью угроз информационной системы (для базовых задач ЭП и ИСПДн часто достаточно КС1/КС2, для повышенных требований и ГИС — КС2/КС3)."
  related_categories: [crypto_skzi, ngfw_vpn]
  related_families: []
  related_products: ["КриптоПро CSP", "Континент 4", "ViPNet"]
  tags: [fsb, skzi, fz152]

- id: faq_152fz_software_set
  questions: ["какое по нужно для соблюдения 152 фз", "что купить для защиты персональных данных испдн"]
  answer: "Состав программных средств для защиты ИСПДн по 152-ФЗ и приказу ФСТЭК №21 зависит от уровня защищённости (УЗ-1…УЗ-4) и модели угроз. Типовой набор включает сертифицированные средства: антивирусную защиту, СЗИ от несанкционированного доступа (Secret Net Studio / Dallas Lock), межсетевой экран (UserGate / Континент), СКЗИ для защищённых каналов связи (ViPNet / Континент / КриптоПро) и при необходимости сканер уязвимостей."
  related_categories: [nsd_access_control, endpoint_security, ngfw_vpn, crypto_skzi]
  related_families: []
  related_products: ["Secret Net Studio", "Dallas Lock", "Kaspersky Endpoint Security", "UserGate"]
  tags: [fz152, compliance]

- id: faq_dlp_vs_employee_monitoring
  questions: ["чем отличается dlp от системы учета рабочего времени", "что выбрать dlp или мониторинг сотрудников"]
  answer: "Системы учёта рабочего времени (Стахановец, Kickidler, CrocoTime) фокусируются на продуктивности: фиксируют активность в приложениях, опоздания и скриншоты. DLP-системы (InfoWatch, SearchInform КИБ, Гарда DLP) решают задачу информационной безопасности: анализируют содержимое писем, чатов, печати и USB на наличие конфиденциальных данных, ПДн и чертежей и умеют автоматически блокировать утечку."
  related_categories: [dlp, employee_monitoring]
  related_families: []
  related_products: ["InfoWatch Traffic Monitor", "SearchInform КИБ", "Стахановец", "Kickidler"]
  tags: [dlp, monitoring, compare]

- id: faq_antivirus_vs_edr
  questions: ["в чем разница между обычным антивирусом и edr", "зачем компании edr если есть антивирус"]
  answer: "Классический антивирус (EPP) предотвращает известные и типовые угрозы на конечной точке. EDR/XDR (например, Kaspersky Symphony EDR, PT XDR) дополнительно непрерывно записывает телеметрию процессов, выявляет сложные бесфайловые и целевые атаки, строит граф инцидента и позволяет ИБ-аналитику удалённо изолировать заражённый узел и откатить вредоносные изменения."
  related_categories: [endpoint_security, edr_xdr]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "Kaspersky Symphony EDR", "PT XDR"]
  tags: [edr, antivirus, compare]

- id: faq_pam_why_needed
  questions: ["что такое pam система и зачем она нужна", "как контролировать подрядчиков и администраторов"]
  answer: "PAM (Privileged Access Management — например, СКДПУ НТ, Indeed PAM, Solar SafeInspect) контролирует доступ пользователей с правами администратора и внешних подрядчиков к критичным серверам и БД. Система скрывает реальные пароли, выдаёт временный доступ по заявке, ведёт видеозапись и текстовый лог всех команд, а также позволяет мгновенно разорвать подозрительную сессию."
  related_categories: [iam_pam_mfa, pam_jump_hosts]
  related_families: []
  related_products: ["СКДПУ НТ", "Indeed PAM", "Solar SafeInspect"]
  tags: [pam, security]

- id: faq_siem_vs_log_collector
  questions: ["что такое siem и нужен ли он среднему бизнесу", "взаимодействие siem с госсопка"]
  answer: "SIEM (MaxPatrol SIEM, Kaspersky KUMA, RuSIEM) собирает журналы событий безопасности со всех серверов, СЗИ, сетевых устройств и АРМ, автоматически связывает разрозненные события в инциденты (корреляция) и помогает выполнять требования регуляторов, включая передачу данных об инцидентах в ГосСОПКА для субъектов КИИ."
  related_categories: [siem_soc]
  related_families: []
  related_products: ["MaxPatrol SIEM", "Kaspersky KUMA", "RuSIEM"]
  tags: [siem, kii]

- id: faq_usb_token_vs_flash
  questions: ["чем рутокен или jacarta отличается от обычной флешки", "можно ли хранить эцп на обычной флешке"]
