- id: faq_edo_diadoc_sbis
  questions: ["работаете ли вы по эдо диадок и сбис", "как получить закрывающие документы по эдо", "отгрузка лицензий через эдо"]
  answer: "Да, для B2B-клиентов поддерживается обмен юридически значимыми документами через основные операторы ЭДО (Контур.Диадок, СБИС и роуминг). Это ускоряет получение акта/УПД бухгалтерией без ожидания бумажной почты."
