# --- 2. ДОКУМЕНТЫ, ОПЛАТА ПО СЧЁТУ, ЭДО, ПОСТАВКА (10) ---

- id: faq_b2b_invoice_and_docs
  questions: ["как купить по по безналу на юрлицо", "какие закрывающие документы выдаются при покупке лицензии", "договор на передачу неисключительных прав"]
  answer: "Юридические лица и ИП оплачивают заказ по безналичному счёту. После поставки оформляется полный комплект закрывающих документов: договор (или оферта-счёт), универсальный передаточный документ (УПД) или акт приёма-передачи неисключительных прав, а также электронный лицензионный сертификат от вендора (если предусмотрен его политикой)."
