- id: faq_bitrix24_vs_amocrm
  questions: ["что выбрать битрикс24 или amocrm", "сравнение crm для отдела продаж"]
  answer: "amoCRM сфокусирована на быстрой воронке продаж, работе с лидами и мессенджерами (только облако). Битрикс24 — более широкий комбайн: помимо CRM включает корпоративный портал, задачи, чаты, диски, интеграцию с 1С и выпускается как в облачной, так и в коробочной (on-premise) версии."
  related_categories: [crm_systems]
  related_families: []
  related_products: ["Битрикс24", "amoCRM"]
  tags: [crm, compare]

- id: faq_kaspersky_vs_drweb
  questions: ["что выбрать касперский или доктор веб для бизнеса", "сравнение kaspersky и dr web"]
  answer: "Оба вендора — российские лидеры ИБ, входят в ЕРРП, имеют версии с сертификатами ФСТЭК и поддерживают Windows и российские Linux-ОС. Kaspersky выделяется широкой экосистемой (KES, EDR, KATA, KUMA, KICS для АСУ ТП) и гибкой центральной консолью KSC; Dr.Web часто ценят за модульное лицензирование (можно собрать только нужные компоненты для серверов, шлюзов или АРМ) и выгодные условия для образования и госсектора."
  related_categories: [endpoint_security]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "Dr.Web Enterprise Security Suite"]
  tags: [antivirus, compare]

- id: faq_migration_roadmap_steps
  questions: ["с чего начать импортозамещение по в компании", "как перейти с windows и office на российское по без остановки работы"]
  answer: "Безопасная миграция строится в 4 шага: 1) аудит парка ПК, списка программ, макросов и периферии (принтеры, токены, сканеры); 2) выбор совместимого целевого стека (например, Astra Linux / РЕД ОС + ALD Pro / РЕД АДМ + Р7 / МойОфис + антивирус); 3) пилот на 5–10% пользователей разных отделов (бухгалтерия, продажи, ИТ); 4) поэтапный перевод отделов с обучением сотрудников и расширенной поддержкой."
  related_categories: [desktop_os_ru, office_suite, directory_services, tech_support]
  related_families: []
  related_products: ["Astra Linux", "РЕД ОС", "ALD Pro", "Р7-Офис"]
  tags: [migration, import_substitution]
