  answer: "Многие российские вендоры (например, антивирусов и офисных пакетов) предусматривают специальные тарифы для государственных медицинских учреждений и зарегистрированных некоммерческих организаций (НКО). Для применения льготной цены при заказе требуется указать ИНН и подтвердить статус организации."
