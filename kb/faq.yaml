# --- 1. НДС, РЕЕСТР МИНЦИФРЫ, 44-ФЗ / 223-ФЗ (12) ---

- id: faq_vat_exemption_registry
  questions: ["почему по из реестра без ндс", "какое по продается без ндс", "льгота по ндс на программное обеспечение", "облагается ли ндс лицензия по"]
  answer: "Передача неисключительных прав на программы, включённые в Единый реестр российского ПО (ЕРРП), освобождается от НДС на основании пп. 26 п. 2 ст. 149 НК РФ. Зарубежное ПО, не включённое в реестр, а также отдельные сопутствующие услуги (внедрение, обучение, настройка) и оборудование (например, USB-токены) облагаются НДС по действующей ставке. В выдаче нашего каталога налоговый статус отображается на каждой карточке."
  related_categories: [office_suite, desktop_os_ru, endpoint_security]
  related_families: []
  related_products: ["Astra Linux", "Р7-Офис", "МойОфис", "Kaspersky Endpoint Security"]
  tags: [vat, registry, accounting]

- id: faq_vat_deduction_choice
  questions: ["нужно по с ндс к вычету", "почему в одном заказе часть позиций с ндс а часть без", "услуги внедрения с ндс или без"]
  answer: "Освобождение от НДС применяется к передаче прав на ПО из реестра Минцифры в силу закона — отказаться от этой льготы продавец не может. Если в одном счёте есть лицензии из ЕРРП и, например, аппаратный носитель (токен) или услуги настройки, то лицензии пройдут без НДС, а оборудование и услуги — с выделенным НДС."
  related_categories: [tokens_pki, tech_support]
  related_families: []
  related_products: ["КриптоПро CSP", "Рутокен ЭЦП 3.0"]
  tags: [vat, accounting]

- id: faq_what_is_errp
  questions: ["что такое единый реестр российского по", "что дает наличие по в еррп", "зачем нужен реестр минцифры"]
  answer: "Единый реестр российского программного обеспечения (ЕРРП) ведёт Минцифры России. Включение продукта в реестр подтверждает его отечественное происхождение, позволяет закупать его по 44-ФЗ и 223-ФЗ в рамках национального режима, использовать на объектах КИИ и в госсекторе, а также применять освобождение от НДС при передаче прав."
  related_categories: [desktop_os_ru, office_suite, rdbms]
  related_families: []
  related_products: ["Astra Linux", "РЕД ОС", "Р7-Офис", "Postgres Pro"]
  tags: [registry, compliance]

- id: faq_registry_partial_editions
  questions: ["все ли редакции продукта входят в реестр", "почему у вендора одна версия в реестре а другая нет", "проверка редакции в реестре минцифры"]
  answer: "У некоторых производителей в Единый реестр российского ПО включены не все продукты или не все редакции линейки (например, корпоративная версия включена, а часть модулей или облачных сервисов — нет). Перед публикацией тендера всегда сверяйте точное наименование редакции и актуальный статус записи на официальном портале реестра Минцифры."
  related_categories: [endpoint_security, office_suite, rdbms]
  related_families: []
  related_products: ["Kaspersky Endpoint Security", "МойОфис", "Postgres Pro"]
  tags: [registry, gov]

- id: faq_procurement_44fz_223fz
  questions: ["как закупить по по 44 фз", "правила закупки программного обеспечения по 223 фз", "можно ли купить иностранное по по 44 фз"]
  answer: "При закупках по 44-ФЗ и 223-ФЗ действует национальный режим: приоритет и обязательное требование касаются ПО из Единого реестра российского ПО (и реестра евразийского ПО). Закупка иностранного ПО допускается только при наличии документально обоснованного отсутствия отечественных аналогов с нужными характеристиками в установленном законом порядке."
  related_categories: [desktop_os_ru, office_suite, endpoint_security]
  related_families: []
  related_products: ["Astra Linux", "Р7-Офис", "МойОфис", "Kaspersky Endpoint Security"]
  tags: [fz44, fz223, gov]

- id: faq_nmck_three_quotes
  questions: ["как обосновать нмцк на программное обеспечение", "как получить три кп для тендера на по", "как сравнить аналоги для закупки"]
  answer: "Для обоснования начальной максимальной цены контракта (НМЦК) методом сопоставимых рыночных цен обычно запрашивают коммерческие предложения от нескольких поставщиков или по сопоставимым реестровым продуктам одного класса. В нашем поиске можно сравнить характеристики нескольких реестровых аналогов и запросить расчёт КП под нужный объём лицензий."
  related_categories: [office_suite, desktop_os_ru, endpoint_security, vks_webinars]
  related_families: []
  related_products: ["Р7-Офис", "МойОфис", "Astra Linux", "РЕД ОС"]
