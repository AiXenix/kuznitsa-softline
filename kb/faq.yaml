  tags: [return, b2b]

- id: faq_proof_of_license_audit
  questions: ["как подтвердить лицензионность по при проверке", "какие документы доказывают легальность электронной лицензии"]
  answer: "Легальность использования ПО юрлицом подтверждается комплектом: договор/счёт-оферта с поставщиком, платёжное поручение, подписанный акт/УПД на передачу неисключительных прав и именной лицензионный сертификат или файл ключа от правообладателя. Физическая коробка или наклейка для корпоративных электронных лицензий не обязательна."
