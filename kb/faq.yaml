- id: faq_edu_academic_eligibility
  questions: ["кто имеет право на академическую лицензию edu", "может ли коммерческий учебный центр купить edu лицензию", "скидки на по для школ и вузов"]
  answer: "Образовательные (академические, EDU) лицензии предназначены для лицензированных образовательных учреждений: школ, колледжей, вузов, а у части вендоров — для организаций дополнительного образования. Коммерческие учебные центры без образовательной лицензии или компании для внутренних отделов обучения, как правило, должны приобретать коммерческие лицензии (точные критерии зависят от правил конкретного вендора)."
  related_categories: [office_suite, desktop_os_ru, cad_2d, mcad_plm]
