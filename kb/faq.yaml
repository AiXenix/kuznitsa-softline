  questions: ["почему у товара написано цена по запросу", "как узнать стоимость корпоративного siem или dlp"]
  answer: "Сложные корпоративные системы (SIEM, DLP, NGFW, ERP, серверная виртуализация) рассчитываются индивидуально: итоговая цена зависит от архитектуры, числа активов/событий (EPS), модулей, уровня техподдержки (SLA) и проектных скидок вендора. Оставьте заявку на КП прямо из карточки — параметры из вашего запроса и профиля подставятся автоматически."
