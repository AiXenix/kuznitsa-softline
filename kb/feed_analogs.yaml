# feed_analogs.yaml — карта аналогов для умного поиска store.softline.ru (каталог фида 2026-11, real-cards.tsv)
#
# Назначение: если товара нет в каталоге или покупатель прямо просит аналог/замену
# («аналог TeamViewer», «чем заменить AutoCAD», «российский аналог Photoshop»),
# поиск показывает близкие по назначению товары, которые реально продаются в магазине.
#
# Формат — список записей YAML (UTF-8):
#
# - id: teamviewer                      # латиница snake_case, уникален в файле
#   names: [TeamViewer, тимвьюер, тим вьюер]   # как пишут покупатели: оригинал, кириллица, сокращения;
#                                       # без однословных общих слов; каждое написание — только в одной записи
#   kind: remote_access                 # короткий тип продукта латиницей
#   in_catalog: true                    # есть ли сам продукт в real-cards.tsv (TeamViewer — есть)
#   sections: ["Другие решения удаленного доступа", "Российские решения удаленного доступа (Импортозамещение)"]
#                                       # заголовки разделов фида буква в букву (последний элемент path
#                                       # в real-categories.tsv), только разделы с предложениями
#   analogs:                            # конкретные карточки каталога по приоритету (обычно 3–8 шт.)
#     - {title: "AnyDesk", vendor: "AnyDesk"}
#     # title  — подстрока названия карточки (регистр не важен); вместе с vendor однозначно
#     #          находит карточку или одну линейку карточек в real-cards.tsv
#     # vendor — поле vendor карточки буква в букву
#     - {title: "RuDesktop", vendor: "RuDesktop", russian: true}
#     # russian: true — российский продукт (для запросов «российский аналог», «импортозамещение»)
#   note: "Удалённый доступ к рабочему столу"   # короткое пояснение для выдачи
#
# Правила:
# - для in_catalog: false аналоги — замена отсутствующему продукту; для in_catalog: true — конкурирующие
#   продукты из каталога (сам продукт в analogs не входит);
# - аналоги только реально близкие по назначению; если подходящих карточек нет — analogs: [],
#   а sections показывают, в каком разделе искать («в каталоге нет, смотрите раздел …»);
# - все title/vendor/sections проверены скриптом по real-cards.tsv и real-categories.tsv.

# ============================================================================
# ГРАФИКА, ФОТО, ДИЗАЙН ИНТЕРФЕЙСОВ, ДИАГРАММЫ
# ============================================================================

